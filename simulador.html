<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador Industrial - Sistemas de Motores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --grid-color: rgba(255, 255, 255, 0.05);
            --bg-color: #0f172a;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Previne scroll da página inteira */
            background-color: var(--bg-color);
            color: #f8fafc;
            touch-action: none; /* Desabilita pull-to-refresh no mobile */
        }

        #workspace {
            position: relative;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 20px 20px;
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: grab;
        }
        
        #workspace:active {
            cursor: grabbing;
        }

        /* Nova camada para controle de Pan e Zoom */
        #canvas-pan-zoom {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
        }

        #wire-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Deixa os cliques passarem para os componentes */
            z-index: 10;
            overflow: visible;
        }

        .wire-path {
            fill: none;
            stroke: #ef4444; /* Cor vermelha para os cabos de força/comando padrão */
            stroke-width: 4;
            stroke-linecap: round;
            pointer-events: stroke; /* Permite clicar no cabo para deletar */
            cursor: pointer;
            transition: stroke 0.2s, stroke-width 0.2s;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.5));
        }

        .wire-path:hover {
            stroke: #fbbf24;
            stroke-width: 6;
        }

        .component-node {
            position: absolute;
            border-radius: 8px;
            user-select: none;
            touch-action: none;
            z-index: 20;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.25);
            transition: box-shadow 0.2s;
        }

        .component-node.dragging {
            z-index: 50;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.8), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            opacity: 0.9;
        }
        
        .component-header {
            background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
            padding: 4px 8px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #f1f5f9;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #475569;
            border-bottom: none;
            cursor: grab;
        }

        .component-header:active {
            cursor: grabbing;
        }

        .component-body {
            position: relative;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 0 0 8px 8px;
        }
        
        .component-body svg {
            display: block;
            border-radius: 0 0 8px 8px;
        }

        .ports-container {
            display: flex;
            justify-content: space-evenly;
            width: 100%;
            position: absolute;
            z-index: 30;
            left: 0;
        }
        
        .ports-container.top { top: -6px; }
        .ports-container.bottom { bottom: -6px; }
        
        /* Ajuste específico para o Inversor e CLP onde os bornes ficam em recuos */
        .inset-ports.top { top: 12px; }
        .inset-ports.bottom { bottom: 12px; }

        .port-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .port {
            width: 14px;
            height: 14px;
            background-color: #cbd5e1;
            border: 1px solid #334155;
            border-radius: 50%;
            cursor: crosshair;
            position: relative;
            transition: all 0.2s;
            /* Textura de parafuso Phillips realista */
            background-image: 
                linear-gradient(45deg, transparent 42%, #475569 45%, #475569 55%, transparent 58%),
                linear-gradient(-45deg, transparent 42%, #475569 45%, #475569 55%, transparent 58%);
            box-shadow: inset 0 -2px 4px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.8), 0 1px 2px rgba(0,0,0,0.5);
        }

        .port:hover, .port.active {
            background-color: #fbbf24;
            transform: scale(1.3);
            background-image: none; /* Destaca a bolinha de conexão ao passar o mouse */
            box-shadow: 0 0 10px #f59e0b, inset 0 -1px 2px rgba(0,0,0,0.4);
            z-index: 40;
        }

        .port-label {
            position: absolute;
            font-size: 0.55rem;
            font-weight: 700;
            color: #0f172a;
            background: rgba(241, 245, 249, 0.9);
            padding: 1px 3px;
            border-radius: 3px;
            border: 1px solid #94a3b8;
            pointer-events: none;
            white-space: nowrap;
            z-index: 35;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            font-family: 'JetBrains Mono', monospace;
        }
        .ports-container.top .port-label { top: -18px; }
        .ports-container.bottom .port-label { bottom: -18px; }
        
        .inset-ports.top .port-label { top: -14px; background: transparent; color: #fff; border: none; text-shadow: 0 1px 2px #000;}
        .inset-ports.bottom .port-label { bottom: -14px; background: transparent; color: #fff; border: none; text-shadow: 0 1px 2px #000;}

        .sidebar-item {
            transition: transform 0.2s, background-color 0.2s;
        }
        .sidebar-item:hover {
            transform: translateY(-2px);
            background-color: #334155;
        }
        
        /* Sistema de colapso da barra lateral */
        #sidebar {
            transition: width 0.3s ease, min-width 0.3s ease, opacity 0.2s;
        }
        #sidebar.collapsed {
            width: 0;
            min-width: 0;
            overflow: hidden;
            opacity: 0;
            border-right: none;
        }

        .canvas-toolbar {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(4px);
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 4px;
            display: flex;
            gap: 4px;
            z-index: 50;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .canvas-toolbar button {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            color: #cbd5e1;
            transition: all 0.2s;
        }
        
        .canvas-toolbar button:hover {
            background: #334155;
            color: #fff;
        }

        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .toast {
            background: #1e293b;
            border-left: 4px solid #3b82f6;
            color: white;
            padding: 12px 20px;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease-out forwards;
            font-size: 0.875rem;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        .digital-font { font-family: 'JetBrains Mono', monospace; font-weight: bold; }
    </style>
</head>

            </div>

        <div class="flex items-center gap-2 sm:gap-4">

            </div>

            <!-- Barra de Ferramentas da Bancada (Zoom e Save) -->
            <div class="canvas-toolbar">
                <button onclick="zoomIn()" title="Aumentar Zoom (Scroll Up)"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                <button onclick="zoomOut()" title="Diminuir Zoom (Scroll Down)"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                <button onclick="resetZoomPan()" title="Centralizar Visualização"><i class="fa-solid fa-expand"></i></button>
                <div class="w-px h-6 bg-slate-600 mx-1 my-auto"></div>
                <button onclick="exportCircuit()" title="Salvar Projeto (Download)"><i class="fa-solid fa-floppy-disk text-blue-400"></i></button>
                <button onclick="document.getElementById('import-file').click()" title="Carregar Projeto (Upload)"><i class="fa-solid fa-folder-open text-yellow-400"></i></button>

            </div>

            <!-- Camada que sofre Zoom e Pan -->
            <div id="canvas-pan-zoom">
                <!-- Camada SVG para desenhar os fios -->
                <svg id="wire-layer"></svg>
                
                <!-- Linha indicadora enquanto desenha um fio -->
                <svg id="drawing-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none z-10" style="display: none; overflow: visible;">
                    <path id="drawing-wire" class="wire-path" stroke-dasharray="5,5" opacity="0.6"></path>
                </svg>
                
                <!-- Container para as caixas de ferramentas/componentes -->

            </div>
            
            <!-- Instrução inicial na tela -->

                    <i class="fa-solid fa-arrows-up-down-left-right text-5xl mb-4"></i>

                    <p class="text-md mt-2">Scroll do mouse para Zoom In/Out</p>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-container"></div>

                svg: `

                    <!-- Corpo -->
                    <rect x="25" y="40" width="105" height="65" fill="#0f766e" rx="8" /> <!-- Cor Teal para diferenciar -->
                    <!-- Aletas -->
                    <line x1="30" y1="50" x2="125" y2="50" stroke="#115e59" stroke-width="3"/>

                    <rect x="55" y="15" width="40" height="25" fill="#cbd5e1" rx="4" stroke="#94a3b8" stroke-width="1"/>

        let nodes = []; 
        let wires = []; 
        let nodeIdCounter = 0;
        let wireIdCounter = 0;
        let drawingWire = null; 
        
        // Variaveis da expansão de tela (Pan & Zoom)
        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isPanning = false;
        let startPanX, startPanY;
        
        const workspace = document.getElementById('workspace');
        const canvasPanZoom = document.getElementById('canvas-pan-zoom');
        const wireLayer = document.getElementById('wire-layer');
        const drawingLayer = document.getElementById('drawing-layer');
        const drawingWirePath = document.getElementById('drawing-wire');
        const componentsContainer = document.getElementById('components-container');

        function updateTransform() {
            canvasPanZoom.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            updateAllWires(); // Recalcula bezier se a escala mudar visualmente
        }

        // Função de Zoom (Wheel)
        workspace.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomSensitivity = 0.1;
            const delta = e.deltaY > 0 ? -1 : 1;
            const newScale = Math.min(Math.max(0.4, scale + delta * zoomSensitivity), 2.5);
            
            // Zoom em direção ao cursor do mouse
            const rect = workspace.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            // Ajusta o Pan para manter o mouse fixo no mesmo ponto do grid
            panX = mouseX - (mouseX - panX) * (newScale / scale);
            panY = mouseY - (mouseY - panY) * (newScale / scale);
            
            scale = newScale;
            updateTransform();
        }, { passive: false });

        // Função de Pan (Arrastar Tela)
        workspace.addEventListener('pointerdown', (e) => {
            // Inicia Pan se clicar com botão do meio (1) ou com Shift
            if (e.button === 1 || (e.button === 0 && e.shiftKey)) { 
                isPanning = true;
                startPanX = e.clientX - panX;
                startPanY = e.clientY - panY;
                workspace.style.cursor = 'grabbing';
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (isPanning) {
                panX = e.clientX - startPanX;
                panY = e.clientY - startPanY;
                updateTransform();
            }
        });

        window.addEventListener('pointerup', () => {
            if (isPanning) {
                isPanning = false;
                workspace.style.cursor = 'grab';
            }
        });

        // Controles de barra
        function zoomIn() { scale = Math.min(scale + 0.2, 2.5); centerPan(); }
        function zoomOut() { scale = Math.max(scale - 0.2, 0.4); centerPan(); }
        function resetZoomPan() { scale = 1; panX = 0; panY = 0; updateTransform(); }
        function centerPan() {
            // Aproximação pro centro (melhoria futura: centralizar base no bounding box)
            updateTransform();
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
        }

        function initPalette() {
            const palette = document.getElementById('component-palette');
            const categories = {};
            
            componentLibrary.forEach(comp => {
                if(!categories[comp.category]) categories[comp.category] = [];
                categories[comp.category].push(comp);
            });

            for(let cat in categories) {
                const title = document.createElement('div');
                title.className = 'text-[10px] font-bold text-slate-500 mt-4 mb-2';
                title.innerText = cat;
                palette.appendChild(title);

                categories[cat].forEach(comp => {
                    const item = document.createElement('div');
                    item.className = 'sidebar-item bg-slate-800 border border-slate-700 rounded-lg p-2 flex items-center gap-3 cursor-grab text-white select-none';
                    item.draggable = true;
                    item.dataset.type = comp.type;
                    
                    const svgWrap = document.createElement('div');
                    svgWrap.className = 'w-10 h-10 flex items-center justify-center shrink-0';
                    let miniSvg = comp.svg.replace('width="100%"', 'width="30"').replace('height="100%"', 'height="30"');
                    svgWrap.innerHTML = miniSvg;
                    
                    const nameWrap = document.createElement('div');
                    nameWrap.className = 'text-xs font-medium';
                    nameWrap.innerText = comp.name;

                    item.appendChild(svgWrap);
                    item.appendChild(nameWrap);
                    
                    item.addEventListener('dragstart', (e) => {
                        e.dataTransfer.setData('text/plain', comp.type);
                        e.dataTransfer.setData('offsetX', e.offsetX);
                        e.dataTransfer.setData('offsetY', e.offsetY);
                    });
                    
                    item.addEventListener('touchstart', handleTouchStartPalette, {passive: false});
                    palette.appendChild(item);
                });
            }
        }

        workspace.addEventListener('dragover', (e) => {
            e.preventDefault(); 
            e.dataTransfer.dropEffect = 'copy';
        });

        workspace.addEventListener('drop', (e) => {
            e.preventDefault();
            const type = e.dataTransfer.getData('text/plain');
            if (type) {
                document.getElementById('welcome-text').style.display = 'none';
                const rect = workspace.getBoundingClientRect();
                
                // Matemática ajustada para considerar Pan e Zoom da nova tela infinita
                const x = (e.clientX - rect.left - panX) / scale - 35;
                const y = (e.clientY - rect.top - panY) / scale - 20;
                
                createComponent(type, x, y);
            }
        });

        // Touch Móvel da paleta
        let touchDragType = null;
        let touchDragElement = null;

        function handleTouchStartPalette(e) {
            touchDragType = e.currentTarget.dataset.type;
            const touch = e.touches[0];
            
            touchDragElement = e.currentTarget.cloneNode(true);
            touchDragElement.style.position = 'fixed';
            touchDragElement.style.opacity = '0.7';
            touchDragElement.style.pointerEvents = 'none';
            touchDragElement.style.zIndex = '9999';
            document.body.appendChild(touchDragElement);
            
            moveTouchGhost(touch.clientX, touch.clientY);
            
            document.addEventListener('touchmove', handleTouchMovePalette, {passive: false});
            document.addEventListener('touchend', handleTouchEndPalette);
        }

        function moveTouchGhost(x, y) {
            if(touchDragElement) {
                touchDragElement.style.left = (x - 20) + 'px';
                touchDragElement.style.top = (y - 20) + 'px';
            }
        }

        function handleTouchMovePalette(e) {
            e.preventDefault();
            moveTouchGhost(e.touches[0].clientX, e.touches[0].clientY);
        }

        function handleTouchEndPalette(e) {
            document.removeEventListener('touchmove', handleTouchMovePalette);
            document.removeEventListener('touchend', handleTouchEndPalette);
            
            if (touchDragElement) {
                touchDragElement.remove();
                touchDragElement = null;
            }
            
            if (touchDragType) {
                const touch = e.changedTouches[0];
                const rect = workspace.getBoundingClientRect();
                
                if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
                    touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                    
                    document.getElementById('welcome-text').style.display = 'none';
                    // Matemática ajustada
                    const x = (touch.clientX - rect.left - panX) / scale - 35;
                    const y = (touch.clientY - rect.top - panY) / scale - 20;
                    createComponent(touchDragType, x, y);
                }
                touchDragType = null;
            }
        }

        function createComponent(type, x, y, idForce = null) {
            const template = componentLibrary.find(c => c.type === type);
            if (!template) return null;

            let id;
            if (idForce) {
                id = idForce;
                // Atualizar contador para evitar conflitos na importação
                const num = parseInt(id.split('_')[1]);
                if (num >= nodeIdCounter) nodeIdCounter = num;
            } else {
                nodeIdCounter++;
                id = 'node_' + nodeIdCounter;
            }

            const el = document.createElement('div');
            el.className = 'component-node pointer-events-auto';
            el.id = id;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.width = template.width + 'px';
            
            const header = document.createElement('div');
            header.className = 'component-header';
            header.innerHTML = `
                <span class="truncate">${template.name}</span>
                <button class="text-slate-400 hover:text-red-400 ml-2" title="Remover" onclick="deleteComponent('${id}')">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            `;

            setupNodeDragging(header, el, id);

            const body = document.createElement('div');
            body.className = 'component-body';
            body.style.width = template.width + 'px';
            body.style.height = template.height + 'px';
            body.innerHTML = template.svg;

            const portClass = template.portStyle === 'inset' ? 'inset-ports' : 'ports-container';
            
            const inputsContainer = document.createElement('div');
            inputsContainer.className = `ports-container ${portClass} top`;
            template.inputs.forEach(portName => {
                inputsContainer.appendChild(createPortElement(id, portName, 'in'));
            });

            const outputsContainer = document.createElement('div');
            outputsContainer.className = `ports-container ${portClass} bottom`;
            template.outputs.forEach(portName => {
                outputsContainer.appendChild(createPortElement(id, portName, 'out'));
            });

            el.appendChild(header);
            el.appendChild(body);
            if(template.inputs.length > 0) el.appendChild(inputsContainer);
            if(template.outputs.length > 0) el.appendChild(outputsContainer);

            componentsContainer.appendChild(el);

            nodes.push({ id, type, el, x, y });
            
            if(!idForce) showToast(`${template.name} adicionado.`, 'success');
            return id;
        }

        function createPortElement(nodeId, portName, type) {
            const wrapper = document.createElement('div');
            wrapper.className = 'port-wrapper';

            const port = document.createElement('div');
            port.className = 'port';
            port.dataset.node = nodeId;
            port.dataset.port = portName;
            port.dataset.type = type;

            const label = document.createElement('div');
            label.className = 'port-label';
            label.innerText = portName;

            wrapper.appendChild(port);
            wrapper.appendChild(label);
            port.addEventListener('pointerdown', handlePortClick);
            
            return wrapper;
        }

        function handlePortClick(e) {
            e.stopPropagation();
            if(isPanning) return; // Não iniciar fio se tiver arrastando tela

            const portEl = e.target;
            const nodeId = portEl.dataset.node;
            const portName = portEl.dataset.port;

            if (!drawingWire) {
                drawingWire = { sourceNode: nodeId, sourcePort: portName, sourceEl: portEl };
                portEl.classList.add('active');
                
                drawingLayer.style.display = 'block';
                updateDrawingWire(e.clientX, e.clientY);
                
                document.addEventListener('pointermove', onPointerMoveDraw);
                setTimeout(() => { workspace.addEventListener('pointerdown', cancelDrawing); }, 10);
            } else {
                if (drawingWire.sourceNode === nodeId && drawingWire.sourcePort === portName) {
                    cancelDrawing();
                } else {
                    createWire(drawingWire.sourceNode, drawingWire.sourcePort, nodeId, portName);
                    cancelDrawing();
                }
            }
        }

        function onPointerMoveDraw(e) {
            updateDrawingWire(e.clientX, e.clientY);
        }

        function updateDrawingWire(clientX, clientY) {
            if (!drawingWire) return;
            const startPos = getPortCenter(drawingWire.sourceEl);
            
            // Mouse posição relativa ao Canvas com Zoom (Importante)
            const panZoomRect = canvasPanZoom.getBoundingClientRect();
            const mouseX = (clientX - panZoomRect.left) / scale;
            const mouseY = (clientY - panZoomRect.top) / scale;
            
            drawingWirePath.setAttribute('d', getBezierPath(startPos.x, startPos.y, mouseX, mouseY));
        }

        function cancelDrawing(e) {
            if(e && e.target.classList.contains('port')) return;
            
            if(drawingWire && drawingWire.sourceEl) drawingWire.sourceEl.classList.remove('active');
            drawingWire = null;
            drawingLayer.style.display = 'none';
            document.removeEventListener('pointermove', onPointerMoveDraw);
            workspace.removeEventListener('pointerdown', cancelDrawing);
        }

        function createWire(srcNode, srcPort, tgtNode, tgtPort, idForce = null) {
            const exists = wires.find(w => 
                (w.sourceNode === srcNode && w.sourcePort === srcPort && w.targetNode === tgtNode && w.targetPort === tgtPort) ||
                (w.sourceNode === tgtNode && w.sourcePort === tgtPort && w.targetNode === srcNode && w.targetPort === srcPort)
            );
            
            if(exists) {
                if(!idForce) showToast("Esses bornes já estão conectados.", 'error');
                return;
            }

            let wireId;
            if(idForce) {
                wireId = idForce;
                const num = parseInt(wireId.split('_')[1]);
                if (num >= wireIdCounter) wireIdCounter = num;
            } else {
                wireIdCounter++;
                wireId = 'wire_' + wireIdCounter;
            }
            
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.id = wireId;
            path.setAttribute('class', 'wire-path');
            
            path.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteWire(wireId);
            });

            wireLayer.appendChild(path);

            const wireObj = { id: wireId, sourceNode: srcNode, sourcePort: srcPort, targetNode: tgtNode, targetPort: tgtPort, pathEl: path };
            wires.push(wireObj);
            
            updateWirePath(wireObj);
            if(!idForce) showToast("Conexão estabelecida.", 'success');
        }

        function getPortCenter(portEl) {
            const rect = portEl.getBoundingClientRect();
            const panZoomRect = canvasPanZoom.getBoundingClientRect();
            
            // Calcula centro do Borne desfazendo a escala da tela pra caber no SVG (que sofre o scale inteiro)
            return {
                x: (rect.left - panZoomRect.left + (rect.width / 2)) / scale,
                y: (rect.top - panZoomRect.top + (rect.height / 2)) / scale
            };
        }

        function getBezierPath(x1, y1, x2, y2) {
            const dx = Math.abs(x2 - x1);
            const dy = Math.abs(y2 - y1);
            const offset = Math.max(dy / 2, dx / 3, 40); 
            return `M ${x1} ${y1} C ${x1} ${y1 + offset}, ${x2} ${y2 - offset}, ${x2} ${y2}`;
        }

        function updateWirePath(wire) {
            const srcSelector = `.port[data-node="${wire.sourceNode}"][data-port="${wire.sourcePort}"]`;
            const tgtSelector = `.port[data-node="${wire.targetNode}"][data-port="${wire.targetPort}"]`;
            
            const srcEl = document.querySelector(srcSelector);
            const tgtEl = document.querySelector(tgtSelector);
            
            if (srcEl && tgtEl) {
                const p1 = getPortCenter(srcEl);
                const p2 = getPortCenter(tgtEl);
                wire.pathEl.setAttribute('d', getBezierPath(p1.x, p1.y, p2.x, p2.y));
                
                const p1Str = wire.sourcePort;
                const p2Str = wire.targetPort;
                // Coloração profissional avançada
                if(['L1', 'R', 'U', 'U1', '1(L1)', '2(T1)'].includes(p1Str) || ['L1', 'R', 'U', 'U1', '1(L1)', '2(T1)'].includes(p2Str)) wire.pathEl.style.stroke = '#3b82f6';
                else if(['L2', 'S', 'V', 'V1', '3(L2)', '4(T2)'].includes(p1Str) || ['L2', 'S', 'V', 'V1', '3(L2)', '4(T2)'].includes(p2Str)) wire.pathEl.style.stroke = '#f97316';
                else if(['L3', 'T', 'W', 'W1', '5(L3)', '6(T3)'].includes(p1Str) || ['L3', 'T', 'W', 'W1', '5(L3)', '6(T3)'].includes(p2Str)) wire.pathEl.style.stroke = '#8b5cf6';
                else if(['PE'].includes(p1Str) || ['PE'].includes(p2Str)) wire.pathEl.style.stroke = '#22c55e';
                else if(['N', 'N\'', '0V', 'M', 'Neutro'].includes(p1Str) || ['N', 'N\'', '0V', 'M', 'Neutro'].includes(p2Str)) wire.pathEl.style.stroke = '#0ea5e9';
                else wire.pathEl.style.stroke = '#ef4444';
            }
        }

        function updateAllWires() {
            wires.forEach(w => updateWirePath(w));
        }

        function setupNodeDragging(handleEl, nodeEl, id) {
            let isDragging = false;
            let startX, startY, initialX, initialY;

            function onPointerDown(e) {
                if(e.target.closest('button')) return; // Não arrasta se clicou botão X
                if(e.shiftKey) return; // Deixa o shift livre pro Pan
                
                isDragging = true;
                nodeEl.classList.add('dragging');
                
                startX = e.clientX;
                startY = e.clientY;
                initialX = parseFloat(nodeEl.style.left) || 0;
                initialY = parseFloat(nodeEl.style.top) || 0;
                
                document.addEventListener('pointermove', onPointerMove);
                document.addEventListener('pointerup', onPointerUp);
                
                e.preventDefault();
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                
                // Dividir pelo scale faz o mouse acompanhar a caixa independente do zoom
                const dx = (e.clientX - startX) / scale;
                const dy = (e.clientY - startY) / scale;
                
                let newX = initialX + dx;
                let newY = initialY + dy;
                
                nodeEl.style.left = newX + 'px';
                nodeEl.style.top = newY + 'px';
                
                const nodeData = nodes.find(n => n.id === id);
                if(nodeData) {
                    nodeData.x = newX;
                    nodeData.y = newY;
                    wires.forEach(w => {
                        if (w.sourceNode === id || w.targetNode === id) updateWirePath(w);
                    });
                }
            }

            function onPointerUp() {
                isDragging = false;
                nodeEl.classList.remove('dragging');
                document.removeEventListener('pointermove', onPointerMove);
                document.removeEventListener('pointerup', onPointerUp);
            }

            handleEl.addEventListener('pointerdown', onPointerDown);
        }

        function deleteComponent(id) {
            const el = document.getElementById(id);
            if(el) el.remove();
            nodes = nodes.filter(n => n.id !== id);
            
            const wiresToRemove = wires.filter(w => w.sourceNode === id || w.targetNode === id);
            wiresToRemove.forEach(w => { if(w.pathEl) w.pathEl.remove(); });
            wires = wires.filter(w => w.sourceNode !== id && w.targetNode !== id);
        }

        function deleteWire(id) {
            const wire = wires.find(w => w.id === id);
            if (wire) {
                wire.pathEl.remove();
                wires = wires.filter(w => w.id !== id);
            }
        }

        function clearWorkspace(bypassConfirm = false) {
            if(!bypassConfirm && !confirm("Deseja apagar todo o projeto atual?")) return;
            componentsContainer.innerHTML = '';
            wireLayer.innerHTML = '';
            nodes = [];
            wires = [];
            nodeIdCounter = 0;
            wireIdCounter = 0;
            document.getElementById('welcome-text').style.display = 'flex';
            if(!bypassConfirm) showToast("Bancada limpa.", 'success');
        }

        function exportCircuit() {
            if(nodes.length === 0) {
                showToast("Não há nada na bancada para salvar.", 'error');
                return;
            }
            
            const data = {
                nodes: nodes.map(n => ({ id: n.id, type: n.type, x: n.x, y: n.y })),
                wires: wires.map(w => ({ id: w.id, srcN: w.sourceNode, srcP: w.sourcePort, tgtN: w.targetNode, tgtP: w.targetPort }))
            };
            
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "meu_diagrama_motor.json");
            dlAnchorElem.click();
            showToast("Projeto Salvo!", 'success');
        }

        function importCircuit(event) {
            const file = event.target.files[0];
            if(!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    clearWorkspace(true);
                    
                    // Restaura Nodes
                    data.nodes.forEach(n => {
                        createComponent(n.type, n.x, n.y, n.id);
                    });
                    
                    // Restaura Fios com delay leve pro DOM renderizar posições
                    setTimeout(() => {
                        data.wires.forEach(w => {
                            createWire(w.srcN, w.srcP, w.tgtN, w.tgtP, w.id);
                        });
                        document.getElementById('welcome-text').style.display = 'none';
                        showToast("Projeto Carregado!", 'success');
                        event.target.value = ''; // Limpa input
                    }, 50);
                    
                } catch(err) {
                    showToast("Arquivo inválido.", 'error');
                    console.error(err);
                }
            };
            reader.readAsText(file);
        }

        function showHelp() {
            alert("CAD Pro - Instruções:\n\n1. Oculte a biblioteca no botão do menu superior.\n2. Zoom: Role o scroll do mouse.\n3. Pan (Mover tela): Segure SHIFT + Clique e arraste o fundo.\n4. Salve e carregue seus arquivos na barra de ferramentas da área de trabalho.\n5. O sistema salva em .json localmente em seu PC.");
        }

        function showToast(message, type='info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            if(type === 'error') toast.style.borderLeftColor = '#ef4444';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s ease-out forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.onload = () => {
            initPalette();
            window.addEventListener('resize', updateAllWires);
        };
    </script>
</body>
</html>
