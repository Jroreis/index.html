<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador Industrial - Sistemas de Motores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --grid-color: rgba(255, 255, 255, 0.05);
            --bg-color: #0f172a;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Previne scroll da página inteira */
            background-color: var(--bg-color);
            color: #f8fafc;
            touch-action: none; /* Desabilita pull-to-refresh no mobile */
        }

        #workspace {
            position: relative;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 20px 20px;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #wire-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Deixa os cliques passarem para os componentes */
            z-index: 10;
        }

        .wire-path {
            fill: none;
            stroke: #ef4444; /* Cor vermelha para os cabos de força/comando padrão */
            stroke-width: 4;
            stroke-linecap: round;
            pointer-events: stroke; /* Permite clicar no cabo para deletar */
            cursor: pointer;
            transition: stroke 0.2s, stroke-width 0.2s;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.5));
        }

        .wire-path:hover {
            stroke: #fbbf24;
            stroke-width: 6;
        }

        .component-node {
            position: absolute;
            border-radius: 8px;
            user-select: none;
            touch-action: none;
            z-index: 20;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.25);
            transition: box-shadow 0.2s;
        }

        .component-node.dragging {
            z-index: 50;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.8), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            opacity: 0.9;
        }
        
        .component-header {
            background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
            padding: 4px 8px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #f1f5f9;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #475569;
            border-bottom: none;
            cursor: grab;
        }

        .component-header:active {
            cursor: grabbing;
        }

        .component-body {
            position: relative;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 0 0 8px 8px;
        }
        
        .component-body svg {
            display: block;
            border-radius: 0 0 8px 8px;
        }

        .ports-container {
            display: flex;
            justify-content: space-evenly;
            width: 100%;
            position: absolute;
            z-index: 30;
            left: 0;
        }
        
        .ports-container.top { top: -6px; }
        .ports-container.bottom { bottom: -6px; }
        
        /* Ajuste específico para o Inversor e CLP onde os bornes ficam em recuos */
        .inset-ports.top { top: 12px; }
        .inset-ports.bottom { bottom: 12px; }

        .port-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .port {
            width: 14px;
            height: 14px;
            background-color: #cbd5e1;
            border: 1px solid #334155;
            border-radius: 50%;
            cursor: crosshair;
            position: relative;
            transition: all 0.2s;
            /* Textura de parafuso Phillips realista */
            background-image: 
                linear-gradient(45deg, transparent 42%, #475569 45%, #475569 55%, transparent 58%),
                linear-gradient(-45deg, transparent 42%, #475569 45%, #475569 55%, transparent 58%);
            box-shadow: inset 0 -2px 4px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.8), 0 1px 2px rgba(0,0,0,0.5);
        }

        .port:hover, .port.active {
            background-color: #fbbf24;
            transform: scale(1.3);
            background-image: none; /* Destaca a bolinha de conexão ao passar o mouse */
            box-shadow: 0 0 10px #f59e0b, inset 0 -1px 2px rgba(0,0,0,0.4);
            z-index: 40;
        }

        .port-label {
            position: absolute;
            font-size: 0.55rem;
            font-weight: 700;
            color: #0f172a;
            background: rgba(241, 245, 249, 0.9);
            padding: 1px 3px;
            border-radius: 3px;
            border: 1px solid #94a3b8;
            pointer-events: none;
            white-space: nowrap;
            z-index: 35;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            font-family: 'JetBrains Mono', monospace;
        }
        .ports-container.top .port-label { top: -18px; }
        .ports-container.bottom .port-label { bottom: -18px; }
        
        .inset-ports.top .port-label { top: -14px; background: transparent; color: #fff; border: none; text-shadow: 0 1px 2px #000;}
        .inset-ports.bottom .port-label { bottom: -14px; background: transparent; color: #fff; border: none; text-shadow: 0 1px 2px #000;}


        .sidebar-item {
            transition: transform 0.2s, background-color 0.2s;
        }
        .sidebar-item:hover {
            transform: translateY(-2px);
            background-color: #334155;
        }
        
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .toast {
            background: #1e293b;
            border-left: 4px solid #3b82f6;
            color: white;
            padding: 12px 20px;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease-out forwards;
            font-size: 0.875rem;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* SVG Font para o display do Inversor */
        .digital-font { font-family: 'JetBrains Mono', monospace; font-weight: bold; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="bg-slate-800 border-b border-slate-700 h-14 flex items-center justify-between px-6 shrink-0 z-40">
        <div class="flex items-center gap-3">

            </div>

        </div>
        <div class="flex items-center gap-4">
            <button onclick="clearWorkspace()" class="bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white px-4 py-1.5 rounded text-sm font-medium transition-colors border border-red-500/20">
                <i class="fa-solid fa-trash-can mr-2"></i> Limpar Bancada
            </button>
            <button onclick="showHelp()" class="text-slate-400 hover:text-white transition-colors">
                <i class="fa-solid fa-circle-info text-xl"></i>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">

            </div>
            <div id="component-palette" class="flex-1 overflow-y-auto p-3 space-y-2 pb-20 scrollbar-hide">
                <!-- Os itens serão gerados via JS aqui -->
            </div>
        </aside>

        <!-- Área de Projeto (Canvas) -->
        <main id="workspace" class="flex-1 relative">
            <!-- Camada SVG para desenhar os fios -->
            <svg id="wire-layer"></svg>
            
            <!-- Linha indicadora enquanto desenha um fio -->
            <svg id="drawing-layer" class="absolute inset-0 w-full h-full pointer-events-none z-10" style="display: none;">
                <path id="drawing-wire" class="wire-path" stroke-dasharray="5,5" opacity="0.6"></path>
            </svg>
            
            <!-- Container para as caixas de ferramentas/componentes -->
            <div id="components-container" class="absolute inset-0 pointer-events-none"></div>
            
            <!-- Instrução inicial na tela -->
            <div id="welcome-text" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-20">
                <div class="text-center">
                    <i class="fa-solid fa-arrow-pointer text-6xl mb-4"></i>
                    <h2 class="text-3xl font-bold">Arraste componentes para cá</h2>
                    <p class="text-lg mt-2">Clique nos parafusos (bornes) para ligar os cabos</p>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-container"></div>

                    <!-- Frestas de ventilação traseira -->
                    <line x1="18" y1="40" x2="18" y2="80" stroke="#0f172a" stroke-width="1" stroke-dasharray="4,2"/>
                    
                    <!-- Caixa de Ligação (Bornes) no Topo -->
                    <rect x="0" y="0" width="150" height="15" fill="transparent" /> <!-- Margem para bornes HTML -->
                    <path d="M 50 15 L 100 15 L 105 30 L 45 30 Z" fill="#172554" />
                    <rect x="55" y="10" width="40" height="5" fill="#1e3a8a" />
                </svg>`
            }
        ];

        let nodes = []; // { id, type, x, y, el }
        let wires = []; // { id, sourceNode, sourcePort, targetNode, targetPort, pathEl }
        let nodeIdCounter = 0;
        let wireIdCounter = 0;
        
        let drawingWire = null; // { sourceNode, sourcePort }
        
        const workspace = document.getElementById('workspace');
        const wireLayer = document.getElementById('wire-layer');
        const drawingLayer = document.getElementById('drawing-layer');
        const drawingWirePath = document.getElementById('drawing-wire');
        const componentsContainer = document.getElementById('components-container');

        function initPalette() {
            const palette = document.getElementById('component-palette');
            
            // Agrupar por categorias
            const categories = {};
            componentLibrary.forEach(comp => {
                if(!categories[comp.category]) categories[comp.category] = [];
                categories[comp.category].push(comp);
            });

            for(let cat in categories) {
                const title = document.createElement('div');
                title.className = 'text-[10px] font-bold text-slate-500 mt-4 mb-2';
                title.innerText = cat;
                palette.appendChild(title);

                categories[cat].forEach(comp => {
                    const item = document.createElement('div');
                    item.className = 'sidebar-item bg-slate-800 border border-slate-700 rounded-lg p-2 flex items-center gap-3 cursor-grab text-white select-none';
                    item.draggable = true;
                    item.dataset.type = comp.type;
                    
                    // Miniatura SVG
                    const svgWrap = document.createElement('div');
                    svgWrap.className = 'w-10 h-10 flex items-center justify-center shrink-0';
                    // Escalar miniatura
                    let miniSvg = comp.svg.replace('width="100%"', 'width="30"').replace('height="100%"', 'height="30"');
                    svgWrap.innerHTML = miniSvg;
                    
                    const nameWrap = document.createElement('div');
                    nameWrap.className = 'text-xs font-medium';
                    nameWrap.innerText = comp.name;

                    item.appendChild(svgWrap);
                    item.appendChild(nameWrap);
                    
                    // Eventos Drag Native (Desktop)
                    item.addEventListener('dragstart', (e) => {
                        e.dataTransfer.setData('text/plain', comp.type);
                        // Offset para soltar no centro do mouse
                        e.dataTransfer.setData('offsetX', e.offsetX);
                        e.dataTransfer.setData('offsetY', e.offsetY);
                    });
                    
                    // Eventos Touch (Mobile)
                    item.addEventListener('touchstart', handleTouchStartPalette, {passive: false});

                    palette.appendChild(item);
                });
            }
        }

        workspace.addEventListener('dragover', (e) => {
            e.preventDefault(); // Necessário para permitir o drop
            e.dataTransfer.dropEffect = 'copy';
        });

        workspace.addEventListener('drop', (e) => {
            e.preventDefault();
            const type = e.dataTransfer.getData('text/plain');
            if (type) {
                // Remove tela de boas vindas
                document.getElementById('welcome-text').style.display = 'none';
                
                const rect = workspace.getBoundingClientRect();
                // Ajusta a coordenada baseada no scroll e posição do workspace
                const x = e.clientX - rect.left - 35; // 35 é aprox metade da largura p/ centralizar
                const y = e.clientY - rect.top - 20;
                
                createComponent(type, x, y);
            }
        });

        // Variáveis para simular drag and drop via Touch a partir da paleta
        let touchDragType = null;
        let touchDragElement = null;

        function handleTouchStartPalette(e) {
            touchDragType = e.currentTarget.dataset.type;
            const touch = e.touches[0];
            
            // Cria um "fantasma" para seguir o dedo
            touchDragElement = e.currentTarget.cloneNode(true);
            touchDragElement.style.position = 'fixed';
            touchDragElement.style.opacity = '0.7';
            touchDragElement.style.pointerEvents = 'none';
            touchDragElement.style.zIndex = '9999';
            document.body.appendChild(touchDragElement);
            
            moveTouchGhost(touch.clientX, touch.clientY);
            
            document.addEventListener('touchmove', handleTouchMovePalette, {passive: false});
            document.addEventListener('touchend', handleTouchEndPalette);
        }

        function moveTouchGhost(x, y) {
            if(touchDragElement) {
                touchDragElement.style.left = (x - 20) + 'px';
                touchDragElement.style.top = (y - 20) + 'px';
            }
        }

        function handleTouchMovePalette(e) {
            e.preventDefault();
            moveTouchGhost(e.touches[0].clientX, e.touches[0].clientY);
        }

        function handleTouchEndPalette(e) {
            document.removeEventListener('touchmove', handleTouchMovePalette);
            document.removeEventListener('touchend', handleTouchEndPalette);
            
            if (touchDragElement) {
                touchDragElement.remove();
                touchDragElement = null;
            }
            
            if (touchDragType) {
                const touch = e.changedTouches[0];
                const rect = workspace.getBoundingClientRect();
                
                // Checa se soltou dentro do workspace
                if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
                    touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                    
                    document.getElementById('welcome-text').style.display = 'none';
                    const x = touch.clientX - rect.left - 35;
                    const y = touch.clientY - rect.top - 20;
                    createComponent(touchDragType, x, y);
                }
                touchDragType = null;
            }
        }

        function createComponent(type, x, y) {
            const template = componentLibrary.find(c => c.type === type);
            if (!template) return;

            nodeIdCounter++;
            const id = 'node_' + nodeIdCounter;
            
            // Garantir que não caia fora da tela
            x = Math.max(0, x);
            y = Math.max(0, y);

            const el = document.createElement('div');
            el.className = 'component-node pointer-events-auto';
            el.id = id;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.width = template.width + 'px';
            
            // Header (Área de rastro)
            const header = document.createElement('div');
            header.className = 'component-header';
            header.innerHTML = `
                <span class="truncate">${template.name}</span>
                <button class="text-slate-400 hover:text-red-400 ml-2" title="Remover" onclick="deleteComponent('${id}')">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            `;

            // Configurar Drag do Componente já instanciado
            setupNodeDragging(header, el, id);

            // Container do SVG
            const body = document.createElement('div');
            body.className = 'component-body';
            body.style.width = template.width + 'px';
            body.style.height = template.height + 'px';
            body.innerHTML = template.svg; // Injeta o SVG renderizado

            // Containers de Portas (Bornes)
            const portClass = template.portStyle === 'inset' ? 'inset-ports' : 'ports-container';
            
            const inputsContainer = document.createElement('div');
            inputsContainer.className = `ports-container ${portClass} top`;
            template.inputs.forEach(portName => {
                inputsContainer.appendChild(createPortElement(id, portName, 'in'));
            });

            const outputsContainer = document.createElement('div');
            outputsContainer.className = `ports-container ${portClass} bottom`;
            template.outputs.forEach(portName => {
                outputsContainer.appendChild(createPortElement(id, portName, 'out'));
            });

            el.appendChild(header);
            el.appendChild(body);
            if(template.inputs.length > 0) el.appendChild(inputsContainer);
            if(template.outputs.length > 0) el.appendChild(outputsContainer);

            componentsContainer.appendChild(el);

            nodes.push({ id, type, el, x, y });
            
            showToast(`${template.name} adicionado.`, 'success');
        }

        function createPortElement(nodeId, portName, type) {
            const wrapper = document.createElement('div');
            wrapper.className = 'port-wrapper';

            const port = document.createElement('div');
            port.className = 'port';
            port.dataset.node = nodeId;
            port.dataset.port = portName;
            port.dataset.type = type; // 'in' or 'out'

            const label = document.createElement('div');
            label.className = 'port-label';
            label.innerText = portName;

            wrapper.appendChild(port);
            wrapper.appendChild(label);

            // Eventos para desenhar fio (Click & Touch)
            port.addEventListener('pointerdown', handlePortClick);
            
            return wrapper;
        }

        function handlePortClick(e) {
            e.stopPropagation(); // Evita drag do componente se clicar no borne
            const portEl = e.target;
            const nodeId = portEl.dataset.node;
            const portName = portEl.dataset.port;

            if (!drawingWire) {
                // Iniciar novo fio
                drawingWire = { sourceNode: nodeId, sourcePort: portName, sourceEl: portEl };
                portEl.classList.add('active');
                
                // Mostra a linha fantasma
                drawingLayer.style.display = 'block';
                updateDrawingWire(e.clientX, e.clientY);
                
                // Ouve movimento do mouse no workspace todo
                document.addEventListener('pointermove', onPointerMoveDraw);
                
                // Se clicar em qualquer lugar vazio, cancela
                setTimeout(() => {
                    workspace.addEventListener('pointerdown', cancelDrawing);
                }, 10);
            } else {
                // Finalizar fio
                if (drawingWire.sourceNode === nodeId && drawingWire.sourcePort === portName) {
                    // Clicou no mesmo borne, cancela
                    cancelDrawing();
                } else {
                    // Tenta conectar
                    createWire(drawingWire.sourceNode, drawingWire.sourcePort, nodeId, portName);
                    cancelDrawing();
                }
            }
        }

        function onPointerMoveDraw(e) {
            updateDrawingWire(e.clientX, e.clientY);
        }

        function updateDrawingWire(clientX, clientY) {
            if (!drawingWire) return;
            const rect = workspace.getBoundingClientRect();
            const startPos = getPortCenter(drawingWire.sourceEl);
            
            const mouseX = clientX - rect.left;
            const mouseY = clientY - rect.top;
            
            drawingWirePath.setAttribute('d', getBezierPath(startPos.x, startPos.y, mouseX, mouseY));
        }

        function cancelDrawing(e) {
            if(e && e.target.classList.contains('port')) return; // Deixa o port lidar com o click
            
            if(drawingWire && drawingWire.sourceEl) drawingWire.sourceEl.classList.remove('active');
            drawingWire = null;
            drawingLayer.style.display = 'none';
            document.removeEventListener('pointermove', onPointerMoveDraw);
            workspace.removeEventListener('pointerdown', cancelDrawing);
        }

        function createWire(srcNode, srcPort, tgtNode, tgtPort) {
            // Previne múltiplas conexões idênticas
            const exists = wires.find(w => 
                (w.sourceNode === srcNode && w.sourcePort === srcPort && w.targetNode === tgtNode && w.targetPort === tgtPort) ||
                (w.sourceNode === tgtNode && w.sourcePort === tgtPort && w.targetNode === srcNode && w.targetPort === srcPort)
            );
            
            if(exists) {
                showToast("Esses bornes já estão conectados.", 'error');
                return;
            }

            wireIdCounter++;
            const wireId = 'wire_' + wireIdCounter;
            
            // Elemento SVG Path
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.id = wireId;
            path.setAttribute('class', 'wire-path');
            
            // Adiciona evento para deletar o fio
            path.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteWire(wireId);
            });

            wireLayer.appendChild(path);

            const wireObj = { id: wireId, sourceNode: srcNode, sourcePort: srcPort, targetNode: tgtNode, targetPort: tgtPort, pathEl: path };
            wires.push(wireObj);
            
            updateWirePath(wireObj);
            
            // Efeito sonoro/visual pequeno
            showToast("Conexão estabelecida.", 'success');
        }

        function getPortCenter(portEl) {
            const rect = portEl.getBoundingClientRect();
            const workspaceRect = workspace.getBoundingClientRect();
            return {
                x: rect.left - workspaceRect.left + (rect.width / 2),
                y: rect.top - workspaceRect.top + (rect.height / 2)
            };
        }

        function getBezierPath(x1, y1, x2, y2) {
            const dx = Math.abs(x2 - x1);
            const dy = Math.abs(y2 - y1);
            
            // Curvatura dinâmica baseada na distância. Faz o fio "cair" como gravidade ou curvar lateralmente.
            const offset = Math.max(dy / 2, dx / 3, 40); 
            
            // Control points para fazer uma curva em "S" vertical suave, típica de diagramas elétricos
            return `M ${x1} ${y1} C ${x1} ${y1 + offset}, ${x2} ${y2 - offset}, ${x2} ${y2}`;
        }

        function updateWirePath(wire) {
            // Busca elementos no DOM
            const srcSelector = `.port[data-node="${wire.sourceNode}"][data-port="${wire.sourcePort}"]`;
            const tgtSelector = `.port[data-node="${wire.targetNode}"][data-port="${wire.targetPort}"]`;
            
            const srcEl = document.querySelector(srcSelector);
            const tgtEl = document.querySelector(tgtSelector);
            
            if (srcEl && tgtEl) {
                const p1 = getPortCenter(srcEl);
                const p2 = getPortCenter(tgtEl);
                wire.pathEl.setAttribute('d', getBezierPath(p1.x, p1.y, p2.x, p2.y));
                
                // Pinta o cabo baseado na fase (L1, L2, L3) para ficar profissional
                if(['L1', 'R', 'U', 'U1', '1(L1)', '2(T1)'].includes(wire.sourcePort) || ['L1', 'R', 'U', 'U1', '1(L1)', '2(T1)'].includes(wire.targetPort)) wire.pathEl.style.stroke = '#3b82f6'; // Azul escuro
                else if(['L2', 'S', 'V', 'V1', '3(L2)', '4(T2)'].includes(wire.sourcePort) || ['L2', 'S', 'V', 'V1', '3(L2)', '4(T2)'].includes(wire.targetPort)) wire.pathEl.style.stroke = '#f97316'; // Laranja
                else if(['L3', 'T', 'W', 'W1', '5(L3)', '6(T3)'].includes(wire.sourcePort) || ['L3', 'T', 'W', 'W1', '5(L3)', '6(T3)'].includes(wire.targetPort)) wire.pathEl.style.stroke = '#8b5cf6'; // Roxo
                else if(['PE'].includes(wire.sourcePort) || ['PE'].includes(wire.targetPort)) wire.pathEl.style.stroke = '#22c55e'; // Verde
                else if(['N', '0V', 'M'].includes(wire.sourcePort) || ['N', '0V', 'M'].includes(wire.targetPort)) wire.pathEl.style.stroke = '#0ea5e9'; // Azul claro
                else wire.pathEl.style.stroke = '#ef4444'; // Comando padrão
            }
        }

        function updateAllWires() {
            wires.forEach(w => updateWirePath(w));
        }

        function setupNodeDragging(handleEl, nodeEl, id) {
            let isDragging = false;
            let startX, startY, initialX, initialY;

            function onPointerDown(e) {
                // Não arrasta se clicou no botão de apagar
                if(e.target.closest('button')) return;
                
                isDragging = true;
                nodeEl.classList.add('dragging');
                
                startX = e.clientX;
                startY = e.clientY;
                initialX = parseInt(nodeEl.style.left) || 0;
                initialY = parseInt(nodeEl.style.top) || 0;
                
                document.addEventListener('pointermove', onPointerMove);
                document.addEventListener('pointerup', onPointerUp);
                
                e.preventDefault(); // Previne seleção de texto
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                
                let newX = initialX + dx;
                let newY = initialY + dy;
                
                // Limites rudimentares
                newX = Math.max(0, newX);
                newY = Math.max(0, newY);
                
                nodeEl.style.left = newX + 'px';
                nodeEl.style.top = newY + 'px';
                
                // Atualizar nó na array e fios conectados
                const nodeData = nodes.find(n => n.id === id);
                if(nodeData) {
                    nodeData.x = newX;
                    nodeData.y = newY;
                    
                    // Atualiza apenas os fios conectados a este nó para performance
                    wires.forEach(w => {
                        if (w.sourceNode === id || w.targetNode === id) {
                            updateWirePath(w);
                        }
                    });
                }
            }

            function onPointerUp() {
                isDragging = false;
                nodeEl.classList.remove('dragging');
                document.removeEventListener('pointermove', onPointerMove);
                document.removeEventListener('pointerup', onPointerUp);
            }

            handleEl.addEventListener('pointerdown', onPointerDown);
        }

        function deleteComponent(id) {
            // Remove Elemento HTML
            const el = document.getElementById(id);
            if(el) el.remove();
            
            // Remove da Array
            nodes = nodes.filter(n => n.id !== id);
            
            // Encontra e remove fios conectados
            const wiresToRemove = wires.filter(w => w.sourceNode === id || w.targetNode === id);
            wiresToRemove.forEach(w => {
                if(w.pathEl) w.pathEl.remove();
            });
            wires = wires.filter(w => w.sourceNode !== id && w.targetNode !== id);
        }

        function deleteWire(id) {
            const wire = wires.find(w => w.id === id);
            if (wire) {
                wire.pathEl.remove();
                wires = wires.filter(w => w.id !== id);
            }
        }

        function clearWorkspace() {
            // Limpa HTML
            componentsContainer.innerHTML = '';
            wireLayer.innerHTML = '';
            
            // Reseta Arrays
            nodes = [];
            wires = [];
            nodeIdCounter = 0;
            wireIdCounter = 0;
            
            // Volta texto de instrução
            document.getElementById('welcome-text').style.display = 'flex';
            showToast("Bancada limpa.", 'success');
        }

        function showHelp() {
            alert("Instruções do Simulador CAD:\n\n1. Arraste os componentes do painel esquerdo para a grade.\n2. Para conectar componentes, clique em um borne (parafuso prata) e depois em outro borne de destino.\n3. Arraste os componentes pelo título cinza escuro para reposicioná-los.\n4. Para apagar um fio, basta clicar em cima dele.\n5. Para apagar uma peça, clique no ícone de (X) no canto dela.");
        }

        function showToast(message, type='info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            if(type === 'error') toast.style.borderLeftColor = '#ef4444';
            toast.innerText = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s ease-out forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Inicializar aplicação
        window.onload = () => {
            initPalette();
            // Lida com resize da tela para recalcular caminhos dos fios
            window.addEventListener('resize', updateAllWires);
        };
    </script>
</body>
</html>
