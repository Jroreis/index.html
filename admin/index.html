<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - VoltCalc Pro</title>
    
    <!-- Importação do Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

    <style>
        body { 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #f4f4f4; 
            margin: 0;
        }
        .login-box { 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%;
            max-width: 350px;
        }
        h1 { 
            font-size: 1.5rem; 
            text-align: center; 
            color: #333;
            margin-bottom: 20px;
        }
        input { 
            display: block; 
            width: 100%; 
            margin: 10px 0; 
            padding: 12px; 
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 15px;
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer; 
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h1>Acesso Restrito - ADM</h1>
    <input type="email" id="email" placeholder="E-mail" required>
    <input type="password" id="password" placeholder="Senha" required>
    <button onclick="login()">Entrar</button>
</div>

<script>
    // 1. Configurações do seu projeto Firebase (AGORA COM AS CHAVES CORRETAS!)
    const firebaseConfig = {
        apiKey: "AIzaSyCbTPTFMUkuF3VVRgl8OOx_w6gIAekAVoQ",
        authDomain: "voltcalc-pro.firebaseapp.com",
        projectId: "voltcalc-pro",
        storageBucket: "voltcalc-pro.firebasestorage.app",
        messagingSenderId: "411208955318",
        appId: "1:411208955318:web:8735802bf0f4ac8a1a3d17",
        measurementId: "G-491LK8FWBM"
    };

    // 2. Inicializa o Firebase
    firebase.initializeApp(firebaseConfig);

    // 3. Função de Login
    function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if(!email || !password) {
            alert("Por favor, preencha o e-mail e a senha.");
            return;
        }

        firebase.auth().signInWithEmailAndPassword(email, password)
            .then((userCredential) => {
                // Sucesso! Vai direto para o painel
                window.location.href = "painel.html"; 
            })
            .catch((error) => {
                let mensagemErro = "Erro ao fazer login.";
                
                if(error.code === 'auth/invalid-login-credentials' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    mensagemErro = "E-mail ou senha incorretos. Verifique os dados e tente novamente.";
                } else if(error.code === 'auth/invalid-email') {
                    mensagemErro = "Formato de e-mail inválido.";
                } else {
                    mensagemErro = "Erro do servidor: " + error.code;
                }
                
                alert(mensagemErro);
                console.error(error);
            });
    }
</script>

</body>
</html>
