<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login Administrativo - VoltCalc Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f4; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        button { width: 100%; padding: 10px; margin-top: 10px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .btn-google { background: #4285f4; color: white; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Acesso Administrativo</h2>
    <button class="btn-google" onclick="loginGoogle()">Entrar com Google</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCbTPTFMUkuF3VVRgl8OOx_w6gIAekAVoQ",
        authDomain: "voltcalc-pro.firebaseapp.com",
        projectId: "voltcalc-pro",
        storageBucket: "voltcalc-pro.appspot.com",
        messagingSenderId: "411208955318",
        appId: "1:411208955318:web:8735802bf0f4ac8a1a3d17"
    };

    firebase.initializeApp(firebaseConfig);
    
    // Inicialização do banco de dados (Adicionado)
    const db = firebase.firestore();

    function loginGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        firebase.auth().signInWithPopup(provider).then((result) => {
            const user = result.user;
            const userRef = db.collection('users').doc(user.uid);
            
            // Verifica se o usuário já existe no banco
            userRef.get().then((doc) => {
                if (!doc.exists) {
                    // É um usuário novo: salva os dados dele junto com a data de hoje
                    userRef.set({
                        nome: user.displayName || 'Sem Nome',
                        email: user.email,
                        role: 'cliente',
                        dataCriacao: new Date().toISOString()
                    }).then(() => {
                        window.location.href = "painel.html";
                    });
                } else {
                    // O usuário já existe: apenas redireciona (preservando o fluxo original)
                    window.location.href = "painel.html";
                }
            });
        }).catch((error) => {
            alert("Erro ao logar: " + error.message);
        });
    }
</script>
</body>
</html>
