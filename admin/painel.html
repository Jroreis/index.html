<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>VoltCalc Pro - Dashboard Admin Live</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    const firebaseConfig = {
        apiKey: "AIzaSyCbTPTFMUkuF3VVRgl8OOx_w6gIAekAVoQ",
        authDomain: "voltcalc-pro.firebaseapp.com",
        projectId: "voltcalc-pro",
        storageBucket: "voltcalc-pro.appspot.com",
        messagingSenderId: "411208955318",
        appId: "1:411208955318:web:8735802bf0f4ac8a1a3d17"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  </script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg-color: #1a1b2f; --card-bg: #162447; --border-color: #1f4068; --accent-neon: #39FF14; }
    body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: #fff; display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 260px; background: #111827; padding: 30px 20px; display: flex; flex-direction: column; border-right: 1px solid var(--border-color); }
    .logo { font-size: 24px; font-weight: 800; color: var(--accent-neon); margin-bottom: 30px; }
    .user-greet { margin-bottom: 30px; }
    .nav-links { list-style: none; }
    .nav-links a { display: block; padding: 12px; color: #9ba4b5; cursor: pointer; border-radius: 8px; margin-bottom: 10px; text-decoration: none; font-weight: 500; }
    .nav-links a.active-nav { background: var(--card-bg); color: #fff; border-left: 4px solid #39FF14; font-weight: bold; }
    .logout-btn { padding: 12px; border: 1px solid #ff4b5c; color: #ff4b5c; text-align: center; cursor: pointer; border-radius: 8px; margin-top: auto; font-weight: bold; }
    .main-content { flex: 1; padding: 30px; overflow-y: auto; }
    .tab-content { display: none; } .tab-content.active { display: block; }
    .chart-card { background: var(--card-bg); padding: 25px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border-color); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; border-bottom: 1px solid #1f4068; text-align: left; font-size: 14px; }
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
    .modal-content { background: #162447; margin: 10% auto; padding: 25px; width: 400px; border-radius: 8px; border: 1px solid #39FF14; }
    .multi-graphs-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 20px; }
    .graph-box { background: #111827; padding: 18px; border-radius: 8px; border: 1px solid var(--border-color); }
    .graph-box h4 { margin-bottom: 12px; font-size: 14px; color: #9ba4b5; text-transform: uppercase; letter-spacing: 0.5px; }
    .canvas-wrapper { position: relative; height: 190px; width: 100%; }
    .status-select { background: #111827; color: #fff; border: 1px solid #1f4068; padding: 6px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; outline: none; }
  </style>
</head>
<body>

<aside class="sidebar">
    <div class="logo">VoltCalc Pro</div>
    <div class="user-greet">
        <h2>ADMIN JEFFERSON</h2>
    </div>
    <ul class="nav-links">
        <li><a onclick="mudarAba('tab-estatisticas', this)" class="active-nav">📊 Painel Live</a></li>
        <li><a onclick="mudarAba('tab-chamados', this)">✉️ Chamados</a></li>
        <li><a onclick="mudarAba('tab-usuarios', this)">👥 Base 'users'</a></li>
    </ul>
    <div class="logout-btn" onclick="firebase.auth().signOut().then(() => location.href='login.html')">Sair</div>
</aside>

<main class="main-content">
    <div id="tab-estatisticas" class="tab-content active">
        <h1>Painel de Operações</h1>
        <div class="chart-card">
            <h3>Total de Usuários</h3>
            <span id="total-users" style="font-size: 38px; font-weight: 900; color: #39FF14;">0</span>
        </div>
        <div class="multi-graphs-grid">
            <div class="graph-box"><div class="canvas-wrapper"><canvas id="barChart"></canvas></div></div>
            <div class="graph-box"><div class="canvas-wrapper"><canvas id="pieChart"></canvas></div></div>
        </div>
    </div>

    <div id="tab-chamados" class="tab-content">
        <h1>Gestão de Chamados</h1>
        <div class="chart-card">
            <table>
                <thead><tr><th>E-mail</th><th>Mensagem do Usuário</th><th>Status</th><th>Ação</th></tr></thead>
                <tbody id="tabela-chamados-body"></tbody>
            </table>
        </div>
    </div>

    <div id="tab-usuarios" class="tab-content">
        <h1>Usuários Cadastrados</h1>
        <div class="chart-card">
            <table>
                <thead><tr><th>Nome</th><th>E-mail</th></tr></thead>
                <tbody id="tabela-usuarios-body"></tbody>
            </table>
        </div>
    </div>
</main>

<script>
    const db = firebase.firestore();

    function mudarAba(id, el) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active-nav'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active-nav');
    }

    async function carregarDados() {
        // Usuarios
        db.collection('users').onSnapshot(snap => {
            document.getElementById('total-users').innerText = snap.size;
            const tbody = document.getElementById('tabela-usuarios-body');
            tbody.innerHTML = '';
            snap.forEach(doc => {
                const u = doc.data();
                tbody.innerHTML += `<tr><td>${u.nome || 'N/A'}</td><td>${u.email || 'N/A'}</td></tr>`;
            });
        });

        // Chamados com leitura de sub-coleção 'mensagens'
        db.collection('chamados').onSnapshot(async snap => {
            const tbody = document.getElementById('tabela-chamados-body');
            tbody.innerHTML = '';
            
            for (const doc of snap.docs) {
                const c = doc.data();
                let textoMensagem = "Carregando...";

                // Busca a mensagem na sub-coleção
                const msgSnap = await db.collection('chamados').doc(doc.id).collection('mensagens').limit(1).get();
                if (!msgSnap.empty) {
                    textoMensagem = msgSnap.docs[0].data().texto || msgSnap.docs[0].data().nensagem || "Sem descrição";
                } else {
                    textoMensagem = c.nensagem || c.mensagem || "Sem descrição";
                }

                tbody.innerHTML += `<tr>
                    <td>${c.email}</td>
                    <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis;">${textoMensagem}</td>
                    <td>${c.status || 'Pendente'}</td>
                    <td><button onclick="db.collection('chamados').doc('${doc.id}').delete()">Apagar</button></td>
                </tr>`;
            }
        });
    }

    window.onload = () => {
        carregarDados();
        // Inicialização de gráficos mantida igual...
    };
</script>
</body>
</html>
