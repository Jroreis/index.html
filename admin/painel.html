<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoltCalc Pro - Dashboard Admin</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    const firebaseConfig = {
        apiKey: "AIzaSyCbTPTFMUkuF3VVRgl8OOx_w6gIAekAVoQ",
        authDomain: "voltcalc-pro.firebaseapp.com",
        projectId: "voltcalc-pro",
        storageBucket: "voltcalc-pro.appspot.com",
        messagingSenderId: "411208955318",
        appId: "1:411208955318:web:8735802bf0f4ac8a1a3d17"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  </script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg-color: #1a1b2f; --card-bg: #162447; --border-color: #1f4068; --accent-neon: #39FF14; }
    body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: #fff; display: flex; height: 100vh; overflow: hidden; }
    
    /* SIDEBAR CORRIGIDA: flex-column com margin-top: auto para o botão fixar no fundo */
    .sidebar { width: 260px; background: #111827; padding: 30px 20px; display: flex; flex-direction: column; border-right: 1px solid var(--border-color); flex-shrink: 0; height: 100vh; }
    .logo { font-size: 24px; font-weight: 800; color: var(--accent-neon); margin-bottom: 20px; letter-spacing: 1px; }
    .user-greet { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .user-greet h2 { font-size: 14px; text-transform: uppercase; color: #fff; }
    .nav-links { list-style: none; flex-grow: 1; }
    .nav-links a { display: block; padding: 12px; color: #9ba4b5; cursor: pointer; border-radius: 8px; margin-bottom: 10px; font-weight: 500; }
    .nav-links a.active-nav { background: var(--card-bg); border-left: 4px solid #e43f5a; color: #fff; }
    
    /* BOTÃO LOGOUT FIXO NA BASE */
    .logout-btn { padding: 12px; border: 1px solid #ff4b5c; color: #ff4b5c; border-radius: 8px; cursor: pointer; text-align: center; margin-top: auto; font-weight: bold; }

    .main-content { flex: 1; padding: 30px; overflow-y: auto; }
    .tab-content { display: none; } .tab-content.active { display: block; }
    .chart-card { background: var(--card-bg); padding: 25px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border-color); }
  </style>
</head>
<body>

<aside class="sidebar">
    <div class="logo">VoltCalc Pro</div>
    <div class="user-greet">
        <small>Bem-vindo,</small>
        <h2>MILIONÁRIO JEFFERSON</h2>
        <div style="color: #39FF14; font-size: 11px;">jroreis4582@gmail.com</div>
    </div>
    <ul class="nav-links">
        <li><a onclick="mudarAba('tab-estatisticas', this)" class="active-nav">📊 Painel Geral</a></li>
        <li><a onclick="mudarAba('tab-chamados', this)">✉️ Chamados</a></li>
        <li><a onclick="mudarAba('tab-usuarios', this)">👥 Usuários</a></li>
    </ul>
    <div class="logout-btn" onclick="firebase.auth().signOut().then(() => location.href='login.html')">Sair do Sistema</div>
</aside>

<main class="main-content">
    <div id="tab-estatisticas" class="tab-content active">
        <h1>Painel Geral</h1>
        <div class="chart-card">
            <h3>Visão Geral de Acessos</h3>
            <canvas id="mainChart" height="80"></canvas>
        </div>
    </div>

    <div id="tab-chamados" class="tab-content">
        <h1>Chamados</h1>
        <div class="chart-card">
            <table id="tabela-chamados">
                <thead><tr><th>Email</th><th>Problema</th><th>Status</th></tr></thead>
                <tbody id="tabela-chamados-body"></tbody>
            </table>
        </div>
    </div>

    <div id="tab-usuarios" class="tab-content">
        <h1>Gestão de Usuários</h1>
        <div class="chart-card">
            <table>
                <thead><tr><th>Nome</th><th>Email</th></tr></thead>
                <tbody id="tabela-usuarios-body"></tbody>
            </table>
        </div>
    </div>
</main>

<script>
    function mudarAba(id, el) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active-nav'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active-nav');
    }

    // GRÁFICOS MAIS DETALHADOS
    const ctx = document.getElementById('mainChart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'],
            datasets: [
                { label: 'Acessos App', data: [12, 19, 3, 25, 32, 10, 8], borderColor: '#39FF14', tension: 0.4 },
                { label: 'Orçamentos Criados', data: [8, 11, 5, 18, 22, 6, 2], borderColor: '#e43f5a', tension: 0.4 }
            ]
        },
        options: { responsive: true, plugins: { legend: { labels: { color: '#fff' } } } }
    });

    // CARREGAR DADOS REAIS
    const db = firebase.firestore();
    
    // Usuários
    db.collection('users').get().then(snap => {
        const tbody = document.getElementById('tabela-usuarios-body');
        tbody.innerHTML = '';
        snap.forEach(doc => {
            const u = doc.data();
            tbody.innerHTML += `<tr><td>${u.nome || 'Sem Nome'}</td><td>${u.email}</td></tr>`;
        });
    });

    // Chamados
    db.collection('chamados').get().then(snap => {
        const tbody = document.getElementById('tabela-chamados-body');
        tbody.innerHTML = '';
        snap.forEach(doc => {
            const c = doc.data();
            tbody.innerHTML += `<tr><td>${c.email}</td><td>${c.problema}</td><td>${c.status || 'Pendente'}</td></tr>`;
        });
    });
</script>
</body>
</html>
