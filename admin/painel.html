<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo - VoltCalc Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; background: #f0f2f5; }
        .sidebar { width: 250px; background: #2c3e50; color: white; height: 100vh; padding: 20px; }
        .main { flex: 1; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-logout { background: #e74c3c; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; border-radius: 5px; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        /* Estilo do Modal */
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 15% auto; padding: 20px; width: 80%; max-width: 500px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>VoltCalc Pro</h2>
    <hr>
    <p>Bem-vindo, <strong>MILIONÁRIO JEFFERSON</strong></p>
    <button class="btn-logout" onclick="logout()">Sair do Painel</button>
</div>

<div class="main">
    <div class="card">
        <h3>Estatísticas Gerais</h3>
        <p id="total-users">Buscando dados...</p>
    </div>

    <div class="card">
        <h3>Chamados Recentes</h3>
        <table id="chamados-table">
            <thead><tr><th>Nome</th><th>Mensagem</th><th>Ação</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="card">
        <h3>Lista de Usuários</h3>
        <table id="users-table">
            <thead><tr><th>Nome</th><th>Email</th><th>Role</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<!-- Janela do Modal -->
<div id="detalhesModal" class="modal">
    <div class="modal-content">
        <h3>Detalhes do Chamado</h3>
        <p id="modal-body"></p>
        <button onclick="document.getElementById('detalhesModal').style.display='none'">Fechar</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCbTPTFMUkuF3VVRgl8OOx_w6gIAekAVoQ",
        authDomain: "voltcalc-pro.firebaseapp.com",
        projectId: "voltcalc-pro",
        storageBucket: "voltcalc-pro.appspot.com",
        messagingSenderId: "411208955318",
        appId: "1:411208955318:web:8735802bf0f4ac8a1a3d17"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }

    firebase.auth().onAuthStateChanged((user) => {
        if (!user) { window.location.href = "login.html"; }
    });

    function logout() { firebase.auth().signOut().then(() => { window.location.href = "login.html"; }); }

    const db = firebase.firestore();

    db.collection('users').onSnapshot(snapshot => {
        document.getElementById('total-users').innerText = "Total de Usuários Cadastrados: " + snapshot.size;
        const userTbody = document.querySelector('#users-table tbody');
        userTbody.innerHTML = "";
        snapshot.forEach(doc => {
            const data = doc.data();
            userTbody.innerHTML += `<tr><td>${data.nome || 'N/A'}</td><td>${data.email || 'N/A'}</td><td>${data.role || 'N/A'}</td></tr>`;
        });
    });

    const chamadosTbody = document.querySelector('#chamados-table tbody');
    db.collection('chamados').onSnapshot(snapshot => {
        chamadosTbody.innerHTML = "";
        snapshot.forEach(doc => {
            const data = doc.data();
            const row = document.createElement('tr');
            row.innerHTML = `<td>${data.nome || 'N/A'}</td><td>${data.mensagem || 'N/A'}</td>`;
            
            const btnCell = document.createElement('td');
            const btn = document.createElement('button');
            btn.innerText = "Ver";
            btn.onclick = () => {
                document.getElementById('modal-body').innerHTML = `
                    <strong>Nome:</strong> ${data.nome || 'N/A'}<br>
                    <strong>Email:</strong> ${data.email || 'N/A'}<br>
                    <strong>Mensagem:</strong> ${data.mensagem || 'N/A'}
                `;
                document.getElementById('detalhesModal').style.display = 'block';
            };
            btnCell.appendChild(btn);
            row.appendChild(btnCell);
            chamadosTbody.appendChild(row);
        });
    });
</script>
</body>
</html>
