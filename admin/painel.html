<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>VoltCalc Pro - Dashboard Admin</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    const firebaseConfig = {
        apiKey: "AIzaSyCbTPTFMUkuF3VVRgl8OOx_w6gIAekAVoQ",
        authDomain: "voltcalc-pro.firebaseapp.com",
        projectId: "voltcalc-pro",
        storageBucket: "voltcalc-pro.appspot.com",
        messagingSenderId: "411208955318",
        appId: "1:411208955318:web:8735802bf0f4ac8a1a3d17"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  </script>
  
  <style>
    /* Estilos preservados */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg-color: #1a1b2f; --card-bg: #162447; --border-color: #1f4068; --accent-neon: #39FF14; }
    body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: #fff; display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 260px; background: #111827; padding: 30px 20px; display: flex; flex-direction: column; border-right: 1px solid var(--border-color); }
    .logo { font-size: 24px; font-weight: 800; color: var(--accent-neon); margin-bottom: 30px; }
    .user-greet { margin-bottom: 30px; }
    .nav-links a { display: block; padding: 12px; color: #9ba4b5; cursor: pointer; border-radius: 8px; margin-bottom: 10px; }
    .nav-links a.active-nav { background: var(--card-bg); color: #fff; border-left: 4px solid #e43f5a; }
    .logout-btn { padding: 12px; border: 1px solid #ff4b5c; color: #ff4b5c; text-align: center; cursor: pointer; border-radius: 8px; margin-top: auto; }
    .main-content { flex: 1; padding: 30px; overflow-y: auto; }
    .tab-content { display: none; } .tab-content.active { display: block; }
    .chart-card { background: var(--card-bg); padding: 25px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border-color); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; border-bottom: 1px solid #1f4068; text-align: left; }
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
    .modal-content { background: #162447; margin: 10% auto; padding: 25px; width: 400px; border-radius: 8px; }
  </style>
</head>
<body>

<aside class="sidebar">
    <div class="logo">VoltCalc Pro</div>
    <div class="user-greet">
        <h2>MILIONÁRIO JEFFERSON</h2>
        <div style="color: #39FF14; font-size: 11px;">jroreis4582@gmail.com</div>
    </div>
    <ul class="nav-links">
        <li><a onclick="mudarAba('tab-estatisticas', this)" class="active-nav">📊 Painel</a></li>
        <li><a onclick="mudarAba('tab-chamados', this)">✉️ Chamados</a></li>
        <li><a onclick="mudarAba('tab-usuarios', this)">👥 Usuários</a></li>
    </ul>
    <div class="logout-btn" onclick="firebase.auth().signOut().then(() => location.href='login.html')">Sair</div>
</aside>

<main class="main-content">
    <div id="tab-estatisticas" class="tab-content active">
        <h1>Painel Geral</h1>
        <div class="chart-card">
            <h3>Usuários Ativos: <span id="total-users">0</span></h3>
            <canvas id="barChart" height="50"></canvas>
        </div>
    </div>

    <div id="tab-chamados" class="tab-content">
        <h1>Chamados</h1>
        <div class="chart-card">
            <table>
                <thead><tr><th>Email</th><th>Problema</th><th>Ações</th></tr></thead>
                <tbody id="tabela-chamados-body"></tbody>
            </table>
        </div>
    </div>

    <div id="tab-usuarios" class="tab-content">
        <h1>Gestão de Usuários</h1>
        <div class="chart-card">
            <table>
                <thead><tr><th>Nome</th><th>Email</th></tr></thead>
                <tbody id="tabela-usuarios-body"></tbody>
            </table>
        </div>
    </div>
</main>

<div id="modal-reply" class="modal">
    <div class="modal-content">
        <h3>Responder Chamado</h3>
        <p id="modal-email" style="color: #9ba4b5; margin: 10px 0;"></p>
        <textarea id="reply-text" placeholder="Escreva a resposta aqui..." style="width:100%; height:80px;"></textarea>
        <button style="background:#39FF14; border:none; padding:10px; width:100%; margin-top:10px; cursor:pointer;" onclick="enviarResposta()">Enviar Resposta no Site</button>
        <button style="background:transparent; border:none; color:#fff; width:100%; margin-top:10px; cursor:pointer;" onclick="fecharModal()">Fechar</button>
    </div>
</div>

<script>
    const db = firebase.firestore();

    function mudarAba(id, el) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active-nav'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active-nav');
    }

    // CARREGAR COM CHECAGEM DE SEGURANÇA (Se a tabela não existir, não dá erro)
    function carregarDados() {
        // Carregar Usuários
        if(document.getElementById('tabela-usuarios-body')) {
            db.collection('users').get().then(snap => {
                document.getElementById('total-users').innerText = snap.size;
                const tbody = document.getElementById('tabela-usuarios-body');
                tbody.innerHTML = '';
                snap.forEach(doc => {
                    const u = doc.data();
                    tbody.innerHTML += `<tr><td>${u.nome || 'Sem Nome'}</td><td>${u.email}</td></tr>`;
                });
            });
        }

        // Carregar Chamados
        if(document.getElementById('tabela-chamados-body')) {
            db.collection('chamados').get().then(snap => {
                const tbody = document.getElementById('tabela-chamados-body');
                tbody.innerHTML = '';
                snap.forEach(doc => {
                    const c = doc.data();
                    tbody.innerHTML += `<tr>
                        <td onclick="abrirModal('${c.email}', '${doc.id}')" style="color:cyan; cursor:pointer;">${c.email}</td>
                        <td>${c.problema}</td>
                        <td><button onclick="db.collection('chamados').doc('${doc.id}').delete().then(carregarDados)">Apagar</button></td>
                    </tr>`;
                });
            });
        }
    }

    function abrirModal(email, docId) {
        document.getElementById('modal-email').innerText = "Para: " + email;
        document.getElementById('modal-reply').dataset.id = docId;
        document.getElementById('modal-reply').style.display = 'block';
    }

    function enviarResposta() {
        const docId = document.getElementById('modal-reply').dataset.id;
        const resposta = document.getElementById('reply-text').value;
        
        // AQUI ESTÁ A MÁGICA: Em vez de e-mail, salvamos no banco na sub-coleção 'mensagens'
        db.collection('chamados').doc(docId).collection('mensagens').add({
            texto: resposta,
            data: new Date(),
            remetente: 'admin'
        }).then(() => {
            alert("Resposta enviada para o painel do usuário!");
            fecharModal();
        });
    }

    function fecharModal() { document.getElementById('modal-reply').style.display = 'none'; }

    window.onload = carregarDados;

    new Chart(document.getElementById('barChart'), { 
        type: 'bar', 
        data: { labels: ['Seg', 'Ter', 'Qua', 'Qui', 'Sex'], datasets: [{ label: 'Acessos', data: [12, 19, 3, 5, 20], backgroundColor: '#39FF14' }] } 
    });
</script>
</body>
</html>
