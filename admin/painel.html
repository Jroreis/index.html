<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel Administrativo - VoltCalc Pro</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0; display: flex; background: #f0f2f5; height: 100vh; }
    
    /* Sidebar */
    .sidebar { width: 250px; background: #2c3e50; color: white; padding: 20px; display: flex; flex-direction: column; }
    .nav-btn { width: 100%; padding: 15px; margin-bottom: 10px; background: #34495e; color: white; border: none; text-align: left; cursor: pointer; border-radius: 5px; }
    .nav-btn:hover { background: #1abc9c; }
    .btn-logout { background: #e74c3c; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; border-radius: 5px; margin-top: auto; }
    
    /* Conteúdo */
    .main { flex: 1; padding: 20px; overflow-y: auto; }
    .page-section { display: none; }
    .page-section.active { display: block; }
    
    .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
    .modal-content { background: white; margin: 15% auto; padding: 20px; width: 80%; max-width: 500px; border-radius: 8px; }
  </style>
</head>
<body>

<div class="sidebar">
    <h2>VoltCalc Pro</h2>
    <hr style="width:100%; margin: 20px 0;">
    <p>Bem-vindo,<br><strong>MILIONÁRIO JEFFERSON</strong></p>
    <div style="margin-top: 20px;">
        <button class="nav-btn" onclick="showSection('section-estatisticas')">📊 Estatísticas</button>
        <button class="nav-btn" onclick="showSection('section-chamados')">📩 Chamados Recentes</button>
        <button class="nav-btn" onclick="showSection('section-usuarios')">👥 Lista de Usuários</button>
    </div>
    <button class="btn-logout" onclick="logout()">Sair do Painel</button>
</div>

<div class="main">
    <!-- Estatísticas -->
    <section id="section-estatisticas" class="page-section active">
        <div class="card">
            <h3>Estatísticas Gerais</h3>
            <p id="total-users">Buscando dados...</p>
            <div style="margin-bottom: 10px;">
                <button onclick="changeChartType('bar')">Gráfico de Barras</button>
                <button onclick="changeChartType('line')">Gráfico de Linhas</button>
                <button onclick="changeChartType('pie')">Gráfico de Pizza</button>
            </div>
            <canvas id="userChart" style="max-height: 250px;"></canvas>
        </div>
    </section>

    <!-- Chamados -->
    <section id="section-chamados" class="page-section">
        <div class="card">
            <h3>Chamados Recentes</h3>
            <input type="text" id="search-chamados" placeholder="Buscar chamado por nome..." onkeyup="filterTable('chamados-table', 'search-chamados')" style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;">
            <table id="chamados-table">
                <thead><tr><th>Nome</th><th>Mensagem</th><th>Status</th><th>Ação</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </section>

    <!-- Usuários -->
    <section id="section-usuarios" class="page-section">
        <div class="card">
            <h3>Lista de Usuários</h3>
            <input type="text" id="search-users" placeholder="Buscar usuário por nome..." onkeyup="filterTable('users-table', 'search-users')" style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;">
            <table id="users-table">
                <thead><tr><th>Nome</th><th>Email</th><th>Role</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </section>
</div>

<div id="detalhesModal" class="modal">
    <div class="modal-content">
        <h3>Detalhes do Chamado</h3>
        <p id="modal-body"></p>
        <button onclick="document.getElementById('detalhesModal').style.display='none'">Fechar</button>
    </div>
</div>

<script>
    // Lógica de Navegação
    function showSection(id) {
        document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // Configurações Firebase e Lógicas (Preservadas 100%)
    const firebaseConfig = {
        apiKey: "AIzaSyCbTPTFMUkuF3VVRgl8OOx_w6gIAekAVoQ",
        authDomain: "voltcalc-pro.firebaseapp.com",
        projectId: "voltcalc-pro",
        storageBucket: "voltcalc-pro.appspot.com",
        messagingSenderId: "411208955318",
        appId: "1:411208955318:web:8735802bf0f4ac8a1a3d17"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    firebase.auth().onAuthStateChanged((user) => { if (!user) window.location.href = "login.html"; });
    function logout() { firebase.auth().signOut().then(() => window.location.href = "login.html"); }

    const db = firebase.firestore();
    const ctx = document.getElementById('userChart').getContext('2d');
    let userChart = new Chart(ctx, {
        type: 'bar',
        data: { labels: ['Clientes', 'Admins', 'Outros'], datasets: [{ label: 'Tipos de Usuários', data: [0, 0, 0], backgroundColor: ['#4285f4', '#e74c3c', '#f1c40f'] }] },
        options: { responsive: true, maintainAspectRatio: false }
    });

    function changeChartType(type) {
        userChart.destroy();
        userChart = new Chart(ctx, { type: type, data: userChart.data, options: { responsive: true, maintainAspectRatio: false } });
    }

    db.collection('users').onSnapshot(snapshot => {
        document.getElementById('total-users').innerText = "Total de Usuários Cadastrados: " + snapshot.size;
        let countCliente = 0, countAdmin = 0, countOutros = 0;
        const userTbody = document.querySelector('#users-table tbody');
        userTbody.innerHTML = "";
        snapshot.forEach(doc => {
            const data = doc.data();
            userTbody.innerHTML += `<tr><td>${data.nome || 'N/A'}</td><td>${data.email || 'N/A'}</td><td>${data.role || 'N/A'}</td></tr>`;
            const role = (data.role || '').toLowerCase();
            if (role === 'cliente') countCliente++; else if (role === 'admin') countAdmin++; else countOutros++;
        });
        userChart.data.datasets[0].data = [countCliente, countAdmin, countOutros];
        userChart.update();
    });

    function filterTable(tableId, inputId) {
        const input = document.getElementById(inputId);
        const filter = input.value.toUpperCase();
        const tr = document.getElementById(tableId).getElementsByTagName("tr");
        for (let i = 1; i < tr.length; i++) {
            const td = tr[i].getElementsByTagName("td")[0];
            tr[i].style.display = (td && (td.textContent || td.innerText).toUpperCase().indexOf(filter) > -1) ? "" : "none";
        }
    }

    db.collection('chamados').onSnapshot(snapshot => {
        const tbody = document.querySelector('#chamados-table tbody');
        tbody.innerHTML = "";
        snapshot.forEach(doc => {
            const data = doc.data(), docId = doc.id, status = data.status || 'Pendente';
            const row = document.createElement('tr');
            row.innerHTML = `<td>${data.nome || 'N/A'}</td><td>${data.mensagem || 'N/A'}</td><td><strong>${status}</strong></td>`;
            const btnCell = document.createElement('td');
            const btnVer = document.createElement('button');
            btnVer.innerText = "Ver";
            btnVer.onclick = () => {
                const tel = data.telefone ? data.telefone.replace(/\D/g, '') : "";
                const wpp = tel ? `<a href="https://wa.me/55${tel}?text=Olá ${data.nome || ''}" target="_blank" style="display:block; background:#25d366; color:white; padding:10px; text-align:center; border-radius:5px; text-decoration:none;">Chamar no WhatsApp</a>` : `<p>Sem WhatsApp.</p>`;
                document.getElementById('modal-body').innerHTML = `<strong>Nome:</strong> ${data.nome}<br><strong>Msg:</strong> ${data.mensagem}<br><br>${wpp}`;
                document.getElementById('detalhesModal').style.display = 'block';
            };
            btnCell.appendChild(btnVer);
            row.appendChild(btnCell);
            tbody.appendChild(row);
        });
    });
</script>
</body>
</html>
