<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo - VoltCalc Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; background: #f0f2f5; }
        .sidebar { width: 250px; background: #2c3e50; color: white; height: 100vh; padding: 20px; }
        .main { flex: 1; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-logout { background: #e74c3c; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; border-radius: 5px; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 15% auto; padding: 20px; width: 80%; max-width: 500px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>VoltCalc Pro</h2>
    <hr>
    <p>Bem-vindo, <strong>MILIONÁRIO JEFFERSON</strong></p>
    <button class="btn-logout" onclick="logout()">Sair do Painel</button>
</div>

<div class="main">
    <div class="card">
        <h3>Estatísticas Gerais</h3>
        <p id="total-users">Buscando dados...</p>
        <div style="margin-bottom: 10px;">
            <button onclick="changeChartType('bar')">Gráfico de Barras</button>
            <button onclick="changeChartType('line')">Gráfico de Linhas</button>
            <button onclick="changeChartType('pie')">Gráfico de Pizza</button>
        </div>
        <canvas id="userChart" style="max-height: 200px;"></canvas>
    </div>

    <div class="card">
        <h3>Chamados Recentes</h3>
        <input type="text" id="search-chamados" placeholder="Buscar chamado por nome..." onkeyup="filterTable('chamados-table', 'search-chamados')" style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;">
        <table id="chamados-table">
            <thead><tr><th>Nome</th><th>Mensagem</th><th>Status</th><th>Ação</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="card">
        <h3>Lista de Usuários</h3>
        <input type="text" id="search-users" placeholder="Buscar usuário por nome..." onkeyup="filterTable('users-table', 'search-users')" style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;">
        <table id="users-table">
            <thead><tr><th>Nome</th><th>Email</th><th>Role</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<div id="detalhesModal" class="modal">
    <div class="modal-content">
        <h3>Detalhes do Chamado</h3>
        <p id="modal-body"></p>
        <button onclick="document.getElementById('detalhesModal').style.display='none'">Fechar</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCbTPTFMUkuF3VVRgl8OOx_w6gIAekAVoQ",
        authDomain: "voltcalc-pro.firebaseapp.com",
        projectId: "voltcalc-pro",
        storageBucket: "voltcalc-pro.appspot.com",
        messagingSenderId: "411208955318",
        appId: "1:411208955318:web:8735802bf0f4ac8a1a3d17"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    firebase.auth().onAuthStateChanged((user) => { if (!user) window.location.href = "login.html"; });
    function logout() { firebase.auth().signOut().then(() => window.location.href = "login.html"); }

    const db = firebase.firestore();

    // Configuração do Gráfico
    const ctx = document.getElementById('userChart').getContext('2d');
    let userChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['7 dias atrás', '6 dias', '5 dias', '4 dias', '3 dias', 'Ontem', 'Hoje'],
            datasets: [{ label: 'Novos Usuários', data: [0, 0, 0, 0, 0, 0, 0], backgroundColor: '#4285f4' }]
        }
    });

    // Função para mudar o tipo do gráfico
    function changeChartType(type) {
        userChart.destroy();
        userChart = new Chart(ctx, {
            type: type,
            data: userChart.data,
            options: { responsive: true }
        });
    }

    db.collection('users').onSnapshot(snapshot => {
        document.getElementById('total-users').innerText = "Total de Usuários Cadastrados: " + snapshot.size;
        const userTbody = document.querySelector('#users-table tbody');
        userTbody.innerHTML = "";
        snapshot.forEach(doc => {
            const data = doc.data();
            userTbody.innerHTML += `<tr><td>${data.nome || 'N/A'}</td><td>${data.email || 'N/A'}</td><td>${data.role || 'N/A'}</td></tr>`;
        });
    });

    function filterTable(tableId, inputId) {
        const input = document.getElementById(inputId);
        const filter = input.value.toUpperCase();
        const table = document.getElementById(tableId);
        const tr = table.getElementsByTagName("tr");
        for (let i = 1; i < tr.length; i++) {
            const td = tr[i].getElementsByTagName("td")[0];
            if (td) {
                tr[i].style.display = (td.textContent || td.innerText).toUpperCase().indexOf(filter) > -1 ? "" : "none";
            }
        }
    }

    const chamadosTbody = document.querySelector('#chamados-table tbody');
    db.collection('chamados').onSnapshot(snapshot => {
        chamadosTbody.innerHTML = "";
        snapshot.forEach(doc => {
            const data = doc.data();
            const docId = doc.id;
            const status = data.status || 'Pendente';
            const row = document.createElement('tr');
            row.innerHTML = `<td>${data.nome || 'N/A'}</td><td>${data.mensagem || 'N/A'}</td><td><strong>${status}</strong></td>`;
            const btnCell = document.createElement('td');
            const btnVer = document.createElement('button');
            btnVer.innerText = "Ver";
            btnVer.onclick = () => {
                let acaoHtml = (data.telefone && data.telefone.trim() !== "") ? `<a href="https://wa.me/55${data.telefone.replace(/\D/g, '')}?text=Olá ${data.nome || ''}, vi seu chamado no VoltCalc Pro sobre: ${data.mensagem || ''}" target="_blank" style="display:block; background:#25d366; color:white; padding:10px; text-align:center; border-radius:5px; text-decoration:none;">Chamar no WhatsApp</a>` : `<p style="color:orange; font-size: 0.9em;">Sem WhatsApp.</p>`;
                document.getElementById('modal-body').innerHTML = `<strong>Nome:</strong> ${data.nome || 'N/A'}<br><strong>Email:</strong> ${data.email || 'N/A'}<br><strong>Telefone:</strong> ${data.telefone || 'Não informado'}<br><strong>Mensagem:</strong> ${data.mensagem || 'N/A'}<br><br>${acaoHtml}`;
                document.getElementById('detalhesModal').style.display = 'block';
            };
            const btnStatus = document.createElement('button');
            btnStatus.innerText = status === 'Pendente' ? "Concluir" : "Reabrir";
            btnStatus.onclick = () => { db.collection('chamados').doc(docId).update({ status: status === 'Pendente' ? 'Concluído' : 'Pendente' }); };
            btnCell.appendChild(btnVer);
            btnCell.appendChild(btnStatus);
            row.appendChild(btnCell);
            chamadosTbody.appendChild(row);
        });
    });
</script>
</body>
</html>
