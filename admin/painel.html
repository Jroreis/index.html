<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>VoltCalc Pro - Dashboard Admin</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
        --bg-deep: #020617;
        --sidebar-bg: #0f172a;
        --card-bg: rgba(30, 41, 59, 0.5);
        --accent-green: #39FF14;
        --text-main: #f8fafc;
        --text-dim: #94a3b8;
    }

    body { 
        font-family: 'Inter', sans-serif; 
        background-color: var(--bg-deep); 
        color: var(--text-main); 
        margin: 0; 
        display: flex; 
        height: 100vh;
        overflow: hidden;
    }

    /* Sidebar Refinada */
    .sidebar {
        width: 280px;
        background: var(--sidebar-bg);
        border-right: 1px solid rgba(255,255,255,0.05);
        padding: 40px 24px;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
    }

    .logo { font-size: 24px; font-weight: 800; color: var(--accent-green); margin-bottom: 60px; padding-left: 20px; }
    
    .user-greet { margin-bottom: 40px; padding-left: 20px; }
    .user-greet small { color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
    .user-greet h2 { margin: 8px 0 0 0; font-size: 18px; line-height: 1.3; }

    .nav-links { list-style: none; padding: 0; flex-grow: 1; }
    .nav-links li { margin-bottom: 12px; }
    .nav-links a { 
        display: block; padding: 16px 20px; border-radius: 12px; 
        color: var(--text-dim); text-decoration: none; transition: 0.3s;
        border: 1px solid transparent; display: flex; align-items: center; gap: 12px;
    }
    .nav-links a:hover { background: rgba(57, 255, 20, 0.05); color: var(--text-main); border-color: rgba(57, 255, 20, 0.2); }

    /* Botão Sair - Agora bem visível */
    .logout-btn { 
        margin-top: auto; padding: 16px 20px; border: 1px solid rgba(239, 68, 68, 0.2);
        color: #ef4444; background: rgba(239, 68, 68, 0.05);
        border-radius: 12px; cursor: pointer; text-align: center; font-weight: 600;
        transition: 0.3s;
    }
    .logout-btn:hover { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.4); }

    /* Área Principal */
    .main-content { flex: 1; padding: 40px; overflow-y: auto; }
    .card { 
        background: var(--card-bg); 
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.05); 
        border-radius: 24px;
        padding: 32px;
        max-width: 800px;
    }
    .card h3 { color: var(--accent-green); margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
  </style>
</head>
<body>

<aside class="sidebar">
    <div class="logo">VoltCalc Pro</div>
    <div class="user-greet">
        <small>Bem-vindo,</small>
        <h2>MILIONÁRIO JEFFERSON</h2>
    </div>
    <ul class="nav-links">
        <li><a href="#">📊 Estatísticas</a></li>
        <li><a href="#">✉️ Chamados</a></li>
        <li><a href="#">👥 Usuários</a></li>
    </ul>
    <!-- Botão de Sair posicionado aqui -->
    <div class="logout-btn" onclick="auth.signOut()">Sair do Sistema</div>
</aside>

<main class="main-content">
    <div class="card">
        <h3>Estatísticas Gerais</h3>
        <p>Total de usuários ativos: <strong>55</strong></p>
        <!-- Canvas para o seu gráfico -->
        <canvas id="myChart" style="margin-top: 20px;"></canvas>
    </div>
</main>

<script>
    // Placeholder para sua lógica de Auth
    const auth = firebase.auth();
    // Exemplo de como o gráfico seria inicializado
    const ctx = document.getElementById('myChart').getContext('2d');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Clientes', 'Admins', 'Outros'],
            datasets: [{ label: 'Qtd', data: [2, 0, 53], backgroundColor: '#39FF14' }]
        },
        options: { responsive: true, plugins: { legend: { labels: { color: '#f8fafc' } } } }
    });
</script>

</body>
</html>
