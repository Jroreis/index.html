<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Gerência - VoltCalc Pro</title>
    
    <!-- Importação do Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f4; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        .menu-abas { margin-top: 20px; }
        .menu-abas div { 
            background-color: #e9ecef; 
            padding: 15px; 
            margin-bottom: 10px; 
            border-radius: 5px; 
            border-left: 5px solid #007bff;
            cursor: pointer;
            transition: 0.3s;
        }
        .menu-abas div:hover { background-color: #d1e7ff; }
        button { padding: 10px 15px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 20px; }
        #area-conteudo { margin-top: 20px; padding: 15px; border: 1px dashed #ccc; border-radius: 5px; min-height: 100px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Painel de Controle</h1>
    <p>Área administrativa segura.</p>
    
    <div class="menu-abas">
        <div onclick="carregarConteudo('suporte')">
            <strong>🔍 Suporte a Usuários</strong>
        </div>
        <div onclick="carregarConteudo('nbr')">
            <strong>📊 Gestão NBR 5410</strong>
        </div>
    </div>

    <div id="area-conteudo">
        <em>Clique em uma opção acima para carregar o conteúdo.</em>
    </div>

    <button onclick="sair()">Encerrar Sessão</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCbTPTFMUkuF3VVRgl8OOx_w6gIAekAVoQ",
        authDomain: "voltcalc-pro.firebaseapp.com",
        projectId: "voltcalc-pro",
        storageBucket: "voltcalc-pro.firebasestorage.app",
        messagingSenderId: "411208955318",
        appId: "1:411208955318:web:8735802bf0f4ac8a1a3d17"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    firebase.auth().onAuthStateChanged((user) => {
        if (!user) {
            window.location.href = "/admin/index.html";
        }
    });

    function carregarConteudo(secao) {
        const area = document.getElementById('area-conteudo');
        if (secao === 'suporte') {
            area.innerHTML = "<h3>Suporte a Usuários</h3><p>Aqui aparecerá a lista de usuários cadastrados no seu Firebase para você gerenciar.</p>";
        } else if (secao === 'nbr') {
            area.innerHTML = "<h3>Gestão NBR 5410</h3><p>Aqui você poderá editar os valores e tabelas técnicas que o VoltCalc Pro utiliza.</p>";
        }
    }

    function sair() {
        firebase.auth().signOut().then(() => {
            window.location.href = "/admin/index.html";
        });
    }
</script>

</body>
</html>
