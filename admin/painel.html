<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo - VoltCalc Pro</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; background: #f0f2f5; }
        .sidebar { width: 250px; background: #2c3e50; color: white; height: 100vh; padding: 20px; }
        .main { flex: 1; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-logout { background: #e74c3c; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; border-radius: 5px; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>VoltCalc Pro</h2>
    <hr>
    <p>Bem-vindo, <strong>MILIONÁRIO</strong></p>
    <button class="btn-logout" onclick="logout()">Sair do Painel</button>
</div>

<div class="main">
    <div class="card" id="stats">
        <h3>Estatísticas Gerais</h3>
        <p id="total-users">Buscando dados...</p>
    </div>

    <div class="card">
        <h3>Chamados Recentes</h3>
        <table id="chamados-table">
            <thead><tr><th>Nome</th><th>Endereço</th><th>Ação</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCbTPTFMUkuF3VVRgl8OOx_w6gIAekAVoQ",
        authDomain: "voltcalc-pro.firebaseapp.com",
        projectId: "voltcalc-pro",
        storageBucket: "voltcalc-pro.appspot.com",
        messagingSenderId: "411208955318",
        appId: "1:411208955318:web:8735802bf0f4ac8a1a3d17"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }

    function logout() {
        firebase.auth().signOut().then(() => { window.location.href = "login.html"; });
    }

    const db = firebase.firestore();

    // Contador de Usuários
    db.collection('users').get().then(snap => {
        document.getElementById('total-users').innerText = "Total de Usuários Cadastrados: " + snap.size;
    }).catch(err => {
        document.getElementById('total-users').innerText = "Erro ao carregar usuários.";
    });

    // Chamados
    db.collection('chamados').get().then(snapshot => {
        const tbody = document.querySelector('#chamados-table tbody');
        snapshot.forEach(doc => {
            const data = doc.data();
            tbody.innerHTML += `<tr><td>${data.clientName || 'N/A'}</td><td>${data.address || 'N/A'}</td><td>Ver</td></tr>`;
        });
    });
</script>
</body>
</html>
