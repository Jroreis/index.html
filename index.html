<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 16px;
      padding: 30px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .title {
      font-size: 26px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 25px;
      color: #212529;
    }
    .input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #dee2e6;
      border-radius: 10px;
      font-size: 16px;
      background: #fff;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      margin-top: 5px;
    }
    .btn-primary { background: #4361ee; }
    .btn-success { background: #2ec4b6; }
    .btn-danger { background: #e63946; }
    .btn:active { opacity: 0.8; }
    .link {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: #4361ee;
      cursor: pointer;
    }
    .link-green { color: #2ec4b6; }

    /* Home */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .greeting { font-size: 18px; font-weight: 600; color: #212529; }
    .btn-logout { color: #e63946; font-weight: 600; background: none; border: none; font-size: 14px; cursor: pointer; }
    .form-row { margin-bottom: 20px; }
    .add-btn {
      width: 100%;
      padding: 14px;
      background: #4361ee;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .item {
      background: #f8f9fa;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #e9ecef;
    }
    .item-content { flex: 1; }
    .item-title { font-size: 15px; font-weight: 600; color: #212529; }
    .item-desc { font-size: 13px; color: #6c757d; margin-top: 3px; }
    .item-date { font-size: 11px; color: #adb5bd; margin-top: 4px; }
    .btn-delete {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 5px;
    }
    .empty { text-align: center; color: #adb5bd; margin-top: 30px; font-size: 15px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ==================== TELA DE LOGIN ==================== -->
  <div class="container" id="loginScreen">
    <h1 class="title">Entrar</h1>
    <input class="input" type="email" id="loginEmail" placeholder="Email" autocomplete="email">
    <input class="input" type="password" id="loginPassword" placeholder="Senha" autocomplete="current-password">
    <button class="btn btn-primary" id="loginBtn">Entrar</button>
    <p class="link" id="goToSignup">Não tem conta? Cadastre-se</p>
    <p id="loginError" style="color: #e63946; text-align: center; margin-top: 10px; font-size: 13px;"></p>
  </div>

  <!-- ==================== TELA DE CADASTRO ==================== -->
  <div class="container hidden" id="signupScreen">
    <h1 class="title">Cadastro</h1>
    <input class="input" type="text" id="signupName" placeholder="Nome">
    <input class="input" type="email" id="signupEmail" placeholder="Email" autocomplete="email">
    <input class="input" type="password" id="signupPassword" placeholder="Senha (mínimo 6 caracteres)" autocomplete="new-password">
    <button class="btn btn-success" id="signupBtn">Cadastrar</button>
    <p class="link link-green" id="goToLogin">Já tem conta? Faça login</p>
    <p id="signupError" style="color: #e63946; text-align: center; margin-top: 10px; font-size: 13px;"></p>
  </div>

  <!-- ==================== TELA HOME ==================== -->
  <div class="container hidden" id="homeScreen">
    <div class="header">
      <span class="greeting" id="greetingText">Olá!</span>
      <button class="btn-logout" id="logoutBtn">Sair</button>
    </div>

    <div class="form-row">
      <input class="input" type="text" id="itemTitle" placeholder="Título">
      <input class="input" type="text" id="itemDesc" placeholder="Descrição (opcional)">
      <button class="add-btn" id="addItemBtn">Adicionar</button>
    </div>

    <div id="itemsList"></div>
    <p class="empty" id="emptyMsg">Nenhum item. Adicione um acima!</p>
  </div>

  <script>
    // ============ BANCO DE DADOS (LocalStorage) ============
    function getUsers() { return JSON.parse(localStorage.getItem('users') || '[]'); }
    function saveUsers(users) { localStorage.setItem('users', JSON.stringify(users)); }
    function getLoggedUser() { return JSON.parse(localStorage.getItem('loggedUser') || 'null'); }
    function saveLoggedUser(user) { localStorage.setItem('loggedUser', JSON.stringify(user)); }
    function getItems() { return JSON.parse(localStorage.getItem('items') || '[]'); }
    function saveItems(items) { localStorage.setItem('items', JSON.stringify(items)); }

    // ============ TELAS ============
    const loginScreen = document.getElementById('loginScreen');
    const signupScreen = document.getElementById('signupScreen');
    const homeScreen = document.getElementById('homeScreen');

    function showScreen(screen) {
      loginScreen.classList.add('hidden');
      signupScreen.classList.add('hidden');
      homeScreen.classList.add('hidden');
      screen.classList.remove('hidden');
    }

    // ============ LOGIN ============
    document.getElementById('loginBtn').addEventListener('click', () => {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const error = document.getElementById('loginError');
      error.textContent = '';

      if (!email || !password) return error.textContent = 'Preencha todos os campos';

      const users = getUsers();
      const user = users.find(u => u.email === email && u.password === password);
      if (!user) return error.textContent = 'Email ou senha inválidos';

      saveLoggedUser({ id: user.id, name: user.name, email: user.email });
      document.getElementById('loginEmail').value = '';
      document.getElementById('loginPassword').value = '';
      loadHome();
      showScreen(homeScreen);
    });

    document.getElementById('goToSignup').addEventListener('click', () => {
      document.getElementById('loginError').textContent = '';
      showScreen(signupScreen);
    });

    // ============ CADASTRO ============
    document.getElementById('signupBtn').addEventListener('click', () => {
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const error = document.getElementById('signupError');
      error.textContent = '';

      if (!name || !email || !password) return error.textContent = 'Preencha todos os campos';
      if (password.length < 6) return error.textContent = 'Senha deve ter pelo menos 6 caracteres';

      const users = getUsers();
      if (users.find(u => u.email === email)) return error.textContent = 'Email já cadastrado';

      const newUser = { id: Date.now().toString(), name, email, password };
      users.push(newUser);
      saveUsers(users);
      saveLoggedUser({ id: newUser.id, name, email });

      document.getElementById('signupName').value = '';
      document.getElementById('signupEmail').value = '';
      document.getElementById('signupPassword').value = '';
      loadHome();
      showScreen(homeScreen);
    });

    document.getElementById('goToLogin').addEventListener('click', () => {
      document.getElementById('signupError').textContent = '';
      showScreen(loginScreen);
    });

    // ============ HOME ============
    function loadHome() {
      const user = getLoggedUser();
      document.getElementById('greetingText').textContent = `Olá, ${user?.name || '...'}`;
      renderItems();
    }

    function renderItems() {
      const user = getLoggedUser();
      const allItems = getItems();
      const userItems = allItems.filter(i => i.user_id === user.id).reverse();
      const listEl = document.getElementById('itemsList');
      const emptyMsg = document.getElementById('emptyMsg');

      if (userItems.length === 0) {
        listEl.innerHTML = '';
        emptyMsg.style.display = 'block';
        return;
      }

      emptyMsg.style.display = 'none';
      listEl.innerHTML = userItems.map(item => `
        <div class="item">
          <div class="item-content">
            <div class="item-title">${escapeHTML(item.title)}</div>
            ${item.description ? `<div class="item-desc">${escapeHTML(item.description)}</div>` : ''}
            <div class="item-date">${item.created_at}</div>
          </div>
          <button class="btn-delete" data-id="${item.id}">🗑️</button>
        </div>
      `).join('');

      // Eventos de deletar
      listEl.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', () => {
          if (confirm('Excluir este item?')) {
            const itemId = btn.getAttribute('data-id');
            const items = getItems().filter(i => i.id !== itemId);
            saveItems(items);
            renderItems();
          }
        });
      });
    }

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    document.getElementById('addItemBtn').addEventListener('click', () => {
      const title = document.getElementById('itemTitle').value.trim();
      const description = document.getElementById('itemDesc').value.trim();
      if (!title) return alert('Digite um título');

      const user = getLoggedUser();
      const items = getItems();
      const newItem = {
        id: Date.now().toString(),
        user_id: user.id,
        title,
        description,
        created_at: new Date().toLocaleString('pt-BR'),
      };
      items.push(newItem);
      saveItems(items);
      document.getElementById('itemTitle').value = '';
      document.getElementById('itemDesc').value = '';
      renderItems();
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      if (confirm('Deseja sair?')) {
        localStorage.removeItem('loggedUser');
        showScreen(loginScreen);
      }
    });

    // ============ INÍCIO ============
    (function init() {
      const user = getLoggedUser();
      if (user) {
        loadHome();
        showScreen(homeScreen);
      } else {
        showScreen(loginScreen);
      }
    })();
  </script>
</body>
</html>
