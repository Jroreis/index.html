<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>VoltCalc Pro</title>

  <link rel="manifest" href="manifest.json">

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-zinc-950 text-white">

<header class="p-4 text-xl font-bold">⚡ VoltCalc Pro</header>

<!-- ================= LOGIN ================= -->
<section class="p-4">
  <button onclick="login()" class="bg-white text-black px-4 py-2 rounded-xl">
    Entrar com Google
  </button>
</section>

<!-- ================= OHM ================= -->
<section class="p-4">
  <h2 class="text-2xl mb-3">Lei de Ohm</h2>

  <input id="V" placeholder="Tensão (V)" class="p-2 text-black w-full mb-2">
  <input id="I" placeholder="Corrente (A)" class="p-2 text-black w-full mb-2">
  <input id="R" placeholder="Resistência (Ω)" class="p-2 text-black w-full mb-2">
  <input id="P" placeholder="Potência (W)" class="p-2 text-black w-full mb-2">

  <button onclick="calcOhm()" class="bg-yellow-500 text-black px-4 py-2 w-full">
    Calcular
  </button>

  <div id="result" class="mt-4"></div>
</section>

<!-- ================= HISTÓRICO ================= -->
<section class="p-4">
  <h2 class="text-xl mb-2">Histórico</h2>
  <div id="history"></div>
</section>

<!-- ================= FIREBASE ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "SUA_API",
  authDomain: "SEU_AUTH",
  projectId: "SEU_PROJECT"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

window.auth = auth;
window.db = db;

/* LOGIN */
window.login = async () => {
  await signInWithPopup(auth, provider);
};

/* SALVAR */
window.save = async (data) => {
  const user = auth.currentUser;
  if (!user) return;

  await addDoc(collection(db, "history"), {
    ...data,
    userId: user.uid
  });
};

/* HISTÓRICO */
window.loadHistory = async () => {
  const snap = await getDocs(collection(db, "history"));
  const el = document.getElementById("history");

  el.innerHTML = "";

  snap.forEach(d => {
    const x = d.data();
    el.innerHTML += `
      <div class="p-2 border-b border-zinc-700">
        ⚡ ${x.voltage}V | 🔌 ${x.current}A | 🔥 ${x.power}W
      </div>
    `;
  });
};

window.loadHistory();
</script>

<!-- ================= LÓGICA ================= -->
<script>
function calcOhm() {

  let V = +document.getElementById("V").value;
  let I = +document.getElementById("I").value;
  let R = +document.getElementById("R").value;
  let P = +document.getElementById("P").value;

  if (V && I) {
    R = V / I;
    P = V * I;
  } else if (V && R) {
    I = V / R;
    P = V * I;
  } else if (I && R) {
    V = I * R;
    P = V * I;
  } else {
    alert("Preencha 2 campos");
    return;
  }

  document.getElementById("result").innerHTML =
    `V: ${V} | I: ${I} | R: ${R} | P: ${P}`;

  save({ voltage: V, current: I, resistance: R, power: P });
  loadHistory();
}
</script>

<!-- ================= PWA ================= -->
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js");
}
</script>

</body>
</html>
