<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltCalc Pro - Editor CAD NBR 5410</title>
    <script src="https://unpkg.com/konva@9.3.1/konva.min.js"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; overflow: hidden; 
            background: #1a1b2f; font-family: 'Segoe UI', Tahoma, sans-serif; 
        }
        .cad-container { display: flex; height: 100vh; }
        
        /* BARRA LATERAL ESQUERDA - FERRAMENTAS */
        .toolbar { 
            width: 220px; background: #111827; padding: 20px; 
            border-right: 1px solid #1f4068; color: #fff; z-index: 10;
        }
        .toolbar h3 { color: #39FF14; margin-bottom: 20px; text-transform: uppercase; font-size: 14px;}
        .toolbar button { 
            width: 100%; padding: 12px; margin-bottom: 10px; 
            background: #162447; border: 1px solid #1f4068; color: #fff; 
            cursor: pointer; border-radius: 5px; font-weight: bold; transition: 0.3s;
            text-align: left;
        }
        .toolbar button:hover { background: #39FF14; color: #000; }
        
        /* ÁREA DE DESENHO - ESTILO AUTOCAD GRID */
        #container-canvas { 
            flex: 1; 
            background-color: #ffffff;
            background-image: 
                linear-gradient(#e5e7eb 1px, transparent 1px),
                linear-gradient(90deg, #e5e7eb 1px, transparent 1px);
            background-size: 25px 25px; /* Tamanho do Grid */
            position: relative; 
        }
        
        /* BARRA LATERAL DIREITA - CÁLCULOS */
        .sidebar-calculo { 
            width: 300px; background: #111827; padding: 20px; 
            border-left: 1px solid #1f4068; color: #fff; z-index: 10;
            display: flex; flex-direction: column; overflow-y: auto;
        }
        .sidebar-calculo h3 { color: #e43f5a; text-transform: uppercase; font-size: 14px; margin-bottom: 20px; }
        #resultado-calculo p { color: #9ba4b5; font-size: 14px; margin-bottom: 5px; }
        #resultado-calculo strong { color: #fff; }
        .linha-divisoria { border: 0; border-top: 1px solid #1f4068; margin: 15px 0; }
        .valor-total { font-size: 24px; color: #39FF14; font-weight: bold; text-align: center; margin: 15px 0; }
    </style>
</head>
<body>

<div class="cad-container">
    <div class="toolbar">
        <h3>Símbolos NBR 5410</h3>
        <button onclick="adicionarElemento('tomada')">⏏️ Tomada</button>
        <button onclick="adicionarElemento('lampada')">⊗ Ponto de Luz</button>
        <button onclick="adicionarElemento('interruptor')">⚬ Interruptor</button>
        <button onclick="adicionarElemento('quadro')">🗄️ Quadro (QDC)</button>
    </div>
    
    <div id="container-canvas"></div>
    
    <div class="sidebar-calculo">
        <h3>Propriedades</h3>
        <div id="resultado-calculo">
            <p>Selecione um componente para inspecionar...</p>
        </div>
    </div>
</div>

<script>
    const container = document.getElementById('container-canvas');
    const width = container.offsetWidth;
    const height = window.innerHeight;
    
    const stage = new Konva.Stage({ container: 'container-canvas', width: width, height: height });
    const layer = new Konva.Layer();
    stage.add(layer);

    let selected = null; 
    const ESCALA_PIXELS_POR_METRO = 50; 
    const COR_TRACO = '#1e293b'; // Cor padrão do desenho técnico (Azul/Preto bem escuro)

    const TABELA_PRECOS = {
        caboMetro: 3.50,       
        pontoTomada: 45.00,    
        pontoLampada: 40.00,   
        pontoInterruptor: 30.00, 
        pontoQuadro: 150.00  
    };

    // ==========================================
    // CONSTRUTORES DE SÍMBOLOS VETORIAIS (AUTOCAD STYLE)
    // ==========================================
    function criarTomada(x, y) {
        const group = new Konva.Group({ x, y, draggable: true, name: 'tomada' });
        // Triângulo
        group.add(new Konva.RegularPolygon({ sides: 3, radius: 16, stroke: COR_TRACO, strokeWidth: 2, fill: 'transparent' }));
        // Área de clique invisível
        group.add(new Konva.Circle({ radius: 18, fill: 'rgba(0,0,0,0)' }));
        return group;
    }

    function criarLampada(x, y) {
        const group = new Konva.Group({ x, y, draggable: true, name: 'lampada' });
        group.add(new Konva.Circle({ radius: 16, stroke: COR_TRACO, strokeWidth: 2 }));
        group.add(new Konva.Line({ points: [-11, -11, 11, 11], stroke: COR_TRACO, strokeWidth: 2 }));
        group.add(new Konva.Line({ points: [11, -11, -11, 11], stroke: COR_TRACO, strokeWidth: 2 }));
        group.add(new Konva.Circle({ radius: 18, fill: 'rgba(0,0,0,0)' }));
        return group;
    }

    function criarInterruptor(x, y) {
        const group = new Konva.Group({ x, y, draggable: true, name: 'interruptor' });
        group.add(new Konva.Circle({ radius: 8, stroke: COR_TRACO, strokeWidth: 2, fill: 'transparent' }));
        group.add(new Konva.Circle({ radius: 12, fill: 'rgba(0,0,0,0)' }));
        return group;
    }

    function criarQuadro(x, y) {
        const group = new Konva.Group({ x, y, draggable: true, name: 'quadro' });
        group.add(new Konva.Rect({ x: -15, y: -25, width: 30, height: 50, stroke: COR_TRACO, strokeWidth: 2, fill: 'transparent' }));
        group.add(new Konva.Line({ points: [-15, 0, 15, 0], stroke: COR_TRACO, strokeWidth: 2 })); // Divisória do QDC
        group.add(new Konva.Rect({ x: -15, y: -25, width: 30, height: 50, fill: 'rgba(0,0,0,0)' }));
        return group;
    }

    // Função para alterar a cor quando selecionado
    function alternarSelecaoVisual(grupo, isSelected) {
        const cor = isSelected ? '#39FF14' : COR_TRACO;
        const espessura = isSelected ? 3 : 2;
        grupo.getChildren().forEach(filho => {
            if (filho.fill() !== 'rgba(0,0,0,0)') { // Ignora a área de clique
                if (filho.stroke()) {
                    filho.stroke(cor);
                    filho.strokeWidth(espessura);
                }
            }
        });
        layer.draw();
    }

    // Matemática
    function calcularDistanciaPixels(x1, y1, x2, y2) { return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2)); }

    // ==========================================
    // LÓGICA FINANCEIRA E RESUMO
    // ==========================================
    function gerarResumoProjeto() {
        let pixelsTotal = 0;
        let pTomada = 0, pLampada = 0, pInterruptor = 0, pQuadro = 0;

        layer.children.forEach(node => {
            if (node.name() === 'tomada') pTomada++;
            if (node.name() === 'lampada') pLampada++;
            if (node.name() === 'interruptor') pInterruptor++;
            if (node.name() === 'quadro') pQuadro++;
        });

        layer.find('Line').forEach(line => {
            const p = line.points();
            pixelsTotal += calcularDistanciaPixels(p[0], p[1], p[2], p[3]);
        });

        const metrosTotal = (pixelsTotal / ESCALA_PIXELS_POR_METRO);
        
        const totalRs = (metrosTotal * TABELA_PRECOS.caboMetro) + 
                        (pTomada * TABELA_PRECOS.pontoTomada) + 
                        (pLampada * TABELA_PRECOS.pontoLampada) + 
                        (pInterruptor * TABELA_PRECOS.pontoInterruptor) + 
                        (pQuadro * TABELA_PRECOS.pontoQuadro);

        return `
            <hr class="linha-divisoria">
            <p><strong>Resumo Global:</strong></p>
            <p>Tomadas: <span style="color:#fff">${pTomada}</span></p>
            <p>Iluminação/Interruptores: <span style="color:#fff">${pLampada + pInterruptor}</span></p>
            <p>Quadros (QDC): <span style="color:#fff">${pQuadro}</span></p>
            <p>Eletrodutos: <span style="color:#e43f5a">${metrosTotal.toFixed(2)} m</span></p>
            
            <div class="valor-total">
                ${totalRs.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}
            </div>

            <button style="background: #39FF14; color: #000; border: none; padding: 10px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer;">Gerar Planta em PDF</button>
        `;
    }

    function atualizarPainelVazio() {
        document.getElementById('resultado-calculo').innerHTML = `<p>Planta livre...</p>${gerarResumoProjeto()}`;
    }

    // ==========================================
    // MOTOR DE DESENHO (DRAG AND DROP E CONEXÃO)
    // ==========================================
    function adicionarElemento(tipo) {
        let shape;
        let startX = 100 + Math.random() * 50; 
        let startY = 100 + Math.random() * 50;
        
        if (tipo === 'tomada') shape = criarTomada(startX, startY);
        if (tipo === 'lampada') shape = criarLampada(startX, startY);
        if (tipo === 'interruptor') shape = criarInterruptor(startX, startY);
        if (tipo === 'quadro') shape = criarQuadro(startX, startY);

        shape.linesAttached = []; 

        shape.on('dragmove', () => {
            shape.linesAttached.forEach(line => {
                const points = line.points();
                if (line.source === shape) {
                    points[0] = shape.x(); points[1] = shape.y();
                } else {
                    points[2] = shape.x(); points[3] = shape.y();
                }
                line.points(points);
            });
            if(selected === shape) shape.fire('click'); 
        });

        shape.on('click', (e) => {
            e.cancelBubble = true; 
            if (!selected) {
                selected = shape;
                alternarSelecaoVisual(shape, true);
            } else if (selected !== shape) {
                const line = new Konva.Line({
                    points: [selected.x(), selected.y(), shape.x(), shape.y()],
                    stroke: '#e43f5a', strokeWidth: 2, dash: [8, 4], tension: 0 // Eletroduto avermelhado técnico
                });
                line.source = selected;
                line.target = shape;
                selected.linesAttached.push(line);
                shape.linesAttached.push(line);
                layer.add(line);
                line.moveToBottom(); 
                
                alternarSelecaoVisual(selected, false);
                selected = null;
            }
            layer.draw();

            document.getElementById('resultado-calculo').innerHTML = `
                <p><strong>Atributos:</strong> ${tipo.toUpperCase()}</p>
                <p><strong>Configuração NBR:</strong> Padrão</p>
                <button style="background: #1f4068; color: #fff; border: 1px solid #39FF14; padding: 8px; width: 100%; border-radius: 4px; cursor: pointer; margin-top: 10px;">Propriedades do Ponto</button>
                ${gerarResumoProjeto()}
            `;
        });

        layer.add(shape);
        layer.draw();
        atualizarPainelVazio();
    }
    
    stage.on('click', (e) => {
        if (e.target === stage) {
            if (selected) {
                alternarSelecaoVisual(selected, false);
                selected = null;
            }
            atualizarPainelVazio();
        }
    });

    window.addEventListener('resize', () => {
        stage.width(container.offsetWidth);
        stage.height(window.innerHeight);
    });
</script>

</body>
</html>
