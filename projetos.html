<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADe SIMU Web Studio - VoltCalc Professional</title>
    <script src="https://unpkg.com/konva@9.3.1/konva.min.js"></script>
    <style>
        :root {
            --sys-bg: #f0f0f0;
            --bar-bg: #e4e4e4;
            --sub-bg: #d4d4d4;
            --border-cad: #a0a0a0;
            --btn-hover: #cbe3f7;
            --btn-active: #99c8f2;
            --text-cad: #1e1e1e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: #525659; display: flex; flex-direction: column; }

        .sys-toolbar { height: 36px; background: var(--sys-bg); border-bottom: 1px solid var(--border-cad); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 12px; z-index: 100; }
        .sys-group { display: flex; align-items: center; gap: 5px; }
        .btn-cad { background: #fff; border: 1px solid #b0b0b0; color: var(--text-cad); width: 26px; height: 26px; border-radius: 2px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; transition: 0.1s; }
        .btn-cad:hover { background: var(--btn-hover); border-color: #3b82f6; }
        .btn-cad.text-btn { width: auto; padding: 0 10px; font-weight: 600; font-size: 11px; }
        .divisor { width: 1px; height: 20px; background: #b0b0b0; margin: 0 6px; }
        .btn-play { color: #16a34a; font-weight: 800; }
        .btn-stop { color: #dc2626; font-weight: 800; }
        .cat-toolbar { height: 34px; background: var(--bar-bg); border-bottom: 1px solid var(--border-cad); display: flex; align-items: center; padding: 0 10px; gap: 4px; overflow-x: auto; z-index: 90; }
        .cat-btn { background: transparent; border: 1px solid transparent; padding: 5px 10px; font-size: 11px; font-weight: 600; color: #444; border-radius: 3px; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .cat-btn.active { background: #fff; border-color: #888; color: #005fb8; font-weight: bold; border-bottom: 2px solid #005fb8; }
        .sub-toolbar { height: 40px; background: var(--sub-bg); border-bottom: 1px solid #888; display: flex; align-items: center; padding: 0 12px; gap: 8px; overflow-x: auto; z-index: 80; }
        .comp-spawn-btn { background: #f8f9fa; border: 1px solid #6c757d; padding: 4px 10px; border-radius: 3px; font-size: 11px; font-weight: 600; cursor: pointer; height: 28px; }
        .viewport-container { flex: 1; overflow: auto; padding: 25px; position: relative; display: flex; align-items: flex-start; justify-content: center; }
        .folha-a3 { width: 1050px; height: 740px; background: #ffffff; box-shadow: 0 0 30px rgba(0,0,0,0.6); position: relative; }
        #stage-parent { width: 100%; height: 100%; position: absolute; top: 0; left: 0; cursor: crosshair; }
        .prop-modal-quick { position: absolute; top: 75px; right: 30px; background: #0f172a; color: white; border: 2px solid #3b82f6; padding: 14px; border-radius: 8px; display: none; z-index: 2000; flex-direction: column; width: 230px; }
        .prop-modal-quick input { background: #1e293b; border: 1px solid #64748b; color: #39FF14; padding: 6px 8px; width: 100%; font-size: 12px; text-align: center; margin-bottom: 5px; }
        .btn-modal-acao { background: #334155; color: white; border: 1px solid #64748b; padding: 6px; border-radius: 4px; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="sys-toolbar">
        <div class="sys-group">
            <button class="btn-cad" onclick="limparFolha()">📄</button>
            <input type="file" id="uploadPlanta" accept="image/*" style="display:none" onchange="carregarPlanta(this)">
            <button class="btn-cad" onclick="document.getElementById('uploadPlanta').click()">🗺️</button>
            <button class="btn-cad" onclick="carregarExemploReal()">📑</button>
            <div class="divisor"></div>
            <button class="btn-cad text-btn btn-play" id="btnSim" onclick="ativarSimulacao()">► SIMULAR</button>
            <button class="btn-cad text-btn btn-stop" id="btnStop" onclick="pararSimulacao()" disabled>■ PARAR</button>
        </div>
        <div style="font-weight: 800; color: #005fb8;">CADe SIMU Web Studio v4.6 (Visual Aprimorado)</div>
    </div>

    <div class="cat-toolbar" id="catBar"></div>
    <div class="sub-toolbar" id="subBar"></div>

    <div class="viewport-container" id="viewport">
        <div class="folha-a3" id="folha"><div id="stage-parent"></div></div>
        <div class="prop-modal-quick" id="quickProp">
            <input type="text" id="inpQuickTag" onkeyup="aplicarTagQuick(this.value)">
            <button class="btn-modal-acao" onclick="girarSelecionadoQuick()">⟳ Girar</button>
            <button class="btn-modal-acao" onclick="removerSelecionadoQuick()" style="background:#dc2626;">🗑️ Excluir</button>
        </div>
    </div>

<script>
    const subPaletas = {
        UNIFILAR: [
            { nome: 'Luz Teto', icone: '💡', acao: () => spawnComp('UNI_LUZ_TETO') },
            { nome: 'Tomada', icone: '⏏️', acao: () => spawnComp('UNI_TOMADA_BAIXA') }
        ],
        ALIM: [{nome:'3~', acao:()=>spawnComp('ALIM_TRI')}], 
        PROT: [{nome:'Disj. Motor', acao:()=>spawnComp('PROT_DISJ_MOTOR')}],
        POTENCIA: [{nome:'Contator', acao:()=>spawnComp('POT_CONTATOR3')}],
        MOTORES: [{nome:'Motor', acao:()=>spawnComp('MOTOR_TRI')}],
        BOBINAS: [{nome:'Bobina', acao:()=>spawnComp('BOBINA_K')}]
    };

    // --- SETUP KONVA ---
    const stage = new Konva.Stage({ container: 'stage-parent', width: 1050, height: 740 });
    const bgLayer = new Konva.Layer();    // Camada de Planta
    const gradeLayer = new Konva.Layer();
    const fioLayer = new Konva.Layer();
    const compLayer = new Konva.Layer();
    stage.add(bgLayer, gradeLayer, fioLayer, compLayer);

    // --- FUNÇÕES DE PLANTA ---
    function carregarPlanta(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function (e) {
                const img = new Image();
                img.onload = function() {
                    const konvaImg = new Konva.Image({ x: 0, y: 0, image: img, width: 1050, height: 740, opacity: 0.5 });
                    bgLayer.destroyChildren();
                    bgLayer.add(konvaImg);
                    bgLayer.draw();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // --- MEGA IMPLANTAÇÃO DE SÍMBOLOS ---
    function spawnComp(tipo) {
        const g = new Konva.Group({ x: 500, y: 300, draggable: true, name: 'GRUPO_COMP', tipoComp: tipo, tag: 'ID-' + Math.floor(Math.random()*100) });
        
        // Novos Símbolos Arquitetônicos
        if(tipo === 'UNI_LUZ_TETO') {
            g.add(new Konva.Circle({radius:12, stroke:'#000', strokeWidth:2}));
            g.add(new Konva.Line({points:[-12,-12, 12,12], stroke:'#000', strokeWidth:2}));
        }
        else if(tipo === 'UNI_TOMADA_BAIXA') {
            g.add(new Konva.RegularPolygon({sides:3, radius:10, stroke:'#000', strokeWidth:2}));
        }
        // Símbolos existentes
        else if(tipo === 'ALIM_TRI') {
            g.add(new Konva.Rect({x:-25, y:-10, width:50, height:20, stroke:'#333', strokeWidth:1, fill:'#f0f0f0'}));
            [-15, 0, 15].forEach(px => {
                g.add(new Konva.Circle({x:px, y:-10, radius:3, fill:'#000'}));
                g.add(new Konva.Line({points:[px,-10, px,15], stroke:'#000', strokeWidth:2}));
            });
        }
        else if(tipo === 'PROT_DISJ_MOTOR') {
            g.add(new Konva.Rect({x:-20, y:-30, width:40, height:60, stroke:'#222', strokeWidth:2, fill:'#fff'}));
            g.add(new Konva.Arc({x:0, y:-10, innerRadius:5, outerRadius:7, angle:180, rotation:0, stroke:'#222', strokeWidth:2}));
        }
        else if(tipo === 'POT_CONTATOR3') {
            g.add(new Konva.Rect({x:-25, y:-30, width:50, height:60, stroke:'#222', strokeWidth:2, fill:'#e9e9e9'}));
            [-15, 0, 15].forEach(px => {
                g.add(new Konva.Line({points:[px,-20, px,20], stroke:'#000', strokeWidth:2}));
                g.add(new Konva.Circle({x:px, y:-25, radius:3, fill:'#000'}));
                g.add(new Konva.Circle({x:px, y:25, radius:3, fill:'#000'}));
            });
        }
        else if(tipo === 'MOTOR_TRI') {
            g.add(new Konva.Circle({radius:30, stroke:'#222', strokeWidth:2, fill:'#d1d1d1', name:'CORPO_MOTOR'}));
            g.add(new Konva.Text({text:'M\n3~', x:-7, y:-12, fontSize:14, fontWeight:'bold'}));
        }
        else if(tipo === 'BOBINA_K') {
            g.add(new Konva.Rect({x:-20, y:-20, width:40, height:40, stroke:'#005fb8', strokeWidth:2, fill:'#fff', name:'CORPO_BOBINA'}));
        }

        g.add(new Konva.Text({text: g.getAttr('tag'), x:-30, y:-55, width:60, align:'center', fill:'#005fb8', fontSize:10, name:'LABEL_TAG'}));
        g.on('click', (e) => { e.cancelBubble = true; abrirPropQuick(g); });
        compLayer.add(g); compLayer.draw();
    }

    // [MANUTENÇÃO DAS FUNÇÕES ORIGINAIS]
    function renderBar() {
        const catBar = document.getElementById('catBar');
        Object.keys(subPaletas).forEach(cat => {
            const b = document.createElement('button');
            b.className = 'cat-btn';
            b.innerText = cat;
            b.onclick = () => {
                document.querySelectorAll('.cat-btn').forEach(x=>x.classList.remove('active'));
                b.classList.add('active');
                renderSub(cat);
            };
            catBar.appendChild(b);
        });
    }
    function renderSub(cat) {
        const sub = document.getElementById('subBar');
        sub.innerHTML = '';
        subPaletas[cat].forEach(i => {
            const b = document.createElement('button');
            b.className = 'comp-spawn-btn';
            b.innerHTML = i.icone + ' ' + i.nome;
            b.onclick = i.acao;
            sub.appendChild(b);
        });
    }
    function abrirPropQuick(g) { itemEditando = g; document.getElementById('quickProp').style.display = 'flex'; }
    function fecharPropQuick() { document.getElementById('quickProp').style.display = 'none'; }
    function aplicarTagQuick(v) { if(itemEditando) { itemEditando.setAttr('tag', v); itemEditando.findOne('.LABEL_TAG').text(v); compLayer.draw(); } }
    function removerSelecionadoQuick() { if(itemEditando) { itemEditando.destroy(); fecharPropQuick(); compLayer.draw(); } }
    function girarSelecionadoQuick() { if(itemEditando) { itemEditando.rotate(90); compLayer.draw(); } }
    function limparFolha() { compLayer.destroyChildren(); bgLayer.destroyChildren(); compLayer.draw(); bgLayer.draw(); fioLayer.destroyChildren(); fioLayer.draw(); }
    function ativarSimulacao() { alert('Simulação iniciada'); }
    function pararSimulacao() { alert('Simulação parada'); }
    function carregarExemploReal() { /* Mantido */ }
    
    renderBar();
</script>
</body>
</html>
