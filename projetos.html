<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltCalc Pro - Editor de Projetos</title>
    <script src="https://unpkg.com/konva@9.3.1/konva.min.js"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; overflow: hidden; 
            background: #1a1b2f; font-family: 'Segoe UI', Tahoma, sans-serif; 
        }
        
        .cad-container { display: flex; height: 100vh; }
        
        /* BARRA LATERAL ESQUERDA - FERRAMENTAS */
        .toolbar { 
            width: 220px; background: #111827; padding: 20px; 
            border-right: 1px solid #1f4068; color: #fff; z-index: 10;
        }
        .toolbar h3 { color: #39FF14; margin-bottom: 20px; text-transform: uppercase; font-size: 14px;}
        .toolbar button { 
            width: 100%; padding: 12px; margin-bottom: 10px; 
            background: #162447; border: 1px solid #1f4068; color: #fff; 
            cursor: pointer; border-radius: 5px; font-weight: bold; transition: 0.3s;
        }
        .toolbar button:hover { background: #39FF14; color: #000; }
        
        /* ÁREA DE DESENHO */
        #container-canvas { flex: 1; background: #ffffff; position: relative; }
        
        /* BARRA LATERAL DIREITA - CÁLCULOS */
        .sidebar-calculo { 
            width: 300px; background: #111827; padding: 20px; 
            border-left: 1px solid #1f4068; color: #fff; z-index: 10;
            display: flex; flex-direction: column;
        }
        .sidebar-calculo h3 { color: #e43f5a; text-transform: uppercase; font-size: 14px; margin-bottom: 20px; }
        #resultado-calculo p { color: #9ba4b5; font-size: 14px; margin-bottom: 5px; }
        #resultado-calculo strong { color: #fff; }
        .linha-divisoria { border: 0; border-top: 1px solid #1f4068; margin: 15px 0; }
    </style>
</head>
<body>

<div class="cad-container">
    <div class="toolbar">
        <h3>Componentes NBR 5410</h3>
        <button onclick="adicionarElemento('tomada')">➕ Tomada</button>
        <button onclick="adicionarElemento('lampada')">💡 Lâmpada</button>
        <button onclick="adicionarElemento('disjuntor')">⚡ Disjuntor</button>
    </div>
    
    <div id="container-canvas"></div>
    
    <div class="sidebar-calculo">
        <h3>Dimensionamento</h3>
        <div id="resultado-calculo">
            <p>Selecione um componente no projeto para inspecionar os dados...</p>
        </div>
    </div>
</div>

<script>
    // 1. INICIALIZAÇÃO DO MOTOR GRÁFICO (CANVAS)
    const container = document.getElementById('container-canvas');
    const width = container.offsetWidth;
    const height = window.innerHeight;
    
    const stage = new Konva.Stage({ container: 'container-canvas', width: width, height: height });
    const layer = new Konva.Layer();
    stage.add(layer);

    // 2. VARIÁVEIS DE CONTROLE E ESCALA
    let selected = null; 
    const ESCALA_PIXELS_POR_METRO = 50; // Define que 50 pixels = 1 metro na vida real

    // Utilitário: Pega o centro exato do componente
    function getCenter(node) {
        if (node.getClassName() === 'Circle') {
            return { x: node.x(), y: node.y() };
        }
        return { x: node.x() + node.width() / 2, y: node.y() + node.height() / 2 };
    }

    // Utilitário: Fórmula matemática de distância entre dois pontos
    function calcularDistanciaPixels(x1, y1, x2, y2) {
        return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
    }

    // Função de Inteligência: Calcula o total de cabos do projeto inteiro
    function gerarResumoProjeto() {
        let pixelsTotal = 0;
        let qtdComponentes = layer.children.length - layer.find('Line').length;
        
        const linhas = layer.find('Line');
        linhas.forEach(line => {
            const p = line.points();
            pixelsTotal += calcularDistanciaPixels(p[0], p[1], p[2], p[3]);
        });

        const metrosTotal = (pixelsTotal / ESCALA_PIXELS_POR_METRO).toFixed(2);
        
        return `
            <hr class="linha-divisoria">
            <p><strong>Resumo Global:</strong></p>
            <p>Peças no projeto: <span style="color:#39FF14">${qtdComponentes}</span></p>
            <p>Eletroduto/Fiação: <span style="color:#e43f5a">${metrosTotal} m</span></p>
            <button style="background: #39FF14; color: #000; border: none; padding: 10px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 15px;">Calcular Preço Total (R$)</button>
        `;
    }

    // Atualiza o painel apenas com o resumo quando clica no fundo
    function atualizarPainelVazio() {
        document.getElementById('resultado-calculo').innerHTML = `
            <p>Projeto em andamento...</p>
            ${gerarResumoProjeto()}
        `;
    }

    // 3. FUNÇÃO PRINCIPAL: ADICIONAR E CONECTAR COMPONENTES
    function adicionarElemento(tipo) {
        let shape;
        
        let startX = 50 + Math.random() * 50; 
        let startY = 50 + Math.random() * 50;
        
        if (tipo === 'tomada') {
            shape = new Konva.Rect({ x: startX, y: startY, width: 40, height: 40, fill: '#3498db', draggable: true, stroke: 'black', strokeWidth: 1 });
        } else if (tipo === 'lampada') {
            shape = new Konva.Circle({ x: startX + 20, y: startY + 20, radius: 20, fill: '#f1c40f', draggable: true, stroke: 'black', strokeWidth: 1 });
        } else if (tipo === 'disjuntor') {
            shape = new Konva.Rect({ x: startX, y: startY, width: 60, height: 30, fill: '#e74c3c', draggable: true, stroke: 'black', strokeWidth: 1 });
        }

        shape.linesAttached = []; 

        // Dinâmica do Fio: Acompanhar o objeto ao ser arrastado
        shape.on('dragmove', () => {
            shape.linesAttached.forEach(line => {
                const points = line.points();
                const center = getCenter(shape);
                
                if (line.source === shape) {
                    points[0] = center.x; points[1] = center.y;
                } else {
                    points[2] = center.x; points[3] = center.y;
                }
                line.points(points);
            });
            // Atualiza a metragem em tempo real enquanto arrasta
            if(selected === shape) shape.fire('click'); 
        });

        // Dinâmica de Seleção e Criação de Fiação
        shape.on('click', (e) => {
            e.cancelBubble = true; 
            
            if (!selected) {
                selected = shape;
                shape.stroke('#39FF14'); 
                shape.strokeWidth(3);
            } else if (selected !== shape) {
                const center1 = getCenter(selected);
                const center2 = getCenter(shape);

                const line = new Konva.Line({
                    points: [center1.x, center1.y, center2.x, center2.y],
                    stroke: '#2c3e50', strokeWidth: 3, dash: [10, 5], tension: 0
                });
                
                line.source = selected;
                line.target = shape;
                selected.linesAttached.push(line);
                shape.linesAttached.push(line);
                
                layer.add(line);
                line.moveToBottom(); 
                
                selected.stroke('black');
                selected.strokeWidth(1);
                selected = null;
            }
            layer.draw();

            // Preservado: Atualiza Painel de Dimensionamento do item + Resumo
            document.getElementById('resultado-calculo').innerHTML = `
                <p><strong>Circuito:</strong> ${tipo.toUpperCase()}</p>
                <p><strong>Carga Unitária:</strong> 100W</p>
                <p><strong>Tensão:</strong> 220V</p>
                <button style="background: #e43f5a; color: #fff; border: none; padding: 8px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px;">Dimensionar Bitola</button>
                ${gerarResumoProjeto()}
            `;
        });

        layer.add(shape);
        layer.draw();
        atualizarPainelVazio();
    }
    
    // 4. CANCELAR SELEÇÃO (Clicar no fundo branco)
    stage.on('click', (e) => {
        if (e.target === stage) {
            if (selected) {
                selected.stroke('black');
                selected.strokeWidth(1);
                selected = null;
                layer.draw();
            }
            atualizarPainelVazio();
        }
    });

    // Responsividade da tela
    window.addEventListener('resize', () => {
        stage.width(container.offsetWidth);
        stage.height(window.innerHeight);
    });
</script>

</body>
</html>
