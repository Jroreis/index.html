<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QDC Pro Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .svg-text { font-family: monospace; font-size: 10px; font-weight: bold; }
        .svg-title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #1f2937; }
        
        /* Ocultar elementos da interface na hora da impressão para gerar um PDF perfeito */
        @media print {
            body { background-color: white; margin: 0; padding: 0; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            #diagram-container { width: 100%; max-width: 100%; box-shadow: none; border: none; }
            /* Forçar orientação paisagem e quebra de página entre os desenhos */
            @page { size: A4 landscape; margin: 10mm; }
            .page-break { page-break-before: always; }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="app-container" class="max-w-7xl mx-auto space-y-6">
        <!-- CABEÇALHO DO APLICATIVO (Oculto na impressão) -->
        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200 no-print">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">QDC Pro Generator</h1>
                    <p class="text-sm text-gray-500">Gerador de Esquema Físico e Unifilar - NBR 5410</p>
                </div>
                <button onclick="window.print()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded flex items-center transition">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    Exportar / Salvar PDF
                </button>
            </div>

            <!-- CONTROLES E CONFIGURAÇÕES -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                <div class="col-span-1 md:col-span-2">
                    <label class="block text-xs font-bold text-gray-700 mb-1">Responsável / Engenheiro</label>
                    <input type="text" id="inp-responsavel" class="w-full border rounded p-2 text-sm" placeholder="Nome do Profissional" onchange="updateData()">
                </div>
                <div class="col-span-1 md:col-span-2">
                    <label class="block text-xs font-bold text-gray-700 mb-1">Obra / Cliente</label>
                    <input type="text" id="inp-obra" class="w-full border rounded p-2 text-sm" placeholder="Nome do Cliente ou Obra" onchange="updateData()">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-5 gap-4 bg-gray-50 p-4 rounded border">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Sistema Elétrico</label>
                    <select id="inp-sistema" class="w-full border rounded p-2 text-sm" onchange="updateData()">
                        <option value="monofasico">Monofásico (1F + N + T)</option>
                        <option value="bifasico">Bifásico (2F + N + T)</option>
                        <option value="trifasico">Trifásico (3F + N + T)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Aterramento</label>
                    <select id="inp-aterramento" class="w-full border rounded p-2 text-sm" onchange="updateData()">
                        <option value="TNS">TN-S (Separados)</option>
                        <option value="TNCS">TN-C-S (Jumper N-PE)</option>
                        <option value="TNC">TN-C (Comum)</option>
                        <option value="TT">TT (Independente)</option>
                        <option value="IT">IT (Isolado)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Disjuntor Geral</label>
                    <select id="inp-geral" class="w-full border rounded p-2 text-sm" onchange="updateData()">
                        <option value="32A">32A</option>
                        <option value="40A">40A</option>
                        <option value="50A">50A</option>
                        <option value="63A" selected>63A</option>
                        <option value="80A">80A</option>
                        <option value="100A">100A</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Qtd. Trilhos (Linhas)</label>
                    <select id="inp-trilhos" class="w-full border rounded p-2 text-sm" onchange="updateData()">
                        <option value="1">1 Trilho</option>
                        <option value="2" selected>2 Trilhos</option>
                        <option value="3">3 Trilhos</option>
                        <option value="4">4 Trilhos</option>
                        <option value="5">5 Trilhos</option>
                        <option value="6">6 Trilhos</option>
                        <option value="7">7 Trilhos</option>
                        <option value="8">8 Trilhos</option>
                        <option value="9">9 Trilhos</option>
                        <option value="10">10 Trilhos</option>
                    </select>
                </div>
                <div class="flex flex-col justify-center gap-2">
                    <label class="flex items-center text-sm font-bold text-gray-700 cursor-pointer">
                        <input type="checkbox" id="inp-dps" checked class="mr-2" onchange="updateData()">
                        Incluir DPS (Fases + Neutro)
                    </label>
                    <label class="flex items-center text-sm font-bold text-gray-700 cursor-pointer">
                        <input type="checkbox" id="inp-dr" checked class="mr-2" onchange="updateData()">
                        Incluir DR (Geral)
                    </label>
                </div>
            </div>

            <!-- GESTÃO DE CIRCUITOS -->
            <div class="mt-6">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-sm font-bold text-gray-800">Circuitos de Distribuição</h2>
                    <button onclick="addCircuit()" class="text-xs bg-blue-100 text-blue-700 font-bold py-1 px-3 rounded hover:bg-blue-200">
                        + Adicionar Circuito
                    </button>
                </div>
                <div id="circuits-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">
                    <!-- Circuitos injetados via JS -->
                </div>
            </div>
        </div>

        <!-- ÁREA DE DESENHO (Visível na impressão) -->
        <div id="diagram-container" class="bg-white rounded-lg shadow border overflow-hidden">
            <!-- Página 1: Desenho Físico -->
            <div class="p-6">
                <div class="text-center mb-4">
                    <h2 class="text-xl font-bold uppercase" id="titulo-fisico">QUADRO DE DISTRIBUIÇÃO</h2>
                    <p class="text-xs text-gray-500 uppercase" id="subtitulo-fisico">Esquema Físico de Ligação / BEP Profissional</p>
                </div>
                <div class="overflow-auto w-full flex justify-center bg-slate-50 border border-slate-200" id="svg-fisico-wrapper">
                    <!-- SVG Físico Injetado aqui -->
                </div>
            </div>
            
            <!-- Quebra de página para PDF -->
            <div class="page-break"></div>

            <!-- Página 2: Diagrama Unifilar -->
            <div class="p-6 border-t print-only" style="border-top-width: 2px;">
                <div class="text-center mb-4">
                    <h2 class="text-xl font-bold uppercase" id="titulo-unifilar">DIAGRAMA UNIFILAR</h2>
                    <p class="text-xs text-gray-500 uppercase" id="subtitulo-unifilar">Simbologia NBR 5410</p>
                </div>
                <div class="overflow-auto w-full flex justify-center bg-white" id="svg-unifilar-wrapper">
                    <!-- SVG Unifilar Injetado aqui -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // ESTADO GLOBAL DA APLICAÇÃO
        let state = {
            responsavel: '',
            obra: '',
            sistema: 'monofasico',
            aterramento: 'TNS',
            geral: '63A',
            trilhos: 2,
            hasDPS: true,
            hasDR: true,
            circuitos: [] // Inicia vazio conforme regra
        };

        // CONSTANTES DIMENSIONAIS E CORES
        const C = {
            w: 1200,
            faseCor: ['#ef4444', '#000000', '#78716c'], // Vermelho, Preto, Cinza
            neutroCor: '#3b82f6', // Azul
            terraCor: '#22c55e', // Verde
            bepCor: '#b45309' // Cobre
        };

        // INICIALIZAÇÃO
        function init() {
            renderCircuitsUI();
            updateDraw();
        }

        // ATUALIZAR ESTADO COM BASE NOS INPUTS
        function updateData() {
            state.responsavel = document.getElementById('inp-responsavel').value || 'Não Informado';
            state.obra = document.getElementById('inp-obra').value || 'Não Informado';
            
            let oldSistema = state.sistema;
            state.sistema = document.getElementById('inp-sistema').value;
            state.aterramento = document.getElementById('inp-aterramento').value;
            state.geral = document.getElementById('inp-geral').value;
            state.trilhos = parseInt(document.getElementById('inp-trilhos').value);
            state.hasDPS = document.getElementById('inp-dps').checked;
            state.hasDR = document.getElementById('inp-dr').checked;

            // Ajuste automático de polos caso diminua o sistema principal
            let maxPolos = state.sistema === 'monofasico' ? 1 : (state.sistema === 'bifasico' ? 2 : 3);
            if (oldSistema !== state.sistema) {
                state.circuitos.forEach(c => {
                    if (c.polos > maxPolos) c.polos = maxPolos;
                });
                renderCircuitsUI();
            }
            
            updateDraw();
        }

        // ADICIONAR CIRCUITO
        function addCircuit() {
            let maxPolos = state.sistema === 'monofasico' ? 1 : (state.sistema === 'bifasico' ? 2 : 3);
            state.circuitos.push({
                id: Date.now(),
                nome: `Circuito ${state.circuitos.length + 1}`,
                polos: maxPolos === 1 ? 1 : 2, // Padrão inteligente
                amp: '20A',
                cabo: '2.5'
            });
            renderCircuitsUI();
            updateDraw();
        }

        function removeCircuit(id) {
            state.circuitos = state.circuitos.filter(c => c.id !== id);
            renderCircuitsUI();
            updateDraw();
        }

        function updateCircuitProp(id, prop, val) {
            let c = state.circuitos.find(c => c.id === id);
            if (c) c[prop] = val;
            updateDraw();
        }

        // RENDERIZAR MENU DE CIRCUITOS
        function renderCircuitsUI() {
            const container = document.getElementById('circuits-container');
            container.innerHTML = '';
            
            let maxPolos = state.sistema === 'monofasico' ? 1 : (state.sistema === 'bifasico' ? 2 : 3);

            state.circuitos.forEach(c => {
                let div = document.createElement('div');
                div.className = 'bg-white p-3 rounded border border-gray-200 text-sm';
                
                let polosOptions = `<option value="1" ${c.polos==1?'selected':''}>1 Polo (F+N+T)</option>`;
                if (maxPolos >= 2) polosOptions += `<option value="2" ${c.polos==2?'selected':''}>2 Polos (F+F+T)</option>`;
                if (maxPolos >= 3) polosOptions += `<option value="3" ${c.polos==3?'selected':''}>3 Polos (F+F+F+T)</option>`;

                div.innerHTML = `
                    <div class="flex justify-between mb-2">
                        <input type="text" class="border-b outline-none font-bold w-full mr-2" value="${c.nome}" onchange="updateCircuitProp(${c.id}, 'nome', this.value)">
                        <button onclick="removeCircuit(${c.id})" class="text-red-500 hover:text-red-700 font-bold">X</button>
                    </div>
                    <div class="grid grid-cols-3 gap-1">
                        <div>
                            <span class="text-[10px] text-gray-500">Polos</span>
                            <select class="w-full border p-1 rounded text-xs" onchange="updateCircuitProp(${c.id}, 'polos', parseInt(this.value))">
                                ${polosOptions}
                            </select>
                        </div>
                        <div>
                            <span class="text-[10px] text-gray-500">Disjuntor</span>
                            <select class="w-full border p-1 rounded text-xs" onchange="updateCircuitProp(${c.id}, 'amp', this.value)">
                                <option value="10A" ${c.amp==='10A'?'selected':''}>10A</option>
                                <option value="16A" ${c.amp==='16A'?'selected':''}>16A</option>
                                <option value="20A" ${c.amp==='20A'?'selected':''}>20A</option>
                                <option value="25A" ${c.amp==='25A'?'selected':''}>25A</option>
                                <option value="32A" ${c.amp==='32A'?'selected':''}>32A</option>
                                <option value="40A" ${c.amp==='40A'?'selected':''}>40A</option>
                            </select>
                        </div>
                        <div>
                            <span class="text-[10px] text-gray-500">Cabo (mm²)</span>
                            <select class="w-full border p-1 rounded text-xs" onchange="updateCircuitProp(${c.id}, 'cabo', this.value)">
                                <option value="1.5" ${c.cabo==='1.5'?'selected':''}>1.5</option>
                                <option value="2.5" ${c.cabo==='2.5'?'selected':''}>2.5</option>
                                <option value="4.0" ${c.cabo==='4.0'?'selected':''}>4.0</option>
                                <option value="6.0" ${c.cabo==='6.0'?'selected':''}>6.0</option>
                            </select>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // MOTOR PRINCIPAL DE DESENHO
        function updateDraw() {
            // Textos de Cabeçalho
            let txtSis = state.sistema.toUpperCase();
            document.getElementById('titulo-fisico').innerText = `QDC FÍSICO - SISTEMA ${txtSis}`;
            document.getElementById('titulo-unifilar').innerText = `DIAGRAMA UNIFILAR - SISTEMA ${txtSis}`;
            
            // Variáveis de Sistema
            let numFases = state.sistema === 'monofasico' ? 1 : (state.sistema === 'bifasico' ? 2 : 3);
            let hasMainNeutral = true; // Padrão NBR sempre prevê neutro na entrada para os circuitos 127V/220V dependendo da região
            
            // Altura dinâmica baseada no número de trilhos
            let rowHeight = 150;
            let canvasH = 400 + (state.trilhos * rowHeight);
            
            // SVG BUILDER
            let svgF = `<svg width="100%" height="100%" viewBox="0 0 ${C.w} ${canvasH}" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:sans-serif;">`;
            
            // Caixa do Quadro (Background)
            svgF += `<rect x="20" y="20" width="${C.w - 40}" height="${canvasH - 40}" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="10"/>`;
            svgF += `<text x="40" y="45" font-size="12" fill="#64748b" font-weight="bold">RESPONSÁVEL: ${state.responsavel} | OBRA: ${state.obra} | ATERRAMENTO: ${state.aterramento}</text>`;

            // 1. BEP (Barramento de Equipotencialização) - Topo Direita
            const bepX = 1000;
            const bepY = 60;
            svgF += `<rect x="${bepX}" y="${bepY}" width="100" height="20" fill="${C.bepCor}" stroke="#78350f" stroke-width="2" rx="3"/>`;
            svgF += `<text x="${bepX+50}" y="${bepY+14}" text-anchor="middle" font-size="10" font-weight="bold" fill="white">BEP</text>`;

            // 2. Barramentos Verticais (Neutro Esquerda, Terra Direita)
            const nBusX = 80;
            const peBusX = 1120;
            const busStartY = 350;
            const busEndY = canvasH - 50;
            // Desenhar N
            svgF += `<rect x="${nBusX-5}" y="${busStartY}" width="10" height="${busEndY-busStartY}" fill="none" stroke="${C.neutroCor}" stroke-width="2" rx="5"/>`;
            svgF += `<text x="${nBusX}" y="${busStartY-10}" text-anchor="middle" fill="${C.neutroCor}" font-size="12" font-weight="bold">NEUTRO</text>`;
            // Desenhar PE
            svgF += `<rect x="${peBusX-5}" y="${busStartY}" width="10" height="${busEndY-busStartY}" fill="none" stroke="${C.terraCor}" stroke-width="2" rx="5"/>`;
            svgF += `<text x="${peBusX}" y="${busStartY-10}" text-anchor="middle" fill="${C.terraCor}" font-size="12" font-weight="bold">TERRA</text>`;
            // Furinhos dos barramentos
            for(let py = busStartY+20; py < busEndY-10; py+=20) {
                svgF += `<circle cx="${nBusX}" cy="${py}" r="2" fill="${C.neutroCor}"/>`;
                svgF += `<circle cx="${peBusX}" cy="${py}" r="2" fill="${C.terraCor}"/>`;
            }

            // 3. ENTRADA DE ENERGIA E ROTEAMENTO PARA BEP
            const entX = 400; // Centro entrada fases
            // Terra entrando e indo pro BEP
            svgF += `<path d="M ${entX+100} 30 L ${entX+100} 50 L ${bepX+50} 50 L ${bepX+50} ${bepY}" fill="none" stroke="${C.terraCor}" stroke-width="3"/>`;
            svgF += `<text x="${entX+105}" y="40" fill="${C.terraCor}" font-size="10" font-weight="bold">PE</text>`;
            // Neutro entrando
            const nEntX = entX - 100;
            svgF += `<text x="${nEntX+5}" y="40" fill="${C.neutroCor}" font-size="10" font-weight="bold">N</text>`;
            
            // Lógica de Equipotencialização (Jumper TN-C / TN-C-S)
            if (state.aterramento === 'TNC' || state.aterramento === 'TNCS') {
                // Jumper limpo cruzando por cima (Y=70)
                svgF += `<path d="M ${nEntX} 30 L ${nEntX} 70 L ${bepX+10} 70 L ${bepX+10} ${bepY}" fill="none" stroke="${C.neutroCor}" stroke-width="3"/>`;
                svgF += `<text x="${(nEntX+bepX)/2}" y="65" fill="${C.neutroCor}" font-size="10" font-weight="bold">Jumper Equipotencialização (N-PE)</text>`;
            } else {
                // Apenas desce (TT, TN-S)
                svgF += `<path d="M ${nEntX} 30 L ${nEntX} 70" fill="none" stroke="${C.neutroCor}" stroke-width="3"/>`;
            }
            
            // Ligação do BEP para o Barramento PE
            svgF += `<path d="M ${bepX+90} ${bepY+20} L ${bepX+90} 90 L ${peBusX} 90 L ${peBusX} ${busStartY}" fill="none" stroke="${C.terraCor}" stroke-width="3"/>`;

            // 4. POSIÇÕES DOS COMPONENTES PRINCIPAIS
            const mainY = 150;
            const geralX = 350;
            const dpsX = 520;
            const drX = 700;

            // Função helper para desenhar disjuntores/módulos
            const drawModule = (x, y, polos, label, color='#334155', isDR=false) => {
                let w = polos * 30;
                let h = 60;
                let svg = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="white" stroke="${color}" stroke-width="2" rx="4"/>`;
                svg += `<text x="${x+(w/2)}" y="${y-5}" text-anchor="middle" font-size="10" font-weight="bold" fill="${color}">${label}</text>`;
                if(isDR) svg += `<rect x="${x}" y="${y+10}" width="${w}" height="15" fill="#3b82f6"/>`; // Tarja azul DR
                else svg += `<rect x="${x+2}" y="${y+25}" width="${w-4}" height="10" fill="${color === '#ef4444' ? '#fee2e2' : '#f1f5f9'}"/>`;
                for(let i=0; i<polos; i++) {
                    let px = x + 15 + (i*30);
                    svg += `<circle cx="${px}" cy="${y+5}" r="3" fill="#94a3b8"/><circle cx="${px}" cy="${y+h-5}" r="3" fill="#94a3b8"/>`;
                    if(!isDR && color !== '#ef4444') svg += `<rect x="${px-4}" y="${y+15}" width="8" height="30" fill="${color}" rx="2"/>`; // Alavanca
                }
                return svg;
            };

            // DESENHANDO COMPONENTES
            svgF += drawModule(geralX, mainY, numFases, `GERAL ${state.geral}`);
            
            // Cálculo DPS (Regra 1: DPS no Neutro se existir)
            let dpsPolos = state.hasDPS ? numFases + (hasMainNeutral ? 1 : 0) : 0;
            if (state.hasDPS) svgF += drawModule(dpsX, mainY, dpsPolos, `DPS (275V/45kA)`, '#ef4444');
            
            // Cálculo DR
            let drPolos = numFases + (hasMainNeutral ? 1 : 0);
            if (state.hasDR) svgF += drawModule(drX, mainY, drPolos, `IDR GERAL`, '#1e40af', true);

            // 5. ROTEAMENTO: ENTRADA -> GERAL -> DPS -> DR
            // Fases da Rua -> Geral Topo
            for(let i=0; i<numFases; i++) {
                let px = geralX + 15 + (i*30);
                svgF += `<path d="M ${px} 30 L ${px} ${mainY}" fill="none" stroke="${C.faseCor[i]}" stroke-width="2"/>`;
                svgF += `<text x="${px+5}" y="40" fill="${C.faseCor[i]}" font-size="10" font-weight="bold">F${i+1}</text>`;
            }

            // Fases saindo do Geral -> DPS e DR (Por cima, criando canaleta Y=130)
            const gapY = 130;
            for(let i=0; i<numFases; i++) {
                let gOutX = geralX + 15 + (i*30); // Saída Geral (Baixo)
                let dpsInX = dpsX + 15 + (i*30);  // Entrada DPS Fases (Cima)
                let drInX = drX + 15 + (i*30);    // Entrada DR Fases (Cima)
                let dropY = mainY + 60 + 10 + (i*5); // Desce escalonado
                
                // Caminho: Sai do geral, desce, vai pro vão, sobe, alimenta DPS e DR por cima
                if (state.hasDPS && state.hasDR) {
                    svgF += `<path d="M ${gOutX} ${mainY+60} L ${gOutX} ${dropY} L 500 ${dropY} L 500 ${gapY-(i*4)} L ${drInX} ${gapY-(i*4)} L ${drInX} ${mainY}" fill="none" stroke="${C.faseCor[i]}" stroke-width="2"/>`;
                    // Derivação pro DPS
                    svgF += `<path d="M ${dpsInX} ${gapY-(i*4)} L ${dpsInX} ${mainY}" fill="none" stroke="${C.faseCor[i]}" stroke-width="2"/>`;
                    svgF += `<circle cx="${dpsInX}" cy="${gapY-(i*4)}" r="2" fill="${C.faseCor[i]}"/>`; // Nó
                } else if (state.hasDR) {
                    // Direto DR
                    svgF += `<path d="M ${gOutX} ${mainY+60} L ${gOutX} ${dropY} L 500 ${dropY} L 500 ${gapY-(i*4)} L ${drInX} ${gapY-(i*4)} L ${drInX} ${mainY}" fill="none" stroke="${C.faseCor[i]}" stroke-width="2"/>`;
                }
            }

            // Roteamento do Neutro
            let nLineY = 70; // Veio de cima
            if (hasMainNeutral) {
                let drNInX = drX + 15 + (numFases*30); // Último borne do DR
                // Neutro vai pro topo do DR
                svgF += `<path d="M ${nEntX} ${nLineY} L ${nEntX} 110 L ${drNInX} 110 L ${drNInX} ${mainY}" fill="none" stroke="${C.neutroCor}" stroke-width="2"/>`;
                
                // Derivação do Neutro para o DPS (Regra 1 atendida perfeitamente)
                if (state.hasDPS) {
                    let dpsNInX = dpsX + 15 + (numFases*30); // Último borne DPS
                    svgF += `<path d="M ${dpsNInX} 110 L ${dpsNInX} ${mainY}" fill="none" stroke="${C.neutroCor}" stroke-width="2"/>`;
                    svgF += `<circle cx="${dpsNInX}" cy="110" r="2" fill="${C.neutroCor}"/>`; // Nó
                }
            }

            // DPS Bottom -> Aterramento (BEP)
            if (state.hasDPS) {
                let dpsBotY = mainY + 60;
                let groundBusY = 240; // Linha horizontal de terra abaixo dos principais
                // Une as saídas do DPS
                svgF += `<path d="M ${dpsX+15} ${dpsBotY} L ${dpsX+15} ${groundBusY} L ${bepX+30} ${groundBusY} L ${bepX+30} ${bepY+20}" fill="none" stroke="${C.terraCor}" stroke-width="2"/>`;
                for(let i=1; i<dpsPolos; i++) {
                    let px = dpsX + 15 + (i*30);
                    svgF += `<path d="M ${px} ${dpsBotY} L ${px} ${groundBusY}" fill="none" stroke="${C.terraCor}" stroke-width="2"/>`;
                    svgF += `<circle cx="${px}" cy="${groundBusY}" r="2" fill="${C.terraCor}"/>`;
                }
            }

            // 6. TRONCOS DE DISTRIBUIÇÃO (Descendo para os Trilhos)
            const phaseTrunkX = 250;
            let currentFasesX = state.hasDR ? (drX + 15) : (geralX + 15);
            let nOutX = state.hasDR && hasMainNeutral ? (drX + 15 + (numFases*30)) : nEntX;
            
            // Fases indo pro Tronco
            for(let i=0; i<numFases; i++) {
                let outX = currentFasesX + (i*30);
                let dropY = mainY + 60 + 20 + (i*5);
                svgF += `<path d="M ${outX} ${mainY+60} L ${outX} ${dropY} L ${phaseTrunkX+(i*8)} ${dropY} L ${phaseTrunkX+(i*8)} ${busStartY-20}" fill="none" stroke="${C.faseCor[i]}" stroke-width="2"/>`;
            }
            // Neutro indo pro Barramento N
            if(hasMainNeutral) {
                svgF += `<path d="M ${nOutX} ${mainY+60} L ${nOutX} 280 L ${nBusX} 280 L ${nBusX} ${busStartY}" fill="none" stroke="${C.neutroCor}" stroke-width="2"/>`;
            }


            // 7. DISTRIBUIÇÃO DOS CIRCUITOS NOS TRILHOS (Organização Limpa - Regra 3)
            let circuitosPorTrilho = 12; // Máximo aprox de disjuntores 1 polo por trilho
            let trilhoAtual = 0;
            let currentX = 350;
            
            for (let i = 0; i < state.circuitos.length; i++) {
                let c = state.circuitos[i];
                
                // Quebra de trilho se não couber
                if (currentX + (c.polos * 30) > 950) {
                    trilhoAtual++;
                    currentX = 350;
                    if(trilhoAtual >= state.trilhos) break; // Excedeu espaço gerado
                }

                let cY = 400 + (trilhoAtual * rowHeight);

                // Desenhar Barramento Pente (alimentação por cima)
                if (currentX === 350) {
                    // Trilho físico
                    svgF += `<rect x="300" y="${cY+20}" width="650" height="20" fill="#cbd5e1" opacity="0.5"/>`;
                    // Alimenta barramento a partir do tronco
                    for(let f=0; f<numFases; f++) {
                        svgF += `<path d="M ${phaseTrunkX+(f*8)} ${cY-15+(f*4)} L ${currentX+15+(f*30)} ${cY-15+(f*4)} L ${currentX+15+(f*30)} ${cY}" fill="none" stroke="${C.faseCor[f]}" stroke-width="2"/>`;
                        svgF += `<circle cx="${phaseTrunkX+(f*8)}" cy="${cY-15+(f*4)}" r="2" fill="${C.faseCor[f]}"/>`;
                    }
                    svgF += `<rect x="${currentX}" y="${cY-8}" width="100" height="8" fill="#b45309" rx="2"/><text x="${currentX+50}" y="${cY-12}" font-size="8" fill="#b45309" text-anchor="middle">BARRAMENTO PENTE</text>`;
                }

                // Desenha Disjuntor
                svgF += drawModule(currentX, cY, c.polos, c.amp, '#475569');
                
                // TEXTO DO CIRCUITO
                svgF += `<text x="${currentX+(c.polos*15)}" y="${cY-20}" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e293b">${c.nome} (${c.cabo}mm)</text>`;

                // === ROTEAMENTO DA CARGA (REGRA 3: Não cruzar) ===
                let botY = cY + 60; // Fundo do disjuntor
                
                // A) FASES (Saem do disjuntor e descem reto Y: 110 do disjuntor)
                for(let p=0; p<c.polos; p++) {
                    let pX = currentX + 15 + (p*30);
                    let fColor = C.faseCor[p % numFases];
                    let outY = cY + 110; 
                    svgF += `<path d="M ${pX} ${botY} L ${pX} ${outY}" fill="none" stroke="${fColor}" stroke-width="2"/>`;
                    svgF += `<text x="${pX}" y="${outY+10}" text-anchor="middle" font-size="8" font-weight="bold" fill="${fColor}">Carga</text>`;
                }

                // B) NEUTRO E TERRA (Regra 2: Neutro apenas em monofásico 1 polo)
                // Usamos caminhos laterais isolados para evitar cruzamento
                
                // TERRA: Desce pelo lado direito do disjuntor até Y: 85, corre pra direita
                let peDropX = currentX + (c.polos*30) + 5; 
                let peLineY = cY + 85 + (i % 3)*3; // Leve desnível se houver muitos
                svgF += `<path d="M ${peDropX} ${botY+25} L ${peBusX} ${botY+25}" fill="none" stroke="${C.terraCor}" stroke-width="1.5" stroke-dasharray="2,2"/>`; // Linha guia
                svgF += `<path d="M ${peDropX} ${botY+25} L ${peBusX} ${botY+25}" fill="none" stroke="${C.terraCor}" stroke-width="1.5"/>`; // Linha real conectando ao barramento

                // NEUTRO: Apenas se for 1 Polo! Corre pela esquerda até Y: 70
                if (c.polos === 1) {
                    let nDropX = currentX - 5;
                    let nLineY = cY + 70 + (i % 3)*3;
                    svgF += `<path d="M ${nDropX} ${botY+10} L ${nBusX} ${botY+10}" fill="none" stroke="${C.neutroCor}" stroke-width="1.5"/>`;
                }

                // Linhas conectando ao "tubo" virtual da carga
                svgF += `<path d="M ${currentX+15} ${botY} L ${peDropX} ${botY+25}" fill="none" stroke="${C.terraCor}" stroke-width="1.5" opacity="0"/>`; // Hack invisível pra alinhar
                
                // Desenhar as saídas de terra e neutro saindo fisicamente do agrupamento da carga
                let cxBase = currentX + 15;
                // Terra (sempre vai para a carga)
                svgF += `<path d="M ${cxBase+4} ${cY+110} L ${cxBase+4} ${botY+25} L ${peBusX} ${botY+25}" fill="none" stroke="${C.terraCor}" stroke-width="1.5"/>`;
                
                // Neutro (somente carga 1 polo)
                if(c.polos === 1){
                    svgF += `<path d="M ${cxBase-4} ${cY+110} L ${cxBase-4} ${botY+10} L ${nBusX} ${botY+10}" fill="none" stroke="${C.neutroCor}" stroke-width="1.5"/>`;
                }

                currentX += (c.polos * 30) + 15; // Espaçamento para o próximo
            }
            
            svgF += `</svg>`;
            document.getElementById('svg-fisico-wrapper').innerHTML = svgF;

            // ==========================================
            // DIAGRAMA UNIFILAR (Geração Simples e Limpa)
            // ==========================================
            let svgU = `<svg width="100%" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" style="background:white;">`;
            
            // Entrada
            svgU += `<line x1="400" y1="50" x2="400" y2="150" stroke="black" stroke-width="2"/>`;
            svgU += `<text x="410" y="100" font-size="12">Rede (${txtSis})</text>`;
            
            // Medidor / Geral
            svgU += `<rect x="380" y="150" width="40" height="60" fill="none" stroke="black" stroke-width="2"/>`;
            svgU += `<text x="430" y="180" font-size="12">Disjuntor Geral ${state.geral}</text>`;
            
            let currentY = 210;

            if (state.hasDPS) {
                svgU += `<line x1="400" y1="${currentY}" x2="400" y2="${currentY+40}" stroke="black" stroke-width="2"/>`;
                svgU += `<rect x="380" y="${currentY+40}" width="40" height="30" fill="none" stroke="red" stroke-width="2"/>`;
                svgU += `<text x="430" y="${currentY+60}" font-size="12">DPS 275V</text>`;
                svgU += `<line x1="380" y1="${currentY+55}" x2="350" y2="${currentY+55}" stroke="green" stroke-width="2"/><text x="320" y="${currentY+60}" fill="green" font-size="10">PE</text>`;
                currentY += 70;
            }

            if (state.hasDR) {
                svgU += `<line x1="400" y1="${currentY}" x2="400" y2="${currentY+40}" stroke="black" stroke-width="2"/>`;
                svgU += `<rect x="375" y="${currentY+40}" width="50" height="40" fill="none" stroke="blue" stroke-width="2"/>`;
                svgU += `<text x="435" y="${currentY+65}" font-size="12">IDR GERAL 30mA</text>`;
                currentY += 80;
            }

            // Barramento Principal
            svgU += `<line x1="400" y1="${currentY}" x2="400" y2="${currentY+30}" stroke="black" stroke-width="2"/>`;
            let busY = currentY + 30;
            svgU += `<line x1="100" y1="${busY}" x2="700" y2="${busY}" stroke="black" stroke-width="4"/>`;

            // Circuitos
            let cSpacing = 600 / (state.circuitos.length || 1);
            state.circuitos.forEach((c, idx) => {
                let cx = 100 + (idx * cSpacing) + (cSpacing/2);
                svgU += `<line x1="${cx}" y1="${busY}" x2="${cx}" y2="${busY+50}" stroke="black" stroke-width="2"/>`;
                svgU += `<rect x="${cx-10}" y="${busY+50}" width="20" height="30" fill="none" stroke="black" stroke-width="2"/>`;
                
                let tipoLabel = c.polos === 1 ? '1P' : (c.polos === 2 ? '2P' : '3P');
                let fiosSimbologia = c.polos === 1 ? 'F+N+T' : (c.polos === 2 ? 'F+F+T' : 'F+F+F+T'); // Regra 2 Unifilar
                
                svgU += `<text x="${cx+15}" y="${busY+65}" font-size="10">${c.amp} (${tipoLabel})</text>`;
                svgU += `<line x1="${cx}" y1="${busY+80}" x2="${cx}" y2="${busY+130}" stroke="black" stroke-width="2"/>`;
                svgU += `<text x="${cx}" y="${busY+145}" font-size="10" text-anchor="middle" font-weight="bold">${c.nome}</text>`;
                svgU += `<text x="${cx}" y="${busY+160}" font-size="9" text-anchor="middle" fill="#666">${c.cabo} mm² | ${fiosSimbologia}</text>`;
            });

            svgU += `</svg>`;
            document.getElementById('svg-unifilar-wrapper').innerHTML = svgU;
        }

        // INIT AO CARREGAR
        window.onload = init;
    </script>
</body>
</html>
