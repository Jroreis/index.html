<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de QDC Profissional (Mono/Bi/Tri)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .tab-btn.active {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        
        .print-area {
            background: white;
        }
        
        /* Oculta UI durante PDF se necessário, mas o html2pdf permite targetar um div específico */
    </style>
</head>
<body class="min-h-screen p-2 md:p-4 flex flex-col h-screen overflow-auto text-slate-800">

    <header class="text-center mb-4 flex-shrink-0 flex flex-col md:flex-row justify-between items-center px-4 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <div class="text-left mb-2 md:mb-0">
            <h1 class="text-2xl font-bold text-slate-800">QDC Pro Generator</h1>
            <p class="text-xs text-slate-500">Desenho Físico (Sem sobreposição) e Unifilar - Mono/Bi/Trifásico</p>
        </div>
        <button onclick="downloadPDF()" class="bg-red-600 hover:bg-red-700 text-white text-sm font-semibold py-2 px-4 rounded shadow flex items-center transition-colors">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            Exportar PDF
        </button>
    </header>

    <div class="flex flex-col gap-4 flex-1">
        
        <aside class="w-full bg-white p-4 rounded-xl shadow-sm flex-shrink-0 border border-slate-200 z-10">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Coluna 1: Configurações Iniciais -->
                <div class="flex flex-col gap-4">
                    <!-- Sistema -->
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                        <h3 class="text-xs font-bold text-slate-500 uppercase mb-2">Sistema Elétrico</h3>
                    <option value="bi">Bifásico (2F + N + T)</option>
                    <option value="tri">Trifásico (3F + N + T)</option>
                </select>
            </div>

            <!-- Geral -->
            <div>
                <h3 class="font-semibold text-slate-700 mb-2 flex items-center border-b pb-1 text-sm">Entrada e Proteção Geral</h3>
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <div>
                        <label class="block text-[11px] font-medium text-slate-500 mb-1">Disjuntor Geral</label>
                        <select id="geral-amp" class="w-full text-sm border-slate-300 rounded border p-1.5 bg-slate-50" onchange="renderApp()">
                            <option value="40">40A</option>
                            <option value="50">50A</option>
                            <option value="63" selected>63A</option>
                            <option value="80">80A</option>
                            <option value="100">100A</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-500 mb-1">Cabo Entrada</label>
                        <select id="geral-cabo" class="w-full text-sm border-slate-300 rounded border p-1.5 bg-slate-50" onchange="renderApp()">
                            <option value="6">6 mm²</option>
                            <option value="10" selected>10 mm²</option>
                            <option value="16">16 mm²</option>
                            <option value="25">25 mm²</option>
                        </select>
                    </div>
                    <div class="flex gap-4">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="has-dps" checked class="rounded text-blue-600" onchange="renderApp()">
                            <span class="text-xs font-medium text-slate-700">Incluir DPS</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="has-dr" checked class="rounded text-blue-600" onchange="renderApp()">
                            <span class="text-xs font-medium text-slate-700">Incluir DR (Geral)</span>
                        </label>
                    </div>
                </div>
                </div>

                <!-- Coluna 2: Circuitos -->
                <div class="flex flex-col max-h-[300px]">
                    <h3 class="font-semibold text-slate-700 mb-2 flex items-center border-b pb-1 text-sm">Circuitos de Distribuição</h3>
                    <div id="circuit-list" class="flex-1 overflow-y-auto space-y-2 pr-1">
                        <!-- Preenchido via JS -->
                    </div>
                    <button onclick="addCircuit()" class="mt-3 w-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold py-2 px-4 border border-slate-300 rounded shadow-sm flex items-center justify-center transition-colors shrink-0">
                        + Adicionar Circuito
                    </button>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative min-h-[600px]">
            
            <div class="flex border-b border-slate-200 bg-slate-50 px-2 py-2 gap-2 shrink-0">
                <button onclick="switchTab('fisico')" id="btn-fisico" class="tab-btn active px-4 py-1.5 rounded text-sm font-semibold text-slate-600 bg-white shadow-sm border border-slate-200 hover:bg-slate-100 transition-colors">
                    Esquema Físico (2 Fileiras)
                </button>
                <button onclick="switchTab('unifilar')" id="btn-unifilar" class="tab-btn px-4 py-1.5 rounded text-sm font-semibold text-slate-600 hover:bg-slate-100 transition-colors">
                    Diagrama Unifilar
                </button>
            </div>

            <!-- Container que será exportado para PDF -->
            <div class="flex-1 overflow-auto bg-slate-100 p-4 relative">
                <div id="export-container" class="min-w-[800px] min-h-[600px] bg-white rounded shadow border border-slate-300 flex flex-col items-center justify-center p-4 print-area mx-auto">
                    <!-- Título Interno para PDF -->
                    <div id="pdf-header" class="text-center mb-4 w-full border-b pb-2">
                        <h2 id="pdf-title" class="text-xl font-bold uppercase text-slate-800">Quadro de Distribuição</h2>
                        <p id="pdf-subtitle" class="text-sm text-slate-500">Esquema Físico</p>
                    </div>
                    
                    <div id="svg-render-area" class="w-full h-full flex items-center justify-center">
                        <!-- SVG Injetado Aqui -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Cores padrão
        const COLORS = {
            F1: '#ef4444', // Vermelho
            F2: '#1f2937', // Preto
            F3: '#78350f', // Marrom
            N:  '#3b82f6', // Azul
            PE: '#22c55e', // Verde
            BG: '#ffffff',
            STROKE: '#94a3b8'
        };

        const state = {
            sys: 'mono', // mono, bi, tri
            geral: { amp: 63, cabo: 10 },
            hasDPS: true,
            hasDR: true,
            circuitos: [
                { id: 1, nome: 'Chuveiro', poles: 1, amp: 50, cabo: '6.0' }, // Se for bi/tri, ajusta automatico
                { id: 2, nome: 'TUG Cozinha', poles: 1, amp: 20, cabo: '2.5' },
                { id: 3, nome: 'Iluminação', poles: 1, amp: 16, cabo: '1.5' }
            ],
            currentTab: 'fisico'
        };

        let nextCircuitId = 4;

        function getNumPhases() {
            if(state.sys === 'mono') return 1;
            if(state.sys === 'bi') return 2;
            return 3;
        }

        function changeSystem() {
            state.sys = document.getElementById('sys-type').value;
            const maxPoles = getNumPhases();
            
            // Ajusta os polos dos circuitos existentes se excederem o novo sistema
            state.circuitos.forEach(c => {
                if (c.poles > maxPoles) c.poles = maxPoles;
            });
            renderApp();
        }

        function addCircuit() {
            state.circuitos.push({
                id: nextCircuitId++,
                nome: `Circuito ${state.circuitos.length + 1}`,
                poles: 1,
                amp: 20,
                cabo: '2.5'
            });
            renderApp();
        }

        function removeCircuit(id) {
            state.circuitos = state.circuitos.filter(c => c.id !== id);
            renderApp();
        }

        function updateCircuit(id, field, value) {
            const c = state.circuitos.find(c => c.id === id);
            if (c) {
                c[field] = (field === 'amp' || field === 'poles') ? parseInt(value) : value;
                renderApp();
            }
        }

        function switchTab(tab) {
            state.currentTab = tab;
            document.getElementById('btn-fisico').classList.remove('active', 'bg-blue-600', 'text-white');
            document.getElementById('btn-unifilar').classList.remove('active', 'bg-blue-600', 'text-white');
            
            const activeBtn = document.getElementById(`btn-${tab}`);
            activeBtn.classList.add('active');
            activeBtn.classList.remove('text-slate-600', 'hover:bg-slate-100');
            
            renderApp();
        }

        function downloadPDF() {
            // Cria um container temporário invisível com tamanho fixo grande para evitar cortes
            const tempContainer = document.createElement('div');
            tempContainer.style.position = 'absolute';
            tempContainer.style.left = '-9999px';
            tempContainer.style.top = '0';
            tempContainer.style.width = '1200px'; 
            tempContainer.style.backgroundColor = 'white';
            tempContainer.style.padding = '20px';
            
            // Força a geração dos dois desenhos para injetar no PDF simultaneamente
            const fisicoSVG = generateFisicoSVG();
            const unifilarSVG = generateUnifilarSVG();
            const sysName = state.sys === 'mono' ? 'Monofásico' : state.sys === 'bi' ? 'Bifásico' : 'Trifásico';
            
            // Constrói o layout interno do PDF (2 páginas)
            tempContainer.innerHTML = `
                <div style="text-align: center; margin-bottom: 30px;">
                    <h2 style="font-size: 26px; font-weight: bold; font-family: sans-serif; text-transform: uppercase; color: #1e293b;">
                        Quadro de Distribuição - Sistema ${sysName}
                    </h2>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <h3 style="font-size: 18px; color: #475569; font-family: sans-serif; margin-bottom: 15px; text-align: center;">
                        Esquema Físico de Ligação
                    </h3>
                    <div style="display: flex; justify-content: center; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px;">
                        ${fisicoSVG}
                    </div>
                </div>
                
                <!-- Quebra de página CSS para forçar o Unifilar na página seguinte -->
                <div style="page-break-before: always; padding-top: 20px;">
                    <h3 style="font-size: 18px; color: #475569; font-family: sans-serif; margin-bottom: 15px; text-align: center;">
                        Diagrama Unifilar
                    </h3>
                    <div style="display: flex; justify-content: center; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px;">
                        ${unifilarSVG}
                    </div>
                </div>
            `;
            
            document.body.appendChild(tempContainer);

            const opt = {
                margin:       0.3,
                filename:     `Projeto_QDC_${sysName}.pdf`,
                image:        { type: 'jpeg', quality: 1 },
                html2canvas:  { scale: 2, useCORS: true, windowWidth: 1200 },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'landscape' },
                pagebreak:    { mode: ['css', 'legacy'] }
            };

            // Gera, salva e depois remove o container temporário
            html2pdf().set(opt).from(tempContainer).save().then(() => {
                document.body.removeChild(tempContainer);
            });
        }

        function renderFormControls() {
            state.geral.amp = parseInt(document.getElementById('geral-amp').value);
            state.geral.cabo = document.getElementById('geral-cabo').value;
            state.hasDPS = document.getElementById('has-dps').checked;
            state.hasDR = document.getElementById('has-dr').checked;

            const listContainer = document.getElementById('circuit-list');
            listContainer.innerHTML = '';
            
            const maxPoles = getNumPhases();

            state.circuitos.forEach((c, index) => {
                const div = document.createElement('div');
                div.className = 'bg-slate-50 border border-slate-200 rounded p-2 relative text-xs';
                
                let polesOptions = `<option value="1" ${c.poles===1?'selected':''}>1 Polo (1F)</option>`;
                if (maxPoles >= 2) polesOptions += `<option value="2" ${c.poles===2?'selected':''}>2 Polos (2F)</option>`;
                if (maxPoles === 3) polesOptions += `<option value="3" ${c.poles===3?'selected':''}>3 Polos (3F)</option>`;

                div.innerHTML = `
                    <button onclick="removeCircuit(${c.id})" class="absolute top-1 right-1 text-slate-400 hover:text-red-500">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                    <input type="text" value="${c.nome}" onchange="updateCircuit(${c.id}, 'nome', this.value)" class="w-full font-semibold bg-transparent border-b border-slate-300 focus:border-blue-500 outline-none p-1 mb-2 pr-5">
                    
                    <div class="grid grid-cols-3 gap-1">
                        <div>
                            <label class="block text-[9px] text-slate-500 uppercase">Fases</label>
                            <select onchange="updateCircuit(${c.id}, 'poles', this.value)" class="w-full p-1 border rounded bg-white text-xs">${polesOptions}</select>
                        </div>
                        <div>
                            <label class="block text-[9px] text-slate-500 uppercase">Disj.</label>
                            <select onchange="updateCircuit(${c.id}, 'amp', this.value)" class="w-full p-1 border rounded bg-white text-xs">
                                ${[10, 16, 20, 25, 32, 40, 50, 63].map(v => `<option value="${v}" ${c.amp === v ? 'selected' : ''}>${v}A</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-[9px] text-slate-500 uppercase">Cabo</label>
                            <select onchange="updateCircuit(${c.id}, 'cabo', this.value)" class="w-full p-1 border rounded bg-white text-xs">
                                ${['1.5', '2.5', '4.0', '6.0', '10'].map(v => `<option value="${v}" ${c.cabo === v ? 'selected' : ''}>${v}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                `;
                listContainer.appendChild(div);
            });
            
            // Update PDF Headers
            document.getElementById('pdf-title').innerText = `Quadro de Distribuição - Sistema ${state.sys === 'mono' ? 'Monofásico' : state.sys === 'bi' ? 'Bifásico' : 'Trifásico'}`;
            document.getElementById('pdf-subtitle').innerText = state.currentTab === 'fisico' ? 'Esquema Físico de Ligação' : 'Diagrama Unifilar';
        }

        // Desenha um disjuntor/DR dinamicamente baseado no número de polos
        function drawDevice(x, y, poles, type, label, subtitle) {
            const poleWidth = 35;
            const width = poleWidth * poles;
            const height = 90;
            let svg = `<g transform="translate(${x}, ${y})">`;
            
            // Sombra e Corpo principal
            svg += `<rect x="0" y="0" width="${width}" height="${height}" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="drop-shadow(0px 4px 3px rgba(0,0,0,0.1))"/>`;
            
            for(let i=0; i<poles; i++) {
                const px = i * poleWidth;
                // Terminais superior e inferior
                svg += `<rect x="${px + 5}" y="5" width="${poleWidth - 10}" height="15" rx="2" fill="#e2e8f0" />`;
                svg += `<circle cx="${px + poleWidth/2}" cy="12.5" r="3" fill="#94a3b8" />`;
                
                svg += `<rect x="${px + 5}" y="70" width="${poleWidth - 10}" height="15" rx="2" fill="#e2e8f0" />`;
                svg += `<circle cx="${px + poleWidth/2}" cy="77.5" r="3" fill="#94a3b8" />`;
                
                if (type === 'dps') {
                    // DPS indicador
                    svg += `<rect x="${px + 5}" y="30" width="${poleWidth - 10}" height="30" rx="2" fill="#fca5a5" />`;
                }
            }

            if (type === 'breaker' || type === 'dr') {
                // Alavanca unificada
                svg += `<rect x="10" y="35" width="${width - 20}" height="20" rx="2" fill="#334155" />`;
                svg += `<rect x="10" y="32" width="${width - 20}" height="10" rx="2" fill="${type==='dr' ? '#3b82f6' : '#ef4444'}" />`;
            }
            
            if (type === 'dr') {
                svg += `<circle cx="${width - 12}" cy="45" r="4" fill="#e2e8f0" stroke="#94a3b8"/>`; // Botão Teste
            }

            svg += `<text x="${width/2}" y="-8" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">${label}</text>`;
            if(subtitle) svg += `<text x="${width/2}" y="28" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">${subtitle}</text>`;
            
            svg += `</g>`;
            return svg;
        }

        function drawWire(x1, y1, x2, y2, color, thickness=3) {
            return `<path d="M ${x1} ${y1} L ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="${thickness}" stroke-linecap="round" stroke-linejoin="round"/>`;
        }
        
        function drawOrthoWire(x1, y1, x2, y2, color, thickness=3, direction='v') {
            // Desenha linha com 1 quina (L shape)
            if (direction === 'v') {
                return `<path d="M ${x1} ${y1} L ${x1} ${y2} L ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="${thickness}" stroke-linejoin="round"/>`;
            } else {
                return `<path d="M ${x1} ${y1} L ${x2} ${y1} L ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="${thickness}" stroke-linejoin="round"/>`;
            }
        }
        
        function drawZWire(x1, y1, x2, y2, midY, color, thickness=3) {
            // Desenha linha com 2 quinas (Z shape)
            return `<path d="M ${x1} ${y1} L ${x1} ${midY} L ${x2} ${midY} L ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="${thickness}" stroke-linejoin="round"/>`;
        }

        function generateFisicoSVG() {
            const phases = getNumPhases();
            const pWidth = 35; // Largura por polo
            
            // Larguras dos componentes da Fileira 1
            const wMain = phases * pWidth;
            const wDPS = state.hasDPS ? (phases + (state.sys==='mono'?1:0)) * pWidth : 0; // DPS: 1 por fase, +1 pro neutro as vezes, mas vamos simplificar: 1 por fase + N se necessário. Padrão: fases + neutro
            const dpsModules = state.hasDPS ? (phases + 1) : 0; // Protege Fases e Neutro
            const wDPSActual = dpsModules * pWidth;
            const drPoles = state.hasDR ? (phases === 1 ? 2 : 4) : 0; // Mono: 2 polos, Bi/Tri: 4 polos
            const wDR = drPoles * pWidth;

            // Largura Fileira 2
            let wCircuits = 0;
            state.circuitos.forEach(c => wCircuits += c.poles * pWidth + 10);
            
            const totalWidth = Math.max(800, 150 + wMain + wDPSActual + wDR + 200, 150 + wCircuits + 200);
            const height = 650;

            let svg = `<svg viewBox="0 0 ${totalWidth} ${height}" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg">`;
            
            // Fundo
            svg += `<rect x="0" y="0" width="${totalWidth}" height="${height}" fill="#f8fafc" rx="8"/>`;
            svg += `<rect x="20" y="20" width="${totalWidth-40}" height="${height-40}" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5 5" rx="8"/>`;

            // Posições Base (Trilhos)
            const row1Y = 120;
            const row2Y = 400;
            
            svg += `<rect x="150" y="${row1Y+30}" width="${totalWidth-300}" height="30" fill="#cbd5e1" rx="2"/><line x1="150" y1="${row1Y+45}" x2="${totalWidth-150}" y2="${row1Y+45}" stroke="#94a3b8" stroke-dasharray="4"/>`;
            svg += `<rect x="150" y="${row2Y+30}" width="${totalWidth-300}" height="30" fill="#cbd5e1" rx="2"/><line x1="150" y1="${row2Y+45}" x2="${totalWidth-150}" y2="${row2Y+45}" stroke="#94a3b8" stroke-dasharray="4"/>`;

            // Barramentos Laterais
            const xN = 70;
            const xPE = totalWidth - 100;
            svg += `<rect x="${xN}" y="100" width="30" height="400" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="drop-shadow(0px 2px 2px rgba(0,0,0,0.1))"/>`;
            svg += `<text x="${xN+15}" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">NEUTRO</text>`;
            for(let i=120; i<=480; i+=25) svg += `<circle cx="${xN+15}" cy="${i}" r="4" fill="#cbd5e1" stroke="#94a3b8"/>`;

            svg += `<rect x="${xPE}" y="100" width="30" height="400" rx="3" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" filter="drop-shadow(0px 2px 2px rgba(0,0,0,0.1))"/>`;
            svg += `<text x="${xPE+15}" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">TERRA</text>`;
            for(let i=120; i<=480; i+=25) svg += `<circle cx="${xPE+15}" cy="${i}" r="4" fill="#cbd5e1" stroke="#94a3b8"/>`;

            let wiresHTML = '';
            let compsHTML = '';

            // --- FILEIRA 1: GERAL, DPS, DR ---
            let currX = 180;
            
            // 1. GERAL
            const mainX = currX;
            compsHTML += drawDevice(mainX, row1Y, phases, 'breaker', 'GERAL', `C${state.geral.amp}`);
            
            // Entradas Rede -> Topo do Geral
            const phaseColors = [COLORS.F1, COLORS.F2, COLORS.F3];
            let mainOutXs = [];
            for(let p=0; p<phases; p++) {
                const px = mainX + (p*pWidth) + (pWidth/2);
                wiresHTML += drawWire(px, 30, px, row1Y+5, phaseColors[p], 4);
                wiresHTML += `<text x="${px+10}" y="50" font-size="10" font-weight="bold" fill="${phaseColors[p]}">F${p+1}</text>`;
                mainOutXs.push(px);
            }
            
            currX += wMain + 30;

            // 2. DPS
            let dpsX = 0;
            let dpsIns = [];
            if (state.hasDPS) {
                dpsX = currX;
                compsHTML += drawDevice(dpsX, row1Y, dpsModules, 'dps', 'DPS', '');
                for(let p=0; p<dpsModules; p++) {
                    dpsIns.push(dpsX + (p*pWidth) + (pWidth/2));
                }
                
                // Saída Terra DPS -> Barramento Terra
                // Junta todos embaixo e vai pro terra
                const dpsBottomY = row1Y + 90 - 5;
                const dpsBusY = row1Y + 110;
                wiresHTML += drawWire(dpsIns[0], dpsBottomY, dpsIns[dpsModules-1], dpsBottomY, COLORS.PE, 3); // Jumper
                wiresHTML += drawZWire(dpsIns[dpsModules-1], dpsBottomY, xPE+15, 200, dpsBusY, COLORS.PE, 4);
                
                currX += wDPSActual + 30;
            }

            // 3. DR
            let drX = 0;
            let drIns = [];
            let drOuts = [];
            if (state.hasDR) {
                drX = currX;
                compsHTML += drawDevice(drX, row1Y, drPoles, 'dr', 'IDR GERAL', '30mA');
                // Pinos do DR (Fases e último é Neutro)
                for(let p=0; p<drPoles; p++) {
                    drIns.push(drX + (p*pWidth) + (pWidth/2));
                    drOuts.push(drX + (p*pWidth) + (pWidth/2));
                }
                currX += wDR + 30;
            }

            // --- ROTEAMENTO INTERNO (Trunk 1) ---
            // Fases: Main Bottom -> DR Top, e derivação para DPS Top
            const trunk1Y = row1Y + 120; // Espaço abaixo da fila 1
            const trunkTopY = row1Y - 40; // Espaço acima da fila 1
            
            // Entrada do Neutro
            const nEntryX = xN + 15;
            wiresHTML += drawWire(120, 30, 120, trunkTopY-10, COLORS.N, 4);
            wiresHTML += `<text x="130" y="50" font-size="10" font-weight="bold" fill="${COLORS.N}">N</text>`;
            
            if (state.hasDR) {
                // N vai da rede -> Topo do DR
                const drNIn = drIns[drPoles-1];
                wiresHTML += drawZWire(120, trunkTopY-10, drNIn, row1Y+5, trunkTopY-10, COLORS.N, 4);
                
                // N sai do DR -> Barramento N
                const drNOut = drOuts[drPoles-1];
                wiresHTML += drawZWire(drNOut, row1Y+85, xN+15, 300, trunk1Y+20, COLORS.N, 4);
            } else {
                // N direto pro Barramento N
                wiresHTML += drawZWire(120, trunkTopY-10, xN+15, 120, trunkTopY-10, COLORS.N, 4);
            }

            // Terra Direto
            wiresHTML += drawWire(xPE+15, 30, xPE+15, 100, COLORS.PE, 4);
            wiresHTML += `<text x="${xPE-20}" y="50" font-size="10" font-weight="bold" fill="${COLORS.PE}">PE</text>`;

            // Roteamento Fases
            for(let p=0; p<phases; p++) {
                const startX = mainOutXs[p];
                const laneY = trunk1Y + (p * 10); // Canaletas horizontais separadas
                
                let path = `M ${startX} ${row1Y+85} L ${startX} ${laneY}`;
                let endX = startX;

                if (state.hasDR) {
                    const drInX = drIns[p];
                    endX = drInX;
                    // Linha principal até DR passando por trás (visualmente por baixo) até subir
                    path += ` L ${drInX} ${laneY} L ${drInX} ${row1Y+5}`;
                }
                
                // Derivação DPS
                if (state.hasDPS) {
                    const dpsInX = dpsIns[p];
                    // Nó de derivação e subida
                    path += ` M ${dpsInX} ${laneY} L ${dpsInX} ${row1Y+5}`;
                    wiresHTML += `<circle cx="${dpsInX}" cy="${laneY}" r="3" fill="${phaseColors[p]}"/>`;
                    
                    // Se não for até o DR, garante que a linha horizontal vai até o DPS pelo menos
                    if (!state.hasDR) path = `M ${startX} ${row1Y+85} L ${startX} ${laneY} L ${dpsInX} ${laneY} L ${dpsInX} ${row1Y+5}`;
                }
                
                wiresHTML += `<path d="${path}" fill="none" stroke="${phaseColors[p]}" stroke-width="3" stroke-linejoin="round"/>`;
            }

            // DPS Neutro
            if (state.hasDPS) {
                const dpsNInX = dpsIns[dpsModules-1];
                // Pega do Neutro principal
                const nLaneY = trunk1Y + 30;
                let nPath = '';
                if(state.hasDR) {
                    // Pega antes do DR (Topo)
                    nPath = `M ${dpsNInX} ${row1Y+5} L ${dpsNInX} ${trunkTopY-20} L 120 ${trunkTopY-20}`;
                } else {
                    nPath = `M ${dpsNInX} ${row1Y+5} L ${dpsNInX} ${trunkTopY-20} L 120 ${trunkTopY-20}`;
                }
                wiresHTML += `<path d="${nPath}" fill="none" stroke="${COLORS.N}" stroke-width="2" stroke-linejoin="round"/>`;
            }


            // --- FILEIRA 2: CIRCUITOS ---
            currX = 180;
            let currentPhaseIdx = 0; // Para balanceamento simples (R, S, T, R, S...)

            // Barramento Pente Topo da Row 2
            const combBusY = row2Y - 15;
            let firstCircX = 0;
            let lastCircX = 0;

            state.circuitos.forEach((c, index) => {
                const cWidth = c.poles * pWidth;
                compsHTML += drawDevice(currX, row2Y, c.poles, 'breaker', `C${c.id}`, `${c.amp}A`);
                
                if (index === 0) firstCircX = currX + 17.5; // Centro do primeiro polo
                
                // Tratar polos
                let circOuts = [];
                for(let p=0; p<c.poles; p++) {
                    const px = currX + (p*pWidth) + (pWidth/2);
                    lastCircX = px;
                    
                    // Cor da fase
                    const pColor = phaseColors[(currentPhaseIdx + p) % phases];
                    
                    // Fio Saindo (Carga)
                    const outY = row2Y + 140 + (index * 15); // Escalonar labels
                    wiresHTML += drawWire(px, row2Y+85, px, outY, pColor, 2);
                    circOuts.push(px);
                }
                
                // Conexão Neutro e Terra pra Carga
                const nOutY = row2Y + 140 + (index * 15);
                wiresHTML += drawZWire(xN+15, 350+(index*10), currX - 10, outY=nOutY, nOutY, COLORS.N, 2);
                wiresHTML += drawZWire(xPE+15, 350+(index*10), currX + cWidth + 10, outY=nOutY, nOutY, COLORS.PE, 2);
                
                // Caixa da Carga
                const boxW = cWidth + 40;
                const boxX = currX - 20;
                wiresHTML += `<rect x="${boxX}" y="${nOutY}" width="${boxW}" height="20" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>`;
                wiresHTML += `<text x="${boxX + boxW/2}" y="${nOutY + 14}" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">${c.nome}</text>`;

                currentPhaseIdx = (currentPhaseIdx + c.poles) % phases;
                currX += cWidth + 10;
            });

            // Desenhar Barramento Pente Fisico (retângulo colorido)
            if (state.circuitos.length > 0) {
                wiresHTML += `<rect x="${firstCircX - 10}" y="${combBusY - 5}" width="${lastCircX - firstCircX + 20}" height="10" fill="#d97706" rx="2"/>`;
                wiresHTML += `<text x="${firstCircX + (lastCircX-firstCircX)/2}" y="${combBusY - 10}" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">Barramento Pente (${phases}F)</text>`;
                
                // Alimentar o Barramento Pente a partir do GERAL ou DR
                // Usando uma "Canaleta Vertical" do lado esquerdo (X=150)
                const feedX = 160;
                for(let p=0; p<phases; p++) {
                    let sourceX = state.hasDR ? drOuts[p] : mainOutXs[p];
                    let sourceY = row1Y + 85;
                    let dropY = trunk1Y + 50 + (p*10); // Desce além do trunk 1
                    
                    let path = `M ${sourceX} ${sourceY} L ${sourceX} ${dropY} L ${feedX + (p*10)} ${dropY} L ${feedX + (p*10)} ${combBusY} L ${firstCircX + (p*pWidth)} ${combBusY}`;
                    wiresHTML += `<path d="${path}" fill="none" stroke="${phaseColors[p]}" stroke-width="3" stroke-linejoin="round"/>`;
                }
            }

            svg += wiresHTML;
            svg += compsHTML;
            svg += `</svg>`;
            return svg;
        }

        function drawUnifilarSymbol(x, y, phases, hasN, hasPE) {
            let svg = `<g transform="translate(${x}, ${y})">`;
            
            // Fases (Traços transversais)
            const spacing = 4;
            const startX = -(phases-1)*spacing/2;
            for(let i=0; i<phases; i++) {
                svg += `<line x1="${startX + i*spacing - 6}" y1="-6" x2="${startX + i*spacing + 6}" y2="6" stroke="#000" stroke-width="1.5"/>`;
            }
            
            // Neutro (L shape)
            if(hasN) {
                const nx = startX + phases*spacing;
                svg += `<line x1="${nx - 6}" y1="-6" x2="${nx + 6}" y2="6" stroke="#000" stroke-width="1.5"/>`;
                svg += `<line x1="${nx - 6}" y1="-6" x2="${nx - 2}" y2="-10" stroke="#000" stroke-width="1.5"/>`;
            }
            
            // Terra (T shape)
            if(hasPE) {
                const px = startX + (phases + (hasN?1:0))*spacing;
                svg += `<line x1="${px - 6}" y1="-6" x2="${px + 6}" y2="6" stroke="#000" stroke-width="1.5"/>`;
                svg += `<line x1="${px - 4}" y1="8" x2="${px + 4}" y2="0" stroke="#000" stroke-width="1.5"/>`;
            }
            
            svg += `</g>`;
            return svg;
        }

        function generateUnifilarSVG() {
            const phases = getNumPhases();
            const numCircs = state.circuitos.length;
            const width = Math.max(800, 200 + (numCircs * 100));
            const height = 650;
            
            let svg = `<svg viewBox="0 0 ${width} ${height}" class="w-full h-auto bg-white" xmlns="http://www.w3.org/2000/svg">`;
            
            // Defs Disjuntor
            svg += `<defs>
                <g id="sym-breaker">
                    <line x1="0" y1="0" x2="0" y2="15" stroke="#000" stroke-width="1.5"/>
                    <path d="M -6 15 A 6 6 0 0 0 6 15" fill="none" stroke="#000" stroke-width="1.5"/>
                    <line x1="-6" y1="15" x2="6" y2="15" stroke="#000" stroke-width="1.5"/>
                    <line x1="0" y1="15" x2="0" y2="30" stroke="#000" stroke-width="1.5"/>
                </g>
            </defs>`;

            const mainX = 150;
            let currentY = 50;

            // Entrada
            svg += `<text x="${mainX}" y="${currentY}" text-anchor="middle" font-size="14" font-weight="bold">REDE ${state.sys.toUpperCase()}</text>`;
            svg += `<line x1="${mainX}" y1="${currentY+10}" x2="${mainX}" y2="${currentY+100}" stroke="#000" stroke-width="2"/>`;
            
            // Simbologia Fio Entrada
            svg += drawUnifilarSymbol(mainX, currentY + 50, phases, true, true);
            svg += `<text x="${mainX + 25}" y="${currentY + 55}" font-size="12">${state.geral.cabo} mm²</text>`;
            
            currentY += 100;

            // Disjuntor Geral
            svg += `<use href="#sym-breaker" x="${mainX}" y="${currentY}" />`;
            svg += `<text x="${mainX + 15}" y="${currentY + 15}" font-size="12" font-weight="bold">Geral</text>`;
            svg += `<text x="${mainX + 15}" y="${currentY + 30}" font-size="10">${phases}x ${state.geral.amp}A</text>`;
            svg += `<line x1="${mainX}" y1="${currentY+30}" x2="${mainX}" y2="${currentY+70}" stroke="#000" stroke-width="2"/>`;
            currentY += 70;

            // DPS
            if(state.hasDPS) {
                svg += `<rect x="${mainX-10}" y="${currentY}" width="20" height="20" fill="none" stroke="#000" stroke-width="1.5"/>`;
                svg += `<text x="${mainX + 15}" y="${currentY + 15}" font-size="12" font-weight="bold" fill="#7f1d1d">DPS (${phases+1} un)</text>`;
                svg += `<line x1="${mainX}" y1="${currentY+20}" x2="${mainX}" y2="${currentY+60}" stroke="#000" stroke-width="2"/>`;
                currentY += 60;
            }

            // DR
            if(state.hasDR) {
                svg += `<rect x="${mainX-15}" y="${currentY}" width="30" height="20" rx="3" fill="none" stroke="#000" stroke-width="1.5"/>`;
                svg += `<text x="${mainX}" y="${currentY+14}" text-anchor="middle" font-size="10" font-weight="bold">DR</text>`;
                svg += `<text x="${mainX + 20}" y="${currentY + 15}" font-size="12" font-weight="bold" fill="#1d4ed8">IDR ${phases===1?2:4} Polos 30mA</text>`;
                svg += `<line x1="${mainX}" y1="${currentY+20}" x2="${mainX}" y2="${currentY+70}" stroke="#000" stroke-width="2"/>`;
                currentY += 70;
            }

            // Barramento Principal (Linha Horizontal)
            const busWidth = numCircs * 100;
            svg += `<line x1="${mainX}" y1="${currentY}" x2="${mainX + busWidth}" y2="${currentY}" stroke="#000" stroke-width="3"/>`;
            svg += `<text x="${mainX + busWidth/2}" y="${currentY - 10}" text-anchor="middle" font-size="12" font-style="italic">QDC - Quadro de Distribuição</text>`;

            // Circuitos
            state.circuitos.forEach((c, index) => {
                const cx = mainX + 100 + (index * 100);
                
                // Conexão vertical
                svg += `<line x1="${cx}" y1="${currentY}" x2="${cx}" y2="${currentY+30}" stroke="#000" stroke-width="1.5"/>`;
                
                // Disjuntor
                svg += `<use href="#sym-breaker" x="${cx}" y="${currentY+30}" />`;
                svg += `<text x="${cx + 15}" y="${currentY + 45}" font-size="12" font-weight="bold">C${c.id}</text>`;
                svg += `<text x="${cx + 15}" y="${currentY + 60}" font-size="10">${c.poles}x ${c.amp}A</text>`;
                
                // Linha até carga
                const dropY = currentY + 150;
                svg += `<line x1="${cx}" y1="${currentY+60}" x2="${cx}" y2="${dropY}" stroke="#000" stroke-width="1.5"/>`;
                
                // Simbologia Fio Carga
                svg += drawUnifilarSymbol(cx, currentY + 110, c.poles, true, true);
                svg += `<text x="${cx + 20}" y="${currentY + 115}" font-size="10">${c.cabo} mm²</text>`;
                
                // Carga (Caixa)
                svg += `<rect x="${cx-40}" y="${dropY}" width="80" height="25" fill="#f8fafc" stroke="#64748b" rx="3"/>`;
                svg += `<text x="${cx}" y="${dropY+17}" text-anchor="middle" font-size="10" font-weight="bold">${c.nome.substring(0, 12)}</text>`;
            });

            svg += `</svg>`;
            return svg;
        }

        function renderApp() {
            renderFormControls();
            const renderArea = document.getElementById('svg-render-area');
            
            if (state.currentTab === 'fisico') {
                renderArea.innerHTML = generateFisicoSVG();
            } else {
                renderArea.innerHTML = generateUnifilarSVG();
            }
        }

        // Init
        window.onload = () => {
            renderApp();
        };

    </script>
</body>
</html>
