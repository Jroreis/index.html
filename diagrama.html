    <script>
        // Cores padrão
        const COLORS = {
            F1: '#ef4444', // Vermelho
            F2: '#1f2937', // Preto
            F3: '#78350f', // Marrom
            N:  '#3b82f6', // Azul
            PE: '#22c55e', // Verde
            BG: '#ffffff',
            STROKE: '#94a3b8'
        };

        const state = {
            sys: 'mono', // mono, bi, tri
            numRails: 2,
            geral: { amp: 63, cabo: 10 },
            hasDPS: false,
            hasDR: false,
            circuitos: [],
            currentTab: 'fisico'
        };

        let nextCircuitId = 1;

        function getNumPhases() {
            if(state.sys === 'mono') return 1;
            if(state.sys === 'bi') return 2;
            return 3;
        }

        function changeSystem() {
            state.sys = document.getElementById('sys-type').value;
            const maxPoles = getNumPhases();
            
            <comment-tag id="1">state.circuitos.forEach(c => {
                if (c.poles > maxPoles) c.poles = maxPoles;
            });</comment-tag id="1" text="state.circuitos.forEach(c => {
                if (c.poles > maxPoles) {
                    c.poles = maxPoles;
                    if (c.poles === 1) c.type = 'FNT';
                    else if (c.poles === 2) c.type = 'FFT';
                    else if (c.poles === 3) c.type = 'FFFT';
                }
            });" type="suggestion">
            renderApp();
        }

        function addCircuit() {
            state.circuitos.push({
                id: nextCircuitId++,
                nome: `Circuito ${state.circuitos.length + 1}`,
                poles: 1,
                amp: 16,
                cabo: '2.5',
                type: 'FNT' 
            });
            renderApp();
        }

        function removeCircuit(id) {
            state.circuitos = state.circuitos.filter(c => c.id !== id);
            renderApp();
        }

        function updateCircuit(id, field, value) {
            const c = state.circuitos.find(c => c.id === id);
            <comment-tag id="2">if (c) {
                c[field] = (field === 'amp' || field === 'poles') ? parseInt(value) : value;
                renderApp();
            }</comment-tag id="2" text="if (c) {
                c[field] = (field === 'amp' || field === 'poles') ? parseInt(value) : value;
                
                if (field === 'poles') {
                    if (c.poles === 1) c.type = 'FNT';
                    else if (c.poles === 2) c.type = 'FFT';
                    else if (c.poles === 3) c.type = 'FFFT';
                }
                
                renderApp();
            }" type="suggestion">
        }

        function switchTab(tab) {
            state.currentTab = tab;
            document.getElementById('btn-fisico').classList.remove('active', 'bg-blue-600', 'text-white');
            document.getElementById('btn-unifilar').classList.remove('active', 'bg-blue-600', 'text-white');
            
            const activeBtn = document.getElementById(`btn-${tab}`);
            activeBtn.classList.add('active');
            activeBtn.classList.remove('text-slate-600', 'hover:bg-slate-100');
            
            document.getElementById('pdf-subtitle').innerText = tab === 'fisico' ? 'Esquema Físico' : 'Diagrama Unifilar';
            
            renderApp();
        }

        function downloadPDF() {
            const tempContainer = document.createElement('div');
            // Container oculto da tela, porém montado perfeitamente para captura de imagem
            tempContainer.style.position = 'absolute';
            tempContainer.style.left = '-9999px';
            tempContainer.style.top = '0';
            tempContainer.style.width = '297mm'; 
            tempContainer.style.backgroundColor = 'white';
            
            const fisicoSVG = generateFisicoSVG();
            const unifilarSVG = generateUnifilarSVG();
            const sysName = state.sys === 'mono' ? 'Monofásico' : state.sys === 'bi' ? 'Bifásico' : 'Trifásico';
            
            tempContainer.innerHTML = `
                <!-- PÁGINA 1: Esquema Físico -->
                <div style="width: 297mm; height: 210mm; padding: 15mm; box-sizing: border-box; display: flex; flex-direction: column; page-break-after: always; background: white;">
                    <div style="text-align: center; margin-bottom: 15px;">
                        <h2 style="font-size: 24px; font-weight: bold; font-family: sans-serif; text-transform: uppercase; color: #1e293b; margin:0;">Quadro de Distribuição - Sistema ${sysName}</h2>
                        <h3 style="font-size: 16px; color: #475569; font-family: sans-serif; margin: 5px 0 0 0;">Esquema Físico de Ligação</h3>
                    </div>
                    <div style="flex: 1; display: flex; justify-content: center; align-items: center; min-height: 0;">
                        ${fisicoSVG.replace('<svg ', '<svg style="width: 100%; height: 100%; max-height: 100%; object-fit: contain;" ')}
                    </div>
                </div>
                
                <!-- PÁGINA 2: Diagrama Unifilar -->
                <div style="width: 297mm; height: 210mm; padding: 15mm; box-sizing: border-box; display: flex; flex-direction: column; background: white;">
                    <div style="text-align: center; margin-bottom: 15px;">
                        <h2 style="font-size: 24px; font-weight: bold; font-family: sans-serif; text-transform: uppercase; color: #1e293b; margin:0;">Quadro de Distribuição - Sistema ${sysName}</h2>
                        <h3 style="font-size: 16px; color: #475569; font-family: sans-serif; margin: 5px 0 0 0;">Diagrama Unifilar</h3>
                    </div>
                    <div style="flex: 1; display: flex; justify-content: center; align-items: center; min-height: 0;">
                        ${unifilarSVG.replace('<svg ', '<svg style="width: 100%; height: 100%; max-height: 100%; object-fit: contain;" ')}
                    </div>
                </div>
            `;
            
            document.body.appendChild(tempContainer);

            const opt = {
                margin:       0, // Margem zerada pois o padding interno do container já cuida disso
                filename:     `Projeto_QDC_${sysName}.pdf`,
                image:        { type: 'jpeg', quality: 1.0 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };

            html2pdf().set(opt).from(tempContainer).save().then(() => {
                document.body.removeChild(tempContainer);
            });
        }

        function renderFormControls() {
            state.sys = document.getElementById('sys-type').value;
            state.numRails = parseInt(document.getElementById('num-rails').value);
            state.geral.amp = parseInt(document.getElementById('geral-amp').value);
            state.geral.cabo = document.getElementById('geral-cabo').value;
            state.hasDPS = document.getElementById('has-dps').checked;
            state.hasDR = document.getElementById('has-dr').checked;

            const listContainer = document.getElementById('circuit-list');
            listContainer.innerHTML = '';
            
            const maxPoles = getNumPhases();

            state.circuitos.forEach((c) => {
                const div = document.createElement('div');
                div.className = 'bg-slate-50 border border-slate-200 rounded p-2 relative flex flex-col gap-2';
                
                // Opções de Tipo (FNT, FFT, FFFT etc)
                let typeOptions = '';
                if (c.poles === 1) {
                    typeOptions = `<option value="FNT" ${c.type==='FNT'?'selected':''}>F + N + T</option>
                                   <option value="FN" ${c.type==='FN'?'selected':''}>F + N</option>`;
                } else if (c.poles === 2) {
                    typeOptions = `<option value="FFT" ${c.type==='FFT'?'selected':''}>2F + T</option>
                                   <option value="FF" ${c.type==='FF'?'selected':''}>2F</option>`;
                } else if (c.poles === 3) {
                    typeOptions = `<option value="FFFT" ${c.type==='FFFT'?'selected':''}>3F + T</option>
                                   <option value="FFF" ${c.type==='FFF'?'selected':''}>3F</option>`;
                }

                div.innerHTML = `
                    <button onclick="removeCircuit(${c.id})" class="absolute top-1 right-1 text-slate-400 hover:text-red-500">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                    <input type="text" value="${c.nome}" onchange="updateCircuit(${c.id}, 'nome', this.value)" class="w-full text-xs font-semibold bg-transparent border-b border-slate-300 focus:border-blue-500 focus:outline-none p-0.5 text-slate-700">
                    <div class="grid grid-cols-4 gap-1">
                        <div>
                            <label class="text-[9px] uppercase font-bold text-slate-500">Polos</label>
                            <select onchange="updateCircuit(${c.id}, 'poles', this.value)" class="w-full text-[10px] p-0.5 border rounded bg-white">
                                ${Array.from({length: maxPoles}, (_, i) => `<option value="${i+1}" ${c.poles === i+1 ? 'selected' : ''}>${i+1} Polo${i>0?'s':''}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="text-[9px] uppercase font-bold text-slate-500">Ligação</label>
                            <select onchange="updateCircuit(${c.id}, 'type', this.value)" class="w-full text-[10px] p-0.5 border rounded bg-white">
                                ${typeOptions}
                            </select>
                        </div>
                        <div>
                            <label class="text-[9px] uppercase font-bold text-slate-500">Disj.</label>
                            <select onchange="updateCircuit(${c.id}, 'amp', this.value)" class="w-full text-[10px] p-0.5 border rounded bg-white">
                                ${[10, 16, 20, 25, 32, 40, 50, 63].map(v => `<option value="${v}" ${c.amp === v ? 'selected' : ''}>${v}A</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="text-[9px] uppercase font-bold text-slate-500">Cabo</label>
                            <select onchange="updateCircuit(${c.id}, 'cabo', this.value)" class="w-full text-[10px] p-0.5 border rounded bg-white">
                                ${['1.5', '2.5', '4.0', '6.0', '10'].map(v => `<option value="${v}" ${c.cabo === v ? 'selected' : ''}>${v}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        // Desenha um disjuntor/DR dinamicamente baseado no número de polos
        function drawDevice(x, y, poles, type, label, subtitle) {
            const poleWidth = 35;
            const width = poleWidth * poles;
            const height = 90;
            let svg = `<g transform="translate(${x}, ${y})">`;
            
            // Sombra e Corpo principal
            svg += `<rect x="0" y="0" width="${width}" height="${height}" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="drop-shadow(0px 4px 3px rgba(0,0,0,0.1))"/>`;
            
            for(let i=0; i<poles; i++) {
                const px = i * poleWidth;
                // Terminais superior e inferior
                svg += `<rect x="${px + 5}" y="5" width="${poleWidth - 10}" height="15" rx="2" fill="#e2e8f0" />`;
                svg += `<circle cx="${px + poleWidth/2}" cy="12.5" r="3" fill="#94a3b8" />`;
                
                svg += `<rect x="${px + 5}" y="70" width="${poleWidth - 10}" height="15" rx="2" fill="#e2e8f0" />`;
                svg += `<circle cx="${px + poleWidth/2}" cy="77.5" r="3" fill="#94a3b8" />`;
                
                if (type === 'dps') {
                    // DPS indicador
                    svg += `<rect x="${px + 5}" y="30" width="${poleWidth - 10}" height="30" rx="2" fill="#fca5a5" />`;
                }
            }

            if (type === 'breaker' || type === 'dr') {
                // Alavanca unificada
                svg += `<rect x="10" y="35" width="${width - 20}" height="20" rx="2" fill="#334155" />`;
                svg += `<rect x="10" y="32" width="${width - 20}" height="10" rx="2" fill="${type==='dr' ? '#3b82f6' : '#ef4444'}" />`;
            }
            
            if (type === 'dr') {
                svg += `<circle cx="${width - 12}" cy="45" r="4" fill="#e2e8f0" stroke="#94a3b8"/>`; // Botão Teste
                subtitle = `30mA - \u2264${state.geral.amp}A`;
            }
            if (type === 'dps') {
                subtitle = '275V/45kA';
            }

            svg += `<text x="${width/2}" y="-8" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">${label}</text>`;
            if(subtitle) svg += `<text x="${width/2}" y="28" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">${subtitle}</text>`;
            
            svg += `</g>`;
            return svg;
        }

        function drawWire(x1, y1, x2, y2, color, thickness=3) {
            return `<path d="M ${x1} ${y1} L ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="${thickness}" stroke-linecap="round" stroke-linejoin="round"/>`;
        }
        
        function drawOrthoWire(x1, y1, x2, y2, color, thickness=3, direction='v') {
            // Desenha linha com 1 quina (L shape)
            if (direction === 'v') {
                return `<path d="M ${x1} ${y1} L ${x1} ${y2} L ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="${thickness}" stroke-linejoin="round"/>`;
            } else {
                return `<path d="M ${x1} ${y1} L ${x2} ${y1} L ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="${thickness}" stroke-linejoin="round"/>`;
            }
        }
        
        function drawZWire(x1, y1, x2, y2, midY, color, thickness=3) {
            // Desenha linha com 2 quinas (Z shape)
            return `<path d="M ${x1} ${y1} L ${x1} ${midY} L ${x2} ${midY} L ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="${thickness}" stroke-linejoin="round"/>`;
        }

        function generateFisicoSVG() {
            const phases = getNumPhases();
            const pWidth = 35; 
            const isSingleRail = (state.numRails === 1);
            
            const wMain = phases * pWidth;
            const dpsModules = state.hasDPS ? (phases + 1) : 0; 
            const wDPSActual = dpsModules * pWidth;
            const drPoles = state.hasDR ? (phases === 1 ? 2 : 4) : 0; 
            const wDR = drPoles * pWidth;

            let wCircuits = 0;
            state.circuitos.forEach(c => wCircuits += c.poles * pWidth + 10);
            
            const totalWidth = isSingleRail 
                ? Math.max(800, 150 + wMain + wDPSActual + wDR + 60 + wCircuits + 200)
                : Math.max(800, 150 + Math.max(wMain + wDPSActual + wDR, wCircuits) + 200);
            
            const height = isSingleRail
                ? Math.max(500, 350 + (state.circuitos.length * 40))
                : Math.max(650, 500 + (state.circuitos.length * 40));

            let svg = `<svg viewBox="0 0 ${totalWidth} ${height}" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg">`;
            
            svg += `<rect x="0" y="0" width="${totalWidth}" height="${height}" fill="#f8fafc" rx="8"/>`;
            svg += `<rect x="20" y="20" width="${totalWidth-40}" height="${height-40}" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5 5" rx="8"/>`;

            const row1Y = 120;
            const row2Y = isSingleRail ? 120 : 350;
            
            // Trilho 1
            const rail1Width = isSingleRail ? (totalWidth - 300) : Math.max(400, wMain + wDPSActual + wDR + 50);
            svg += `<rect x="150" y="${row1Y+30}" width="${rail1Width}" height="30" fill="#cbd5e1" rx="2"/><line x1="150" y1="${row1Y+45}" x2="${150+rail1Width}" y2="${row1Y+45}" stroke="#94a3b8" stroke-dasharray="4"/>`;
            
            // Trilho 2 (Se houver)
            if (!isSingleRail) {
                const rail2Width = Math.max(400, wCircuits + 50);
                svg += `<rect x="150" y="${row2Y+30}" width="${rail2Width}" height="30" fill="#cbd5e1" rx="2"/><line x1="150" y1="${row2Y+45}" x2="${150+rail2Width}" y2="${row2Y+45}" stroke="#94a3b8" stroke-dasharray="4"/>`;
            }

            const xN = 60;
            const xPE = totalWidth - 90;
            const barHeight = height - 160;
            
            svg += `<rect x="${xN}" y="100" width="30" height="${barHeight}" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="drop-shadow(0px 2px 2px rgba(0,0,0,0.1))"/>`;
            svg += `<text x="${xN+15}" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">NEUTRO</text>`;
            for(let i=120; i<=100+barHeight-20; i+=25) svg += `<circle cx="${xN+15}" cy="${i}" r="4" fill="#cbd5e1" stroke="#94a3b8"/>`;

            svg += `<rect x="${xPE}" y="100" width="30" height="${barHeight}" rx="3" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" filter="drop-shadow(0px 2px 2px rgba(0,0,0,0.1))"/>`;
            svg += `<text x="${xPE+15}" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">TERRA</text>`;
            for(let i=120; i<=100+barHeight-20; i+=25) svg += `<circle cx="${xPE+15}" cy="${i}" r="4" fill="#cbd5e1" stroke="#94a3b8"/>`;

            let wiresHTML = '';
            let compsHTML = '';

            // PRÉ-CÁLCULO DAS POSIÇÕES DA FILEIRA 1
            let currX = 180;
            const mainX = currX;
            currX += wMain + 30;

            let dpsX = 0, dpsIns = [];
            if (state.hasDPS) {
                dpsX = currX;
                for(let p=0; p<dpsModules; p++) dpsIns.push(dpsX + (p*pWidth) + (pWidth/2));
                currX += wDPSActual + 30;
            }

            let drX = 0, drIns = [], drOuts = [];
            if (state.hasDR) {
                drX = currX;
                for(let p=0; p<drPoles; p++) {
                    drIns.push(drX + (p*pWidth) + (pWidth/2));
                    drOuts.push(drX + (p*pWidth) + (pWidth/2));
                }
                currX += wDR + 30;
            }

            // DESENHAR DISPOSITIVOS E CABOS DE ENTRADA (POR CIMA)
            compsHTML += drawDevice(mainX, row1Y, phases, 'breaker', 'GERAL', `C${state.geral.amp}`);
            if (state.hasDPS) compsHTML += drawDevice(dpsX, row1Y, dpsModules, 'dps', 'DPS', '');
            if (state.hasDR) compsHTML += drawDevice(drX, row1Y, drPoles, 'dr', 'IDR GERAL', '30mA');

            const phaseColors = [COLORS.F1, COLORS.F2, COLORS.F3];
            let mainOutXs = [];
            
            // Fases (Entrada da Rede alimentando apenas o Geral por cima)
            for(let p=0; p<phases; p++) {
                const px = mainX + (p*pWidth) + (pWidth/2);
                mainOutXs.push(px);
                
                wiresHTML += drawWire(px, 30, px, row1Y+5, phaseColors[p], 4);
                wiresHTML += `<text x="${px+10}" y="50" font-size="10" font-weight="bold" fill="${phaseColors[p]}">F${p+1}</text>`;
            }

            // Neutro (Entrada, DPS e DR)
            const trunkTopY = row1Y - 20 - (phases*10); // Neutro desce no nível mais alto
            wiresHTML += drawWire(120, 30, 120, row1Y+50, COLORS.N, 4);
            wiresHTML += `<text x="130" y="50" font-size="10" font-weight="bold" fill="${COLORS.N}">N</text>`;
            
            if (state.hasDPS) {
                const dpsNInX = dpsIns[dpsModules-1];
                wiresHTML += `<circle cx="120" cy="${trunkTopY}" r="3" fill="${COLORS.N}"/>`;
                wiresHTML += drawOrthoWire(120, trunkTopY, dpsNInX, row1Y+5, COLORS.N, 2, 'h');
            }
            if (state.hasDR) {
                const drNIn = drIns[drPoles-1];
                wiresHTML += `<circle cx="120" cy="${trunkTopY-10}" r="3" fill="${COLORS.N}"/>`;
                wiresHTML += drawOrthoWire(120, trunkTopY-10, drNIn, row1Y+5, COLORS.N, 4, 'h');
                const drNOut = drOuts[drPoles-1];
                wiresHTML += drawZWire(drNOut, row1Y+85, xN+15, 300, row1Y+140, COLORS.N, 4);
            } else {
                wiresHTML += drawZWire(120, trunkTopY-10, xN+15, 120, trunkTopY-10, COLORS.N, 4);
            }

            // Terra Direto
            wiresHTML += drawWire(xPE+15, 30, xPE+15, 100, COLORS.PE, 4);
            wiresHTML += `<text x="${xPE-20}" y="50" font-size="10" font-weight="bold" fill="${COLORS.PE}">PE</text>`;
            
            // Saída Terra DPS
            if (state.hasDPS) {
                const dpsBottomY = row1Y + 90 - 5;
                const dpsBusY = row1Y + 110;
                wiresHTML += drawWire(dpsIns[0], dpsBottomY, dpsIns[dpsModules-1], dpsBottomY, COLORS.PE, 3);
                wiresHTML += drawZWire(dpsIns[dpsModules-1], dpsBottomY, xPE+15, 200, dpsBusY, COLORS.PE, 4);
            }

            const trunk1Y = row1Y + 120; 

            // Roteamento de Saída do Geral para DPS e DR (Interno, após proteção principal)
            for(let p=0; p<phases; p++) {
                const startX = mainOutXs[p];
                const laneY = trunk1Y + (p * 10);
                
                let path = `M ${startX} ${row1Y+85} L ${startX} ${laneY}`;
                
                if (state.hasDPS || state.hasDR) {
                    const upX = mainX + wMain + 10 + (p * 5); // Canaleta subindo no vão entre Geral e DPS
                    const topY = row1Y - 15 - (p * 5); // Canaleta passando por cima
                    
                    path += ` L ${upX} ${laneY} L ${upX} ${topY}`;
                    
                    // Ponto de derivação na descida principal se vai descer pro barramento pente também
                    if (!state.hasDR && state.hasDPS && state.circuitos.length > 0) {
                        wiresHTML += `<circle cx="${startX}" cy="${laneY}" r="3" fill="${phaseColors[p]}"/>`;
                    }
                    
                    if (state.hasDPS) {
                        const dpsInX = dpsIns[p];
                        path += ` L ${dpsInX} ${topY} L ${dpsInX} ${row1Y+5}`; // Alimenta DPS por cima
                        
                        if (state.hasDR) {
                            wiresHTML += `<circle cx="${dpsInX}" cy="${topY}" r="3" fill="${phaseColors[p]}"/>`;
                            path += ` M ${dpsInX} ${topY}`; // Retorna ao topo para continuar pro DR
                        }
                    }
                    
                    if (state.hasDR) {
                        const drInX = drIns[p];
                        path += ` L ${drInX} ${topY} L ${drInX} ${row1Y+5}`; // Alimenta DR por cima
                    }
                    
                    wiresHTML += `<path d="${path}" fill="none" stroke="${phaseColors[p]}" stroke-width="3" stroke-linejoin="round"/>`;
                }
            }

            // FILEIRA 2: CIRCUITOS E BARRAMENTO PENTE
            let circX = isSingleRail ? currX + 30 : 180;
            const combBusY = row2Y - 15;
            let currentPhaseIdx = 0; 
            let firstCircX = 0;
            let lastCircX = 0;

            state.circuitos.forEach((c, index) => {
                const cWidth = c.poles * pWidth;
                compsHTML += drawDevice(circX, row2Y, c.poles, 'breaker', `C${c.id}`, `${c.amp}A`);
                if (index === 0) firstCircX = circX + 17.5;
                
                const outY = row2Y + 140 + (index * 40); 
                
                const boxW = Math.max(120, cWidth + 40);
                const boxX = circX - (boxW - cWidth)/2;
                
                let dropPositions = [];
                for(let p=0; p<c.poles; p++) {
                    const px = circX + (p*pWidth) + (pWidth/2);
                    lastCircX = px;
                    const pColor = phaseColors[(currentPhaseIdx + p) % phases];
                    wiresHTML += drawWire(px, row2Y+85, px, outY, pColor, 2);
                    dropPositions.push(px);
                }
                
                let nextDropX = dropPositions[0] - 10;

                // Fio Neutro desenhado individualmente até a carga
                if (c.type === 'FNT' || c.type === 'FN') {
                    const nHorizY = row2Y + 105 + (index * 6);
                    wiresHTML += `<path d="M ${xN+15} ${nHorizY} L ${nextDropX} ${nHorizY} L ${nextDropX} ${outY}" fill="none" stroke="${COLORS.N}" stroke-width="2" stroke-linejoin="round"/>`;
                    wiresHTML += `<circle cx="${xN+15}" cy="${nHorizY}" r="3" fill="${COLORS.N}"/>`;
                    nextDropX -= 10;
                }
                
                // Fio Terra desenhado individualmente até a carga
                if (c.type === 'FNT' || c.type === 'FFT' || c.type === 'FFFT') {
                    const peHorizY = row2Y + 110 + (index * 6);
                    const peDropX = dropPositions[dropPositions.length-1] + 10;
                    wiresHTML += `<path d="M ${xPE+15} ${peHorizY} L ${peDropX} ${peHorizY} L ${peDropX} ${outY}" fill="none" stroke="${COLORS.PE}" stroke-width="2" stroke-linejoin="round"/>`;
                    wiresHTML += `<circle cx="${xPE+15}" cy="${peHorizY}" r="3" fill="${COLORS.PE}"/>`;
                }
                
                wiresHTML += `<rect x="${boxX}" y="${outY}" width="${boxW}" height="20" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>`;
                wiresHTML += `<text x="${boxX + boxW/2}" y="${outY + 14}" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">${c.nome} (${c.cabo}mm²)</text>`;

                currentPhaseIdx = (currentPhaseIdx + c.poles) % phases;
                circX += cWidth + 10;
            });

            // Derivação Fases -> Barramento Pente (Super Organizado)
            if (state.circuitos.length > 0) {
                wiresHTML += `<rect x="${firstCircX - 10}" y="${combBusY - 5}" width="${lastCircX - firstCircX + 20}" height="10" fill="#d97706" rx="2"/>`;
                wiresHTML += `<text x="${firstCircX + (lastCircX-firstCircX)/2}" y="${combBusY - 10}" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">Barramento Pente (${phases}F)</text>`;
                
                const feedLaneX = 140; 
                for(let p=0; p<phases; p++) {
                    let sourceX = state.hasDR ? drOuts[p] : mainOutXs[p];
                    let sourceY = row1Y + 85;
                    let dropY = trunk1Y + 40 + (p*10);
                    
                    let path = "";
                    if (isSingleRail) {
                        // Derivação para 1 fila (vai pela direita até os circuitos e sobe)
                        let rightX = firstCircX - 15 - (p*8);
                        path = `M ${sourceX} ${sourceY} L ${sourceX} ${dropY} L ${rightX} ${dropY} L ${rightX} ${combBusY} L ${firstCircX + (p*pWidth)} ${combBusY}`;
                    } else {
                        // Derivação para 2 filas (canaleta vertical à esquerda em degraus bem organizados)
                        let leftLane = feedLaneX + (p*8);
                        let upStep = combBusY - 15 - (p*6);
                        
                        // O cabo que desce precisa saber se ele já parou no Y do DR ou se continuou direto. 
                        // O DR out está no y=row1Y+85.
                        path = `M ${sourceX} ${sourceY} L ${sourceX} ${dropY} L ${leftLane} ${dropY} L ${leftLane} ${upStep} L ${firstCircX + (p*pWidth)} ${upStep} L ${firstCircX + (p*pWidth)} ${combBusY}`;
                    }
                    wiresHTML += `<path d="${path}" fill="none" stroke="${phaseColors[p]}" stroke-width="3" stroke-linejoin="round"/>`;
                }
            }

            svg += wiresHTML;
            svg += compsHTML;
            svg += `</svg>`;
            return svg;
        }

        function drawUnifilarSymbol(x, y, poles, type) {
            let svg = `<g transform="translate(${x}, ${y})">`;
            
            const hasN = type.includes('N');
            const hasPE = type.includes('T');
            const spacing = 4;
            const startX = -(poles-1)*spacing/2;
            
            // Fases (Traços transversais)
            for(let i=0; i<poles; i++) {
                svg += `<line x1="${startX + i*spacing - 6}" y1="-6" x2="${startX + i*spacing + 6}" y2="6" stroke="#000" stroke-width="1.5"/>`;
            }
            
            // Neutro (L shape)
            if(hasN) {
                const nx = startX + poles*spacing;
                svg += `<line x1="${nx - 6}" y1="-6" x2="${nx + 6}" y2="6" stroke="#000" stroke-width="1.5"/>`;
                svg += `<line x1="${nx - 6}" y1="-6" x2="${nx - 2}" y2="-10" stroke="#000" stroke-width="1.5"/>`;
            }
            
            // Terra (T shape)
            if(hasPE) {
                const px = startX + (poles + (hasN?1:0))*spacing;
                svg += `<line x1="${px - 6}" y1="-6" x2="${px + 6}" y2="6" stroke="#000" stroke-width="1.5"/>`;
                svg += `<line x1="${px - 4}" y1="8" x2="${px + 4}" y2="0" stroke="#000" stroke-width="1.5"/>`;
            }
            
            svg += `</g>`;
            return svg;
        }

        function generateUnifilarSVG() {
            const phases = getNumPhases();
            const numCircs = state.circuitos.length;
            const width = Math.max(800, 200 + (numCircs * 100));
            const height = 650;
            
            let svg = `<svg viewBox="0 0 ${width} ${height}" class="w-full h-auto bg-white" xmlns="http://www.w3.org/2000/svg">`;
            
            // Defs Disjuntor
            svg += `<defs>
                <g id="sym-breaker">
                    <line x1="0" y1="0" x2="0" y2="15" stroke="#000" stroke-width="1.5"/>
                    <path d="M -6 15 A 6 6 0 0 0 6 15" fill="none" stroke="#000" stroke-width="1.5"/>
                    <line x1="-6" y1="15" x2="6" y2="15" stroke="#000" stroke-width="1.5"/>
                    <line x1="0" y1="15" x2="0" y2="30" stroke="#000" stroke-width="1.5"/>
                </g>
            </defs>`;

            const mainX = 150;
            let currentY = 50;

            // Entrada
            svg += `<text x="${mainX}" y="${currentY}" text-anchor="middle" font-size="14" font-weight="bold">REDE ${state.sys.toUpperCase()}</text>`;
            svg += `<line x1="${mainX}" y1="${currentY+10}" x2="${mainX}" y2="${currentY+100}" stroke="#000" stroke-width="2"/>`;
            
            // Simbologia Fio Entrada
            svg += drawUnifilarSymbol(mainX, currentY + 50, phases, 'FNT');
            svg += `<text x="${mainX + 25}" y="${currentY + 55}" font-size="12">${state.geral.cabo} mm²</text>`;
            
            currentY += 100;

            // Disjuntor Geral
            svg += `<use href="#sym-breaker" x="${mainX}" y="${currentY}" />`;
            svg += `<text x="${mainX + 15}" y="${currentY + 15}" font-size="12" font-weight="bold">Geral</text>`;
            svg += `<text x="${mainX + 15}" y="${currentY + 30}" font-size="10">${phases}x ${state.geral.amp}A</text>`;
            svg += `<line x1="${mainX}" y1="${currentY+30}" x2="${mainX}" y2="${currentY+70}" stroke="#000" stroke-width="2"/>`;
            currentY += 70;

            // DPS
            if(state.hasDPS) {
                svg += `<rect x="${mainX-10}" y="${currentY}" width="20" height="20" fill="none" stroke="#000" stroke-width="1.5"/>`;
                svg += `<text x="${mainX + 15}" y="${currentY + 15}" font-size="12" font-weight="bold" fill="#7f1d1d">DPS (${phases+1} un)</text>`;
                svg += `<line x1="${mainX}" y1="${currentY+20}" x2="${mainX}" y2="${currentY+60}" stroke="#000" stroke-width="2"/>`;
                currentY += 60;
            }

            // DR
            if(state.hasDR) {
                svg += `<rect x="${mainX-15}" y="${currentY}" width="30" height="20" rx="3" fill="none" stroke="#000" stroke-width="1.5"/>`;
                svg += `<text x="${mainX}" y="${currentY+14}" text-anchor="middle" font-size="10" font-weight="bold">DR</text>`;
                svg += `<text x="${mainX + 20}" y="${currentY + 15}" font-size="12" font-weight="bold" fill="#1d4ed8">IDR ${phases===1?2:4} Polos 30mA</text>`;
                svg += `<line x1="${mainX}" y1="${currentY+20}" x2="${mainX}" y2="${currentY+70}" stroke="#000" stroke-width="2"/>`;
                currentY += 70;
            }

            // Barramento Principal (Linha Horizontal)
            const busWidth = numCircs > 0 ? (numCircs * 100) : 100;
            svg += `<line x1="${mainX}" y1="${currentY}" x2="${mainX + busWidth}" y2="${currentY}" stroke="#000" stroke-width="3"/>`;
            svg += `<text x="${mainX + busWidth/2}" y="${currentY - 10}" text-anchor="middle" font-size="12" font-style="italic">QDC - Quadro de Distribuição</text>`;

            // Circuitos
            state.circuitos.forEach((c, index) => {
                const cx = mainX + 100 + (index * 100);
                
                // Conexão vertical
                svg += `<line x1="${cx}" y1="${currentY}" x2="${cx}" y2="${currentY+30}" stroke="#000" stroke-width="1.5"/>`;
                
                // Disjuntor
                svg += `<use href="#sym-breaker" x="${cx}" y="${currentY+30}" />`;
                svg += `<text x="${cx + 15}" y="${currentY + 45}" font-size="12" font-weight="bold">C${c.id}</text>`;
                svg += `<text x="${cx + 15}" y="${currentY + 60}" font-size="10">${c.poles}x ${c.amp}A</text>`;
                
                // Linha até carga
                const dropY = currentY + 150;
                svg += `<line x1="${cx}" y1="${currentY+60}" x2="${cx}" y2="${dropY}" stroke="#000" stroke-width="1.5"/>`;
                
                // Simbologia Fio Carga baseada no tipo selecionado
                svg += drawUnifilarSymbol(cx, currentY + 110, c.poles, c.type);
                svg += `<text x="${cx + 20}" y="${currentY + 115}" font-size="10">${c.cabo} mm²</text>`;
                
                // Carga (Caixa)
                svg += `<rect x="${cx-40}" y="${dropY}" width="80" height="25" fill="#f8fafc" stroke="#64748b" rx="3"/>`;
                svg += `<text x="${cx}" y="${dropY+17}" text-anchor="middle" font-size="10" font-weight="bold">${c.nome.substring(0, 12)}</text>`;
            });

            svg += `</svg>`;
            return svg;
        }

        function renderApp() {
            renderFormControls();
            const renderArea = document.getElementById('svg-render-area');
            
            if (state.currentTab === 'fisico') {
                renderArea.innerHTML = generateFisicoSVG();
            } else {
                renderArea.innerHTML = generateUnifilarSVG();
            }
        }

        // Init
        window.onload = () => {
            renderApp();
        };

    </script>
</body>
</html>
