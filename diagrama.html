<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QDC Pro Generator - CAD 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow: hidden; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .tab-btn.active { background-color: #2563eb; color: white; border-color: #2563eb; }

        details > summary { list-style: none; outline: none; }
        details > summary::-webkit-details-marker { display: none; }
        
        #sidebar { transition: margin-left 0.3s ease-in-out; }
        .sidebar-closed { margin-left: -320px; }

        /* Impressão Nível Profissional */
        @media print {
            @page { size: A4 landscape; margin: 0; }
            body { background: white !important; margin: 0 !important; padding: 0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; overflow: visible !important;}
            #ui-sidebar, .no-print { display: none !important; }
            #main-content { margin: 0 !important; padding: 0 !important; width: 100% !important; height: auto !important; overflow: visible !important;}
            #print-wrapper { display: block !important; width: 100%; margin: 0; padding: 0; }
            .print-page { 
                width: 297mm; height: 210mm; page-break-after: always; 
                display: flex; justify-content: center; align-items: center; 
                padding: 5mm; box-sizing: border-box; background: white;
                overflow: hidden; margin: 0;
            }
            .print-page svg { width: 100%; height: 100%; max-height: 100%; object-fit: contain; }
        }
    </style>
</head>
<body class="h-screen w-full flex">

    <!-- SANFONA LATERAL (UI) -->
    <aside id="ui-sidebar" class="w-80 bg-white border-r border-slate-200 flex flex-col h-full flex-shrink-0 z-20 shadow-lg relative transition-all duration-300">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <div>
                <h1 class="font-bold text-slate-800 text-lg leading-tight">QDC Pro CAD</h1>
                <p class="text-[10px] text-slate-500 font-semibold uppercase">Engenharia Paramétrica</p>
            </div>
            <!-- Botão 3 pontinhos -->
            <button onclick="toggleSidebar()" class="p-2 text-slate-500 hover:text-blue-600 hover:bg-blue-50 rounded transition-colors" title="Recolher Menu">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-3 space-y-3">
            
            <!-- Sanfona 1: Dados do Projeto -->
            <details class="group bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden" open>
                <summary class="flex justify-between items-center p-3 cursor-pointer bg-slate-50 hover:bg-slate-100 transition-colors">
                    <span class="font-bold text-slate-700 text-xs uppercase tracking-wider">1. Dados do Projeto</span>
                    <svg class="w-4 h-4 text-slate-400 group-open:rotate-90 transition-transform" fill="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </summary>
                <div class="p-3 border-t border-slate-200 space-y-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Responsável Técnico</label>
                        <input type="text" id="proj-resp" class="w-full text-xs border-slate-300 rounded border p-2 bg-slate-50 focus:border-blue-500 outline-none" placeholder="Ex: Eng. João..." onchange="renderApp()">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Obra / Cliente</label>
                        <input type="text" id="proj-obra" class="w-full text-xs border-slate-300 rounded border p-2 bg-slate-50 focus:border-blue-500 outline-none" placeholder="Ex: Residência..." onchange="renderApp()">
                    </div>
                </div>
            </details>

            <!-- Sanfona 2: Configuração Geral -->
            <details class="group bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden" open>
                <summary class="flex justify-between items-center p-3 cursor-pointer bg-slate-50 hover:bg-slate-100 transition-colors">
                    <span class="font-bold text-slate-700 text-xs uppercase tracking-wider">2. Configuração Geral</span>
                    <svg class="w-4 h-4 text-slate-400 group-open:rotate-90 transition-transform" fill="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </summary>
                <div class="p-3 border-t border-slate-200 grid grid-cols-2 gap-3">
                    <div class="col-span-2">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Sistema Elétrico</label>
                        <select id="sys-type" class="w-full text-xs border-slate-300 rounded border p-1.5 bg-slate-50" onchange="changeSystem()">
                            <option value="mono" selected>Monofásico (1F+N)</option>
                            <option value="bi">Bifásico (2F+N)</option>
                            <option value="tri">Trifásico (3F+N)</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Aterramento</label>
                        <select id="sys-aterramento" class="w-full text-xs border-slate-300 rounded border p-1.5 bg-slate-50" onchange="renderApp()">
                            <option value="tn-s" selected>TN-S (Separados)</option>
                            <option value="tn-c-s">TN-C-S (BEP QDC)</option>
                            <option value="tn-c">TN-C (Comum)</option>
                            <option value="tt">TT (Independente)</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Layout do Quadro</label>
                        <select id="layout-style" class="w-full text-xs border-slate-300 rounded border p-1.5 bg-slate-50" onchange="renderApp()">
                            <option value="padrao" selected>Múltiplos Trilhos (Padrão)</option>
                            <option value="compacto">Trilho Único (Compacto)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Disj. Geral</label>
                        <select id="geral-amp" class="w-full text-xs border-slate-300 rounded border p-1.5 bg-slate-50" onchange="renderApp()">
                            <option value="40">40A</option>
                            <option value="50">50A</option>
                            <option value="63" selected>63A</option>
                            <option value="80">80A</option>
                            <option value="100">100A</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Cabo Entrada</label>
                        <select id="geral-cabo" class="w-full text-xs border-slate-300 rounded border p-1.5 bg-slate-50" onchange="renderApp()">
                            <option value="10">10 mm²</option>
                            <option value="16" selected>16 mm²</option>
                            <option value="25">25 mm²</option>
                            <option value="35">35 mm²</option>
                        </select>
                    </div>
                    <div class="col-span-2 flex flex-col gap-2 mt-1">
                        <label class="flex items-center text-xs font-bold text-slate-700 cursor-pointer">
                            <input type="checkbox" id="has-dps" checked class="mr-2" onchange="renderApp()"> Incluir DPS (Surto)
                        </label>
                        <label class="flex items-center text-xs font-bold text-slate-700 cursor-pointer">
                            <input type="checkbox" id="has-dr" checked class="mr-2" onchange="renderApp()"> Incluir DR Geral (Fuga)
                        </label>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Qtd. Trilhos Físicos (Linhas)</label>
                        <select id="sys-trilhos" class="w-full text-xs border-slate-300 rounded border p-1.5 bg-slate-50" onchange="renderApp()">
                            <option value="1">1 Trilho</option>
                            <option value="2" selected>2 Trilhos</option>
                            <option value="3">3 Trilhos</option>
                            <option value="4">4 Trilhos</option>
                            <option value="5">5 Trilhos</option>
                            <option value="6">6 Trilhos</option>
                            <option value="7">7 Trilhos</option>
                            <option value="8">8 Trilhos</option>
                            <option value="9">9 Trilhos</option>
                            <option value="10">10 Trilhos</option>
                        </select>
                    </div>
                </div>
            </details>

            <!-- Sanfona 3: Circuitos -->
            <details class="group bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden" open>
                <summary class="flex justify-between items-center p-3 cursor-pointer bg-slate-50 hover:bg-slate-100 transition-colors">
                    <span class="font-bold text-slate-700 text-xs uppercase tracking-wider">3. Circuitos (Cargas)</span>
                    <svg class="w-4 h-4 text-slate-400 group-open:rotate-90 transition-transform" fill="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </summary>
                <div class="p-2 border-t border-slate-200">
                    <button onclick="addCircuit()" class="w-full mb-3 bg-blue-50 border border-blue-200 text-blue-600 hover:bg-blue-100 text-xs font-bold py-2 rounded transition-colors">
                        + Novo Circuito
                    </button>
                    <div id="circuit-list" class="space-y-2 max-h-[300px] overflow-y-auto pr-1">
                        <!-- Injetado via JS -->
                    </div>
                </div>
            </details>

        </div>
        
        <div class="p-4 border-t border-slate-200 bg-white">
            <button onclick="exportPDF()" class="w-full bg-red-600 hover:bg-red-700 text-white text-sm font-bold py-2 rounded shadow transition-colors flex items-center justify-center">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Exportar PDF
            </button>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main id="main-content" class="flex-1 flex flex-col h-full bg-slate-100 relative transition-all duration-300">
        
        <!-- Botão Flutuante (Aparece quando sanfona fecha) -->
        <button id="btn-open-sidebar" onclick="toggleSidebar()" class="hidden absolute top-4 left-4 z-10 p-2 bg-white border border-slate-200 shadow-md text-slate-600 hover:text-blue-600 rounded no-print">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>

        <div class="flex border-b border-slate-200 bg-white px-4 py-2 gap-2 no-print shadow-sm z-0 pl-16">
            <button onclick="switchTab('fisico')" id="btn-fisico" class="tab-btn active px-4 py-1.5 rounded text-sm font-semibold text-slate-600 bg-slate-50 border border-slate-200 transition-colors">Físico (CAD 3D)</button>
            <button onclick="switchTab('unifilar')" id="btn-unifilar" class="tab-btn px-4 py-1.5 rounded text-sm font-semibold text-slate-600 hover:bg-slate-50 transition-colors">Diagrama Unifilar</button>
        </div>
        
        <div class="flex-1 overflow-auto p-6 flex justify-center items-start">
            <div id="svg-render-area" class="w-full max-w-5xl bg-white rounded shadow-md border border-slate-200 min-h-[700px] flex justify-center">
                <!-- SVG Gerado -->
            </div>
        </div>
    </main>

    <!-- WRAPPER DO PDF -->
    <div id="print-wrapper" style="display: none;"></div>

    <script>
        // --- ESTADO DA APLICAÇÃO ---
        let state = {
            resp: '', obra: '', sistema: 'mono', aterramento: 'tn-s', numTrilhos: 2, layoutCompacto: false,
            geral: { amp: 63, cabo: 16 }, hasDPS: true, hasDR: true, currentTab: 'fisico',
            circuitos: [
                { id: 101, nome: 'Chuveiro', polos: 1, amp: 50, cabo: '6.0' },
                { id: 102, nome: 'TUG', polos: 1, amp: 20, cabo: '2.5' }
            ]
        };

        const phaseColors = ['#ef4444', '#111111', '#78716c']; // Vermelho, Preto, Cinza
        const C = { n: '#3b82f6', pe: '#22c55e' }; // Azul, Verde

        // --- CONTROLE DE UI ---
        function toggleSidebar() {
            const sidebar = document.getElementById('ui-sidebar');
            const btnOpen = document.getElementById('btn-open-sidebar');
            if (sidebar.classList.contains('hidden')) {
                sidebar.classList.remove('hidden');
                btnOpen.classList.add('hidden');
            } else {
                sidebar.classList.add('hidden');
                btnOpen.classList.remove('hidden');
            }
        }

        // --- DEFINIÇÕES GRÁFICAS 3D (SVG) ---
        const svgDefs = `
            <defs>
                <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#e2e8f0"/><stop offset="50%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#cbd5e1"/>
                </linearGradient>
                <linearGradient id="brass" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#fde047"/><stop offset="50%" stop-color="#eab308"/><stop offset="100%" stop-color="#a16207"/>
                </linearGradient>
                <linearGradient id="copper" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#fca5a5"/><stop offset="50%" stop-color="#ef4444"/><stop offset="100%" stop-color="#991b1b"/>
                </linearGradient>
                <g id="screw">
                    <circle cx="0" cy="0" r="3.5" fill="url(#metal)" stroke="#64748b" stroke-width="1"/>
                    <line x1="-2" y1="0" x2="2" y2="0" stroke="#475569" stroke-width="1.5"/>
                    <line x1="0" y1="-2" x2="0" y2="2" stroke="#475569" stroke-width="1.5"/>
                </g>
                <g id="uni-breaker"><line x1="0" y1="0" x2="0" y2="15" stroke="#000" stroke-width="2"/><line x1="-5" y1="15" x2="5" y2="15" stroke="#000" stroke-width="2"/><path d="M -5 15 A 5 5 0 0 0 5 15" fill="none" stroke="#000" stroke-width="2"/><line x1="0" y1="15" x2="0" y2="30" stroke="#000" stroke-width="2"/></g>
                <g id="sym-fase"><line x1="-6" y1="-6" x2="6" y2="6" stroke="#000" stroke-width="1.5"/></g>
                <g id="sym-neutro"><line x1="-6" y1="-6" x2="6" y2="6" stroke="#000" stroke-width="1.5"/><line x1="-6" y1="-6" x2="-2" y2="-10" stroke="#000" stroke-width="1.5"/></g>
                <g id="sym-terra"><line x1="-6" y1="-6" x2="6" y2="6" stroke="#000" stroke-width="1.5"/><line x1="-4" y1="9" x2="4" y2="-1" stroke="#000" stroke-width="1.5"/></g>
            </defs>
        `;

        // Função Matadora para desenhar o cabo com borda escura realista
        function drawWire(pathD, color) {
            let html = `<path d="${pathD}" fill="none" stroke="#1e293b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`;
            html += `<path d="${pathD}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
            return html;
        }

        // Desenha os Disjuntores estilo Steck/Soprano da Imagem
        function drawBreaker3D(x, y, poles, label, sublabel, type="disj") {
            const w = poles * 40;
            let html = `<g transform="translate(${x}, ${y})">`;
            
            // Corpo Principal
            html += `<rect x="0" y="0" width="${w}" height="90" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.5" />`;
            // Relevo Central
            html += `<rect x="2" y="22" width="${w-4}" height="46" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>`;
            
            for(let p=0; p<poles; p++) {
                let px = p * 40;
                // Bornes Metálicos Topo e Base
                html += `<rect x="${px+6}" y="2" width="28" height="18" rx="2" fill="url(#metal)" stroke="#64748b"/>`;
                html += `<rect x="${px+6}" y="70" width="28" height="18" rx="2" fill="url(#metal)" stroke="#64748b"/>`;
                html += `<use href="#screw" x="${px+20}" y="11" /><use href="#screw" x="${px+20}" y="79" />`;
                // Divisória de polos
                if (p > 0) html += `<line x1="${px}" y1="22" x2="${px}" y2="68" stroke="#e2e8f0" stroke-width="2"/>`;

                if (type === "dps") {
                    // Cartucho DPS (Vermelho com visor verde)
                    html += `<rect x="${px+6}" y="26" width="28" height="38" rx="2" fill="#ef4444" stroke="#991b1b"/>`;
                    html += `<rect x="${px+12}" y="50" width="16" height="8" rx="1" fill="#22c55e"/>`; 
                } else if (type === "disj") {
                    // Alavanca Disjuntor (Vermelha)
                    html += `<rect x="${px+12}" y="35" width="16" height="20" rx="2" fill="#1e293b"/>`;
                    html += `<rect x="${px+12}" y="35" width="16" height="12" rx="2" fill="#ef4444"/>`;
                }
            }
            
            if (type === "dr") {
                // Alavanca Azul única do DR
                html += `<rect x="${(w/2)-20}" y="35" width="40" height="20" rx="2" fill="#1e293b"/>`;
                html += `<rect x="${(w/2)-20}" y="35" width="40" height="12" rx="2" fill="#3b82f6"/>`; 
                // Botão Teste
                html += `<circle cx="${w-15}" cy="45" r="4.5" fill="#f1f5f9" stroke="#94a3b8"/>`;
                html += `<text x="${w-15}" y="54" text-anchor="middle" font-size="5" font-weight="900" fill="#64748b">T</text>`;
            }

            html += `<text x="${w/2}" y="-8" text-anchor="middle" font-size="11" font-weight="900" fill="#0f172a">${label}</text>`;
            if(sublabel) html += `<text x="${w/2}" y="28" text-anchor="middle" font-size="9" font-weight="900" fill="#0f172a">${sublabel}</text>`;
            html += `</g>`;
            return html;
        }

        // Desenha a "Boca" amarela do conduíte
        function drawConduit(x, y, label) {
            return `
                <g transform="translate(${x}, ${y})">
                    <rect x="-15" y="0" width="30" height="20" fill="url(#brass)" stroke="#a16207" stroke-width="1.5"/>
                    <ellipse cx="0" cy="20" rx="15" ry="5" fill="url(#brass)" stroke="#a16207" stroke-width="1.5"/>
                    <ellipse cx="0" cy="0" rx="15" ry="6" fill="#fef08a" stroke="#a16207" stroke-width="1.5"/>
                    <ellipse cx="0" cy="0" rx="10" ry="4" fill="#1e293b"/>
                    <rect x="-35" y="28" width="70" height="16" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
                    <text x="0" y="39" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">${label}</text>
                </g>
            `;
        }

        // --- LÓGICA DE DADOS ---
        function addCircuit() {
            const maxP = state.sistema === 'mono' ? 1 : (state.sistema === 'bi' ? 2 : 3);
            state.circuitos.push({ id: Date.now(), nome: `C${state.circuitos.length + 1}`, polos: maxP===3?1:maxP, amp: 20, cabo: '2.5' });
            renderApp();
        }
        function removeCircuit(id) { state.circuitos = state.circuitos.filter(c => c.id !== id); renderApp(); }
        
        function updateCircuit(id, f, v) { 
            const c = state.circuitos.find(x => x.id === id); 
            if (c) { 
                c[f] = (f === 'amp' || f === 'polos') ? parseInt(v) : v; 
                renderApp(); 
            } 
        }
        
        function changeSystem() {
            state.sistema = document.getElementById('sys-type').value;
            const maxP = state.sistema === 'mono' ? 1 : (state.sistema === 'bi' ? 2 : 3);
            state.circuitos.forEach(c => { if(c.polos > maxP) c.polos = maxP; });
            renderApp();
        }

        function switchTab(tab) {
            if (tab) state.currentTab = tab;
            document.getElementById('btn-fisico').classList.remove('active', 'bg-blue-600', 'text-white');
            document.getElementById('btn-unifilar').classList.remove('active', 'bg-blue-600', 'text-white');
            document.getElementById(`btn-${state.currentTab}`).classList.add('active');
            document.getElementById('svg-render-area').innerHTML = state.currentTab === 'fisico' ? generateFisicoSVG() : generateUnifilarSVG();
        }

        function exportPDF() {
            document.getElementById('print-wrapper').innerHTML = `
                <div class="print-page">${generateFisicoSVG()}</div>
                <div class="print-page">${generateUnifilarSVG()}</div>
            `;
            setTimeout(() => { window.print(); }, 300);
        }

        function renderFormControls() {
            state.resp = document.getElementById('proj-resp').value;
            state.obra = document.getElementById('proj-obra').value;
            state.aterramento = document.getElementById('sys-aterramento').value;
            state.layoutCompacto = document.getElementById('layout-style').value === 'compacto';
            state.numTrilhos = parseInt(document.getElementById('sys-trilhos').value) || 2;
            state.geral.amp = parseInt(document.getElementById('geral-amp').value);
            state.geral.cabo = parseInt(document.getElementById('geral-cabo').value);
            state.hasDPS = document.getElementById('has-dps').checked;
            state.hasDR = document.getElementById('has-dr').checked;

            const list = document.getElementById('circuit-list');
            list.innerHTML = '';
            const maxP = state.sistema === 'mono' ? 1 : (state.sistema === 'bi' ? 2 : 3);

            state.circuitos.forEach((c) => {
                let pOpts = `<option value="1" ${c.polos===1?'selected':''}>1 P</option>`;
                if (maxP >= 2) pOpts += `<option value="2" ${c.polos===2?'selected':''}>2 P</option>`;
                if (maxP === 3) pOpts += `<option value="3" ${c.polos===3?'selected':''}>3 P</option>`;

                list.innerHTML += `
                    <div class="bg-white border border-slate-200 rounded p-2 relative shadow-sm">
                        <button onclick="removeCircuit(${c.id})" class="absolute top-1 right-1 text-red-500 hover:bg-red-100 rounded px-1 font-bold">&times;</button>
                        <input type="text" value="${c.nome}" onchange="updateCircuit(${c.id}, 'nome', this.value)" class="w-[85%] font-bold text-xs bg-transparent border-b border-slate-300 outline-none mb-1">
                        <div class="grid grid-cols-3 gap-1">
                            <div><select onchange="updateCircuit(${c.id}, 'polos', this.value)" class="w-full p-1 border rounded text-[10px]">${pOpts}</select></div>
                            <div><select onchange="updateCircuit(${c.id}, 'amp', this.value)" class="w-full p-1 border rounded text-[10px]">${[10,16,20,25,32,40,50,63].map(v=>`<option value="${v}" ${c.amp===v?'selected':''}>${v}A</option>`).join('')}</select></div>
                            <div><select onchange="updateCircuit(${c.id}, 'cabo', this.value)" class="w-full p-1 border rounded text-[10px]">${['1.5','2.5','4.0','6.0','10','16'].map(v=>`<option value="${v}" ${c.cabo===v?'selected':''}>${v}</option>`).join('')}</select></div>
                        </div>
                    </div>`;
            });
        }

        // --- GERAÇÃO FÍSICA (ALGORITMO ORTOGONAL CAD 3D) ---
        function generateFisicoSVG() {
            const numF = state.sistema === 'mono' ? 1 : (state.sistema === 'bi' ? 2 : 3);
            const hasMainN = true; 
            
            let rowH = 180;
            const yMain = 230; 
            
            const dpsP = numF + (hasMainN ? 1 : 0);
            const drP = numF + (hasMainN ? 1 : 0);
            
            // Lógica de cálculo dos trilhos necessários para interromper o tronco mestre
            let actualUsedRails = state.layoutCompacto ? 0 : 1; 
            let xG = 260;
            let xDPS = xG + (numF*40) + 40;
            let xDR = state.hasDPS ? xDPS + (dpsP*40) + 40 : xDPS;

            let calcX = state.layoutCompacto ? ((state.hasDR ? xDR + (drP*40) : (state.hasDPS ? xDPS + (dpsP*40) : xG)) + 40) : 260;
            for(let c of state.circuitos) {
                if (calcX + (c.polos*40) > 1050) { actualUsedRails++; calcX = 260; }
                calcX += (c.polos*40) + 20;
            }
            if (actualUsedRails >= state.numTrilhos && !state.layoutCompacto) actualUsedRails = state.numTrilhos - 1; 
            if (state.circuitos.length === 0) actualUsedRails = 0; 

            let trunkMaxY = yMain + 90; 
            if (actualUsedRails > 0) trunkMaxY = yMain + 180 + (actualUsedRails * rowH); 

            const svgHeight = Math.max(700, 300 + (state.numTrilhos * rowH));
            let svg = `<svg viewBox="0 0 1200 ${svgHeight}" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg" style="background:#e2e8f0;">${svgDefs}`;

            // Caixa do QDC Metálico
            svg += `<rect x="40" y="20" width="1120" height="${svgHeight-40}" fill="#f1f5f9" stroke="#94a3b8" stroke-width="4" rx="15"/>`;
            svg += `<rect x="60" y="40" width="1080" height="${svgHeight-80}" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" rx="10"/>`;
            
            // Título Profissional
            svg += `<rect x="100" y="60" width="1000" height="60" fill="#ffffff" stroke="#cbd5e1" rx="5"/>`;
            svg += `<text x="600" y="85" text-anchor="middle" font-size="16" font-weight="900" fill="#1e293b">QUADRO DE DISTRIBUIÇÃO - SISTEMA ${state.sistema.toUpperCase()} (FÍSICO 3D)</text>`;
            svg += `<text x="600" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#64748b">RESPONSÁVEL TÉCNICO: ${state.resp.toUpperCase() || 'NÃO INFORMADO'} | CLIENTE/OBRA: ${state.obra.toUpperCase() || 'NÃO INFORMADA'} | ATERRAMENTO: ${state.aterramento.toUpperCase()}</text>`;

            // --- BARRAMENTOS DIVIDIDOS (N1/N2 e PE1/PE2) ---
            const bH = (svgHeight - 200) / 2 - 15;
            const bY1 = 140;
            const bY2 = 140 + bH + 30;
            const bNx = 80, bPEx = 1090;

            // N1
            svg += `<rect x="${bNx-2}" y="${bY1}" width="34" height="${bH}" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />`;
            svg += `<rect x="${bNx+5}" y="${bY1+10}" width="20" height="${bH-20}" fill="url(#brass)" stroke="#a16207" rx="2"/>`;
            svg += `<text x="${bNx+15}" y="${bY1-10}" text-anchor="middle" font-size="10" font-weight="900" fill="#3b82f6">NEUTRO 1</text>`;
            // N2
            svg += `<rect x="${bNx-2}" y="${bY2}" width="34" height="${bH}" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />`;
            svg += `<rect x="${bNx+5}" y="${bY2+10}" width="20" height="${bH-20}" fill="url(#brass)" stroke="#a16207" rx="2"/>`;
            svg += `<text x="${bNx+15}" y="${bY2-10}" text-anchor="middle" font-size="10" font-weight="900" fill="#3b82f6">NEUTRO 2</text>`;
            // PE1
            svg += `<rect x="${bPEx-2}" y="${bY1}" width="34" height="${bH}" rx="3" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" />`;
            svg += `<rect x="${bPEx+5}" y="${bY1+10}" width="20" height="${bH-20}" fill="url(#brass)" stroke="#a16207" rx="2"/>`;
            svg += `<text x="${bPEx+15}" y="${bY1-10}" text-anchor="middle" font-size="10" font-weight="900" fill="#22c55e">TERRA 1</text>`;
            // PE2
            svg += `<rect x="${bPEx-2}" y="${bY2}" width="34" height="${bH}" rx="3" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" />`;
            svg += `<rect x="${bPEx+5}" y="${bY2+10}" width="20" height="${bH-20}" fill="url(#brass)" stroke="#a16207" rx="2"/>`;
            svg += `<text x="${bPEx+15}" y="${bY2-10}" text-anchor="middle" font-size="10" font-weight="900" fill="#22c55e">TERRA 2</text>`;

            const bHolesN1 = [], bHolesN2 = [], bHolesPE1 = [], bHolesPE2 = [];
            for(let i=bY1+20; i<=bY1+bH-30; i+=25) {
                svg += `<use href="#screw" x="${bNx+15}" y="${i}"/><use href="#screw" x="${bPEx+15}" y="${i}"/>`;
                bHolesN1.push(i); bHolesPE1.push(i);
            }
            for(let i=bY2+20; i<=bY2+bH-30; i+=25) {
                svg += `<use href="#screw" x="${bNx+15}" y="${i}"/><use href="#screw" x="${bPEx+15}" y="${i}"/>`;
                bHolesN2.push(i); bHolesPE2.push(i);
            }
            const allHolesPE = [...bHolesPE1, ...bHolesPE2];
            const allHolesN = [...bHolesN1, ...bHolesN2];

            // BEP
            const bepX = 850, bepY = 150;
            if (state.aterramento === 'tn-c-s' || state.aterramento === 'tn-c') {
                svg += `<rect x="${bepX}" y="${bepY}" width="140" height="25" rx="3" fill="url(#copper)" stroke="#78350f" stroke-width="2"/>`;
                svg += `<text x="${bepX+70}" y="${bepY+17}" text-anchor="middle" font-size="12" font-weight="900" fill="#ffffff">BEP Principal</text>`;
                svg += drawWire(`M ${bepX+125} ${bepY+25} L ${bepX+125} ${bepY+40} L ${bPEx+15} ${bepY+40} L ${bPEx+15} ${bY1+20}`, C.pe);
                svg += drawWire(`M 250 135 L ${bepX} 135`, C.n);
                svg += `<text x="500" y="130" font-size="10" font-weight="900" fill="#3b82f6">JUMPER N-PE (${state.aterramento.toUpperCase()})</text>`;
            }

            // --- COMPONENTES DA ENTRADA ---
            svg += `<rect x="230" y="${yMain+30}" width="830" height="30" fill="url(#metal)" stroke="#64748b" rx="2"/>`;

            svg += drawBreaker3D(xG, yMain, numF, "GERAL", `C${state.geral.amp}`, "disj");
            if (state.hasDPS) svg += drawBreaker3D(xDPS, yMain, dpsP, "DPS", "275V", "dps");
            if (state.hasDR) svg += drawBreaker3D(xDR, yMain, drP, "IDR GERAL", "30mA", "dr");

            // Roteamento de Entrada (Conduítes do Topo)
            const entNx = 250, entPEx = 300;
            for(let f=0; f<numF; f++) svg += drawConduit(xG + (f*40) + 20, 100, `F${f+1}`);
            svg += drawConduit(entNx, 100, "N");
            svg += drawConduit(entPEx, 100, "PE");

            for(let f=0; f<numF; f++) {
                let px = xG + (f*40) + 20;
                svg += drawWire(`M ${px} 100 L ${px} ${yMain}`, phaseColors[f]);
            }
            svg += drawWire(`M ${entNx} 100 L ${entNx} 160`, C.n);
            svg += drawWire(`M ${entPEx} 100 L ${entPEx} 145 L ${state.aterramento.includes('tn-c') ? bepX+15 : bPEx+15} 145`, C.pe);


            // Roteamento Geral -> DPS -> DR (Laço Ortogonal Perfeito por cima)
            const gapY = yMain - 40; 
            for(let f=0; f<numF; f++) {
                let outX = xG + (f*40) + 20, drInX = xDR + (f*40) + 20, dpsInX = xDPS + (f*40) + 20;
                let dropY = yMain + 90 + 15 + (f*5); 
                
                let path = `M ${outX} ${yMain+90} L ${outX} ${dropY} L ${xG-30-(f*5)} ${dropY} L ${xG-30-(f*5)} ${gapY-(f*5)}`;
                
                if (state.hasDR) {
                    path += ` L ${drInX} ${gapY-(f*5)} L ${drInX} ${yMain}`;
                    if (state.hasDPS) {
                        svg += drawWire(`M ${dpsInX} ${gapY-(f*5)} L ${dpsInX} ${yMain}`, phaseColors[f]); 
                        svg += `<circle cx="${dpsInX}" cy="${gapY-(f*5)}" r="4" fill="${phaseColors[f]}"/>`;
                    }
                } else if (state.hasDPS) {
                    path += ` L ${dpsInX} ${gapY-(f*5)} L ${dpsInX} ${yMain}`;
                }
                svg += drawWire(path, phaseColors[f]);
            }

            // Roteamento Neutro (Entrada -> DR/DPS)
            if (hasMainN) {
                let drNInX = xDR + (numF*40) + 20, dpsNInX = xDPS + (numF*40) + 20, nGapY = gapY - (numF*5) - 5;
                if (state.hasDR) {
                    svg += drawWire(`M ${entNx} 160 L ${entNx} ${nGapY} L ${drNInX} ${nGapY} L ${drNInX} ${yMain}`, C.n);
                    if (state.hasDPS) {
                        svg += drawWire(`M ${dpsNInX} ${nGapY} L ${dpsNInX} ${yMain}`, C.n);
                        svg += `<circle cx="${dpsNInX}" cy="${nGapY}" r="4" fill="${C.n}"/>`;
                    }
                } else {
                    svg += drawWire(`M ${entNx} 160 L ${bNx+15} 160`, C.n); 
                    if (state.hasDPS) svg += drawWire(`M ${entNx} 160 L ${entNx} ${nGapY} L ${dpsNInX} ${nGapY} L ${dpsNInX} ${yMain}`, C.n);
                }
            }

            // DPS Descarga PE
            if (state.hasDPS) {
                let dpsBotY = yMain + 90, gBusY = dpsBotY + 20;
                let routeX = xDPS + (dpsP*40) + 10;
                svg += drawWire(`M ${xDPS+20} ${dpsBotY} L ${xDPS+20} ${gBusY} L ${routeX} ${gBusY} L ${routeX} ${allHolesPE[0]} L ${bPEx+15} ${allHolesPE[0]}`, C.pe);
                for(let i=1; i<dpsP; i++) {
                    let px = xDPS + (i*40) + 20;
                    svg += drawWire(`M ${px} ${dpsBotY} L ${px} ${gBusY}`, C.pe);
                    svg += `<circle cx="${px}" cy="${gBusY}" r="4" fill="${C.pe}"/>`;
                }
            }

            // TRONCO MESTRE FASES ESQUERDA
            const trunkX = 180;
            let srcX = state.hasDR ? xDR : xG;
            for(let f=0; f<numF; f++) {
                let px = srcX + (f*40) + 20, dropY = yMain + 90 + 35 + (f*6);
                if (state.layoutCompacto) {
                    svg += drawWire(`M ${px} ${yMain+90} L ${px} ${dropY} L ${trunkX+(f*10)} ${dropY} L ${trunkX+(f*10)} ${yMain-20+(f*5)}`, phaseColors[f]);
                } else if(actualUsedRails > 0) {
                    svg += drawWire(`M ${px} ${yMain+90} L ${px} ${dropY} L ${trunkX+(f*10)} ${dropY} L ${trunkX+(f*10)} ${trunkMaxY}`, phaseColors[f]);
                }
            }
            
            // Neutro IDR -> Barramento N2
            if (hasMainN && state.hasDR) { 
                let nOutX = srcX + (numF*40) + 20, nDropY = yMain + 90 + 35 + (numF*6);
                svg += drawWire(`M ${nOutX} ${yMain+90} L ${nOutX} ${nDropY} L ${trunkX-10} ${nDropY} L ${trunkX-10} ${bHolesN2[0]} L ${bNx+15} ${bHolesN2[0]}`, C.n);
            }

            // --- CIRCUITOS E ROTEAMENTO PARA CONDUÍTES ---
            let currT = state.layoutCompacto ? 0 : 1;
            let currentX = state.layoutCompacto ? ((state.hasDR ? xDR + (drP*40) : (state.hasDPS ? xDPS + (dpsP*40) : xG)) + 40) : 260;
            
            for (let i = 0; i < state.circuitos.length; i++) {
                let c = state.circuitos[i];
                let w = c.polos * 40;
                
                if (currentX + w > 1050) { currT++; currentX = 260; }
                if (currT >= state.numTrilhos && !state.layoutCompacto) break; 
                
                let cY = yMain + (currT * rowH); 

                // Barramento Pente
                if (currentX === 260 || (state.layoutCompacto && currT === 0 && i === 0)) {
                    if (currentX === 260) svg += `<rect x="230" y="${cY+30}" width="830" height="30" fill="url(#metal)" stroke="#64748b" rx="2"/>`;
                    
                    let railPoles = 0;
                    let lookaheadX = currentX;
                    for (let j = i; j < state.circuitos.length; j++) {
                        if (lookaheadX + (state.circuitos[j].polos*40) > 1050) break;
                        railPoles += state.circuitos[j].polos;
                        lookaheadX += (state.circuitos[j].polos*40) + 20;
                    }
                    let combWidth = railPoles * 40 + ((lookaheadX-currentX) - (railPoles*40));

                    for(let f=0; f<numF; f++) {
                        let tX = trunkX+(f*10);
                        svg += drawWire(`M ${tX} ${cY-20+(f*5)} L ${currentX+(f*40)+20} ${cY-20+(f*5)} L ${currentX+(f*40)+20} ${cY}`, phaseColors[f]);
                        svg += `<circle cx="${tX}" cy="${cY-20+(f*5)}" r="4" fill="${phaseColors[f]}"/>`;
                    }
                    svg += `<rect x="${currentX}" y="${cY-15}" width="${combWidth-20}" height="12" rx="2" fill="url(#brass)" stroke="#78350f"/>`;
                    svg += `<text x="${currentX+40}" y="${cY-20}" text-anchor="middle" font-size="8" font-weight="900" fill="#b45309">PENTE DE DISTR.</text>`;
                }

                svg += drawBreaker3D(currentX, cY, c.polos, `C${c.amp}`, null, "disj");
                
                // Conduíte da Carga 
                let bY = cY + 90; 
                let labelY = cY + 150; 
                let condX = currentX + (w/2);
                svg += drawConduit(condX, labelY, c.nome.substring(0,10));

                // Roteamento Ortogonal Limpo
                for(let p=0; p<c.polos; p++) {
                    let px = currentX + (p*40) + 20;
                    let tgtX = condX - 8 + (p*8);
                    svg += drawWire(`M ${px} ${bY} L ${px} ${bY+25} L ${tgtX} ${bY+25} L ${tgtX} ${labelY}`, phaseColors[p % numF]);
                }
                
                let holePE = allHolesPE[5 + i] || allHolesPE[allHolesPE.length-1]; 
                let tgtPE = condX + (c.polos*6);
                svg += drawWire(`M ${bPEx+15} ${holePE} L ${bPEx-30} ${holePE} L ${bPEx-30} ${labelY-15} L ${tgtPE} ${labelY-15} L ${tgtPE} ${labelY}`, C.pe);

                if (c.polos === 1) {
                    let holeN = (state.hasDR ? bHolesN2 : bHolesN1)[i % (state.hasDR ? bHolesN2.length : bHolesN1.length)] || allHolesN[allHolesN.length-1];
                    let tgtN = condX - 12;
                    svg += drawWire(`M ${bNx+15} ${holeN} L ${bNx+30} ${holeN} L ${bNx+30} ${labelY-10} L ${tgtN} ${labelY-10} L ${tgtN} ${labelY}`, C.n);
                }

                currentX += w + 20; 
            }

            // Legenda Inferior Tabela Profissional
            let legY = svgHeight - 40;
            svg += `<rect x="50" y="${legY-30}" width="1100" height="30" fill="#ffffff" stroke="#cbd5e1" rx="5"/>`;
            svg += `<text x="60" y="${legY-10}" font-size="11" font-weight="900" fill="#1e293b">LEGENDA TÉCNICA (BITOLAS):</text>`;
            let lx = 260;
            state.circuitos.forEach(c => {
                let str = `${c.nome}: ${c.cabo}mm²`;
                if(lx + str.length*7 > 1100) { lx = 260; legY += 15; }
                svg += `<text x="${lx}" y="${legY-10}" font-size="10" font-weight="bold" fill="#475569">${str}</text>`;
                lx += str.length*7 + 25;
            });

            svg += `</svg>`;
            return svg;
        }

        // --- GERAÇÃO UNIFILAR ---
        function generateUnifilarSVG() {
            const uniW = Math.max(1000, 300 + (state.circuitos.length * 100));
            const numF = state.sistema === 'mono' ? 1 : (state.sistema === 'bi' ? 2 : 3);
            let svg = `<svg viewBox="0 0 ${uniW} 800" class="w-full h-auto bg-white" xmlns="http://www.w3.org/2000/svg">${svgDefs}`;
            
            svg += `<rect x="50" y="20" width="900" height="70" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="5"/>`;
            svg += `<text x="500" y="45" text-anchor="middle" font-size="20" font-weight="900" fill="#1e293b">DIAGRAMA UNIFILAR - SISTEMA ${state.sistema.toUpperCase()} (NBR 5410)</text>`;
            svg += `<text x="500" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">RESPONSÁVEL: ${state.resp.toUpperCase()}   |   OBRA: ${state.obra.toUpperCase()}   |   ATERRAMENTO: ${state.aterramento.toUpperCase()}</text>`;

            let layX = 200, layY = 150;
            svg += `<line x1="${layX}" y1="${layY}" x2="${layX}" y2="${layY+100}" stroke="#000" stroke-width="2"/><text x="${layX}" y="${layY-10}" text-anchor="middle" font-weight="bold">REDE</text>`;
            
            svg += `<g transform="translate(${layX}, ${layY+30})">`;
            for(let i=0; i<numF; i++) svg += `<use href="#sym-fase" x="${i*8 - 8}"/>`;
            svg += `<use href="#sym-neutro" x="${numF*8}"/><use href="#sym-terra" x="${numF*8 + 8}"/><text x="40" y="5" font-size="12">${state.geral.cabo} mm²</text></g>`;

            layY += 100;
            svg += `<use href="#uni-breaker" x="${layX}" y="${layY}" /><text x="${layX+20}" y="${layY+15}" font-weight="900">Disj. Geral</text><text x="${layX+20}" y="${layY+30}" font-size="11">${numF}x ${state.geral.amp}A</text>`;
            layY += 50; svg += `<line x1="${layX}" y1="${layY-20}" x2="${layX}" y2="${layY+40}" stroke="#000" stroke-width="2"/>`;

            if (state.hasDPS) {
                svg += `<rect x="${layX-10}" y="${layY}" width="20" height="20" fill="none" stroke="#ef4444" stroke-width="2" /><text x="${layX+20}" y="${layY+15}" font-weight="900" fill="#dc2626">DPS (${numF+1}x 275V)</text>`;
                layY += 40; svg += `<line x1="${layX}" y1="${layY-20}" x2="${layX}" y2="${layY+40}" stroke="#000" stroke-width="2"/>`;
            }

            if (state.hasDR) {
                svg += `<rect x="${layX-15}" y="${layY}" width="30" height="20" rx="2" fill="none" stroke="#2563eb" stroke-width="2" /><text x="${layX+25}" y="${layY+15}" font-weight="900" fill="#1d4ed8">IDR GERAL ${numF+1}P (30mA)</text>`;
                layY += 40; svg += `<line x1="${layX}" y1="${layY-20}" x2="${layX}" y2="${layY+40}" stroke="#000" stroke-width="2"/>`;
            }

            let qdcEndX = layX + (state.circuitos.length * 100) + 100;
            svg += `<line x1="${layX}" y1="${layY}" x2="${qdcEndX}" y2="${layY}" stroke="#000" stroke-width="4"/><text x="${layX + (qdcEndX-layX)/2}" y="${layY-10}" text-anchor="middle" font-style="italic" font-weight="900">Barramento Principal (QDC)</text>`;

            state.circuitos.forEach((c, i) => {
                let cx = layX + 100 + (i * 100);
                svg += `<line x1="${cx}" y1="${layY}" x2="${cx}" y2="${layY+30}" stroke="#000" stroke-width="1.5"/><use href="#uni-breaker" x="${cx}" y="${layY+30}" /><text x="${cx+15}" y="${layY+45}" font-weight="900">C${i+1}</text><text x="${cx+15}" y="${layY+60}" font-size="11">${c.polos}x ${c.amp}A</text><line x1="${cx}" y1="${layY+60}" x2="${cx}" y2="${layY+140}" stroke="#000" stroke-width="1.5"/>`;
                
                svg += `<g transform="translate(${cx}, ${layY+100})">`;
                let off = 0;
                for(let p=0; p<c.polos; p++) { svg += `<use href="#sym-fase" x="${off}"/>`; off+=8; }
                if(c.polos === 1) { svg += `<use href="#sym-neutro" x="${off}"/>`; off+=8; } 
                svg += `<use href="#sym-terra" x="${off}"/><text x="25" y="5" font-size="11">${c.cabo} mm²</text></g>`;

                svg += `<rect x="${cx-40}" y="${layY+140}" width="80" height="25" fill="#f8fafc" stroke="#94a3b8" rx="2" /><text x="${cx}" y="${layY+157}" text-anchor="middle" font-size="10" font-weight="900">${c.nome}</text>`;
            });

            svg += `<rect x="50" y="700" width="220" height="80" fill="none" stroke="#cbd5e1" stroke-dasharray="4"/><text x="160" y="720" text-anchor="middle" font-size="11" font-weight="900">Legenda</text><use href="#sym-fase" x="70" y="740"/><text x="85" y="744" font-size="10">Fase</text><use href="#sym-neutro" x="150" y="740"/><text x="165" y="744" font-size="10">Neutro</text><use href="#sym-terra" x="70" y="765"/><text x="85" y="769" font-size="10">Terra (PE)</text><use href="#uni-breaker" x="150" y="755" transform="scale(0.8)"/><text x="165" y="769" font-size="10">Disjuntor</text></svg>`;
            return svg;
        }

        function renderApp() { renderFormControls(); switchTab(); }
        window.onload = renderApp;
    </script>
</body>
</html>
