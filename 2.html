<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador Industrial - Sistemas de Motores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --grid-color: rgba(255, 255, 255, 0.05);
            --bg-color: #0f172a;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            background-color: var(--bg-color);
            color: #f8fafc;
            touch-action: none; 
        }

        #workspace {
            position: relative;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 20px 20px;
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: grab;
        }
        
        #workspace:active {
            cursor: grabbing;
        }

        #canvas-pan-zoom {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
        }

        #wire-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            z-index: 10;
            overflow: visible;
        }

        .wire-path {
            fill: none;
            stroke: #3b82f6; 
            stroke-width: 4;
            stroke-linecap: square;
            stroke-linejoin: miter;
            pointer-events: stroke; 
            cursor: pointer;
            transition: stroke 0.2s, stroke-width 0.2s;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.5));
        }

        /* Melhoria: Feedback claro para exclusão de fios */
        .wire-path:hover {
            stroke: #ef4444 !important;
            stroke-width: 8 !important;
            stroke-dasharray: 8,4;
            filter: drop-shadow(0 0 4px #ef4444) !important;
        }

        /* EFEITO FIO ENERGIZADO (SIMULAÇÃO) */
        .wire-energized {
            stroke: #f59e0b !important;
            filter: drop-shadow(0 0 6px #fbbf24) !important;
            stroke-width: 5 !important;
        }

        .component-node {
            position: absolute;
            border-radius: 8px;
            user-select: none;
            touch-action: none;
            z-index: 20;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.25);
            transition: box-shadow 0.2s, border-color 0.2s;
            border: 2px solid transparent;
        }

        .component-node.dragging {
            z-index: 50;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.8), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            opacity: 0.9;
        }
        
        /* EFEITO COMPONENTE LIGADO/ATIVO (SIMULAÇÃO) */
        .component-active-glow {
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.5), inset 0 0 10px rgba(251, 191, 36, 0.3) !important;
            border-color: #fbbf24 !important;
        }
        .component-active-glow .component-header {
            background: linear-gradient(180deg, #b45309 0%, #78350f 100%) !important;
            border-color: #f59e0b !important;
        }

        /* EFEITO ROTAÇÃO MOTOR (SIMULAÇÃO) */
        @keyframes spinCW { from { transform: rotate(0deg) translate(-50%, -50%); } to { transform: rotate(360deg) translate(-50%, -50%); } }
        @keyframes spinCCW { from { transform: rotate(0deg) translate(-50%, -50%); } to { transform: rotate(-360deg) translate(-50%, -50%); } }
        
        .sim-gear {
            transform-origin: top left;
        }
        .spin-cw {
            animation: spinCW 1.5s linear infinite;
            color: #4ade80 !important;
            filter: drop-shadow(0 0 8px #22c55e);
        }
        .spin-ccw {
            animation: spinCCW 1.5s linear infinite;
            color: #f87171 !important;
            filter: drop-shadow(0 0 8px #ef4444);
        }

        .component-header {
            background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
            padding: 4px 8px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #f1f5f9;
            border-radius: 6px 6px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #475569;
            border-bottom: none;
            cursor: grab;
            transition: all 0.2s;
        }

        .component-header:active {
            cursor: grabbing;
        }

        .component-body {
            position: relative;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 0 0 6px 6px;
        }
        
        .component-body svg {
            display: block;
            border-radius: 0 0 6px 6px;
        }

        .ports-container {
            display: flex;
            justify-content: space-evenly;
            width: 100%;
            position: absolute;
            z-index: 30;
            left: 0;
        }
        
        .ports-container.top { top: -6px; }
        .ports-container.bottom { bottom: -6px; }
        
        .inset-ports.top { top: 12px; }
        .inset-ports.bottom { bottom: 12px; }

        .port-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .port {
            width: 14px;
            height: 14px;
            background-color: #cbd5e1;
            border: 1px solid #334155;
            border-radius: 50%;
            cursor: crosshair;
            position: relative;
            transition: all 0.2s;
            background-image: 
                linear-gradient(45deg, transparent 42%, #475569 45%, #475569 55%, transparent 58%),
                linear-gradient(-45deg, transparent 42%, #475569 45%, #475569 55%, transparent 58%);
            box-shadow: inset 0 -2px 4px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.8), 0 1px 2px rgba(0,0,0,0.5);
        }

        .port:hover, .port.active {
            background-color: #fbbf24;
            transform: scale(1.3);
            background-image: none; 
            box-shadow: 0 0 10px #f59e0b, inset 0 -1px 2px rgba(0,0,0,0.4);
            z-index: 40;
        }

        .port-label {
            position: absolute;
            font-size: 0.55rem;
            font-weight: 700;
            color: #0f172a;
            background: rgba(241, 245, 249, 0.9);
            padding: 1px 3px;
            border-radius: 3px;
            border: 1px solid #94a3b8;
            pointer-events: none;
            white-space: nowrap;
            z-index: 35;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            font-family: 'JetBrains Mono', monospace;
        }
        .ports-container.top .port-label { top: -18px; }
        .ports-container.bottom .port-label { bottom: -18px; }
        
        .inset-ports.top .port-label { top: -14px; background: transparent; color: #fff; border: none; text-shadow: 0 1px 2px #000;}
        .inset-ports.bottom .port-label { bottom: -14px; background: transparent; color: #fff; border: none; text-shadow: 0 1px 2px #000;}

        .sidebar-item {
            transition: transform 0.2s, background-color 0.2s;
        }
        .sidebar-item:hover {
            transform: translateY(-2px);
            background-color: #334155;
        }
        
        #sidebar {
            transition: width 0.3s ease, min-width 0.3s ease, opacity 0.2s;
        }
        #sidebar.collapsed {
            width: 0;
            min-width: 0;
            overflow: hidden;
            opacity: 0;
            border-right: none;
        }

        .canvas-toolbar {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(4px);
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 4px;
            display: flex;
            gap: 4px;
            z-index: 50;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .canvas-toolbar button {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            color: #cbd5e1;
            transition: all 0.2s;
        }
        
        .canvas-toolbar button:hover {
            background: #334155;
            color: #fff;
        }

        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .toast {
            background: #1e293b;
            border-left: 4px solid #3b82f6;
            color: white;
            padding: 12px 20px;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease-out forwards;
            font-size: 0.875rem;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        .digital-font { font-family: 'JetBrains Mono', monospace; font-weight: bold; }
        
        /* Estilos do Modal da Apostila */
        #manual-modal {
    <div id="tutorial-modal" class="hidden">
        <div class="bg-slate-900 border border-emerald-600 rounded-xl w-full h-full flex flex-col shadow-2xl overflow-hidden">
            <div id="tutorial-modal-header" class="p-4 border-b border-emerald-700 flex justify-between items-center bg-slate-950 shrink-0 select-none cursor-move">
                <h2 class="text-xl font-bold text-white flex items-center gap-2"><i class="fa-solid fa-plug-circle-bolt text-emerald-500"></i> Tutorial Completo de Ligações Avançadas</h2>
                <button onclick="closeTutorial()" class="text-slate-400 hover:text-red-400 transition-colors p-2 text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-6 bg-slate-900 text-slate-300 leading-relaxed space-y-8" id="tutorial-content">
                
                <section>
                    <h3 class="text-2xl font-bold text-emerald-400 border-b border-emerald-800 pb-2 mb-4">1. DISJUNTORES, RELÉS E PROTEÇÃO</h3>
                    <p class="mb-3">A proteção é o primeiro passo em qualquer painel elétrico. Siga rigorosamente a ordem de montagem:</p>
                    <ul class="list-disc pl-6 space-y-2">
                        <li><strong>Disjuntor Termomagnético (Tripolar/Motor):</strong> Deve receber a alimentação principal (L1, L2, L3) diretamente do barramento nos seus bornes superiores (1, 3, 5). As saídas inferiores (2, 4, 6) alimentam o próximo equipamento de força.</li>
                        <li><strong>Relé Térmico (Sobrecarga):</strong> É acoplado fisicamente ou eletricamente logo abaixo do contator. Ligue as saídas do contator (2, 4, 6) nas entradas do relé (1, 3, 5). <strong>Ligação de Comando:</strong> Utilize os contatos auxiliares 95 e 96 (Normalmente Fechado - NF) em série no início do circuito de comando. Se o motor aquecer excessivamente, o contato 95-96 abre, cortando a energia de toda a lógica e protegendo o motor.</li>
                    </ul>
                </section>

                <section>
                    <h3 class="text-2xl font-bold text-emerald-400 border-b border-emerald-800 pb-2 mb-4">2. CONTATORES E COMANDOS</h3>
                    <p class="mb-3">O Contator é a chave magnética que liga cargas pesadas através de um sinal de baixa potência.</p>
                    <ul class="list-disc pl-6 space-y-2">
                        <li><strong>Circuito de Força:</strong> Entradas L1, L2, L3 recebem energia; saídas T1, T2, T3 vão para a carga (motor).</li>
                        <li><strong>Circuito de Comando (Bobina):</strong> Os bornes A1 e A2 acionam o eletroímã interno. Conecte a fase (ou +24V) vinda da lógica dos botões no A1. O borne A2 deve ser ligado diretamente ao Neutro (ou 0V).</li>
                        <li><strong>Contatos Auxiliares:</strong> O borne 13-14 (NA) é usado para o "Contato de Selo", enquanto os contatos 21-22 (NF) são usados para intertravamento e sinalização de emergência.</li>
                    </ul>
                </section>

                <section>
                    <h3 class="text-2xl font-bold text-emerald-400 border-b border-emerald-800 pb-2 mb-4">3. ILUMINAÇÃO E SINALIZAÇÕES (Passo a Passo)</h3>
                    <p class="mb-3">A sinalização visual e de emergência é vital. O Contator possui contatos auxiliares NA (13-14) e NF (21-22) exclusivos para essas lógicas.</p>
                    <ul class="list-disc pl-6 space-y-4">
                        <li class="bg-slate-800 p-3 rounded border border-slate-700"><strong>Sinalização de Motor Rodando (Sinaleiro Verde - NA):</strong> 
                            <br>1. Puxe um fio da fase (+24V ou L1 de comando) para o borne <strong>13 (NA)</strong> do Contator.
                            <br>2. Do borne <strong>14</strong> do Contator, leve o fio para a entrada <strong>X1</strong> do Sinaleiro Verde.
                            <br>3. Ligue o borne <strong>X2</strong> do sinaleiro no 0V/Neutro. 
                            <br><em class="text-emerald-300">Resultado:</em> Quando o contator atraca (liga o motor), o contato 13-14 fecha e a luz verde acende indicando operação normal.
                        </li>
                        <li class="bg-slate-800 p-3 rounded border border-slate-700"><strong>Sinalização de Motor Parado / Emergência (Sinaleiro Vermelho - NF):</strong> 
                            <br>1. Puxe um fio da fase (+24V ou L1 de comando) DIRETO para o borne <strong>21 (NF)</strong> do Contator.
                            <br>2. Da saída <strong>22 (NF)</strong> do Contator, leve até o borne <strong>X1</strong> do Sinaleiro Vermelho ou Lâmpada de Alerta.
                            <br>3. Conecte o <strong>X2</strong> ao 0V/Neutro.
                            <br><em class="text-emerald-300">Resultado:</em> O contato 21-22 conduz energia apenas quando a bobina do contator está DESLIGADA. A luz vermelha ficará acesa indicando "PARADO" ou "EMERGÊNCIA". Ao ligar o motor, o contator atraca, o contato 21-22 ABRE, e a luz apaga.
                        </li>
                        <li class="bg-slate-800 p-3 rounded border border-slate-700"><strong>Iluminação Simples de Painel:</strong> 
                            <br>Puxe a fase para a entrada de um <strong>Interruptor Simples</strong>. Da saída do interruptor, vá direto para o borne <strong>X1</strong> de uma Lâmpada Comum de Iluminação (sinaleiro branco/amarelo). O <strong>X2</strong> vai para o Neutro.
                        </li>
                        <li class="bg-slate-800 p-3 rounded border border-slate-700"><strong>Sinalização de Falha Térmica (Sirene / Sinaleiro Amarelo):</strong> 
                            <br>1. Leve energia direta para o borne <strong>97 (NA)</strong> do Relé Térmico.
                            <br>2. Da saída <strong>98</strong>, ligue no <strong>X1</strong> da Sirene ou Sinaleiro Amarelo.
                            <br>3. Conecte o <strong>X2</strong> ao Neutro.
                            <br><em class="text-emerald-300">Resultado:</em> Se houver sobrecarga, o relé desarma o circuito (abrindo o 95-96) e IMEDIATAMENTE fecha o 97-98, ativando a luz amarela e/ou tocando a sirene de alarme de falha na máquina.
                        </li>
                    </ul>
                </section>

                <section>
                    <h3 class="text-2xl font-bold text-emerald-400 border-b border-emerald-800 pb-2 mb-4">4. CONTATO DE SELO (RETENÇÃO)</h3>
                    <p class="mb-3">É o circuito lógico mais essencial. Ele substitui o dedo do operador no botão de ligar (que é apenas um pulso).</p>
                    <ol class="list-decimal pl-6 space-y-2">
                        <li>Puxe a energia da fase de comando (após o relé térmico 95-96) e ligue na entrada <strong>11 do Botão NF (Vermelho - Desliga)</strong>.</li>
                        <li>Da saída <strong>12 do Botão NF</strong>, puxe DOIS fios paralelos:
                            <br>- O primeiro fio vai para a entrada <strong>13 do Botão NA (Verde - Liga)</strong>.
                            <br>- O segundo fio vai para a entrada <strong>13 (NA Auxiliar) do Contator K1</strong>.
                        </li>
                        <li>Na saída <strong>14 do Botão NA</strong>, puxe um fio que se unirá com a saída <strong>14 do Contator K1</strong>.</li>
                        <li>Desta união (nó), conecte o fio no borne <strong>A1 (Bobina do Contator K1)</strong>. O borne A2 vai para o Neutro/0V.</li>
                    </ol>
                    <p class="mt-3 text-emerald-200"><strong>Resultado:</strong> O pulso no botão Verde energiza A1. O contator atraca e fecha seu próprio contato 13-14, criando uma rota alternativa para a corrente. Ao soltar o botão, a energia continua passando pelo 13-14, mantendo a bobina ligada.</p>
                </section>

                <section>
                    <h3 class="text-2xl font-bold text-emerald-400 border-b border-emerald-800 pb-2 mb-4">5. PARTIDA DIRETA E MÁQUINAS</h3>
                    <p class="mb-3">Ligação completa para acionar um motor elétrico de indução trifásico em sua tensão plena (aplicável a motores menores).</p>
                    <ul class="list-disc pl-6 space-y-2">
                        <li><strong>Potência:</strong> Barramento 3~ 380V -> Entradas do Disjuntor-Motor -> Saídas para Contator K1 (L1, L2, L3). Saídas de K1 (T1, T2, T3) -> Motor Trifásico (U1, V1, W1). O PE (Terra) vai na carcaça.</li>
                        <li><strong>Comando:</strong> O mesmo circuito de "Contato de Selo" descrito no item 4, controlando a bobina A1 do contator K1.</li>
                    </ul>
                </section>

                <section>
                    <h3 class="text-2xl font-bold text-emerald-400 border-b border-emerald-800 pb-2 mb-4">6. LIGAÇÃO ESTRELA-TRIÂNGULO (Avançado)</h3>
                    <p class="mb-3">Método utilizado para amenizar o pico de corrente durante a partida do motor. O motor deve ter obrigatoriamente 6 terminais expostos (U1, V1, W1 e W2, U2, V2) e suportar a tensão de fechamento em triângulo.</p>
                    <ul class="list-disc pl-6 space-y-2">
                        <li><strong>Componentes Necessários:</strong> 3 Contatores (K1 Principal, K2 Triângulo, K3 Estrela) e 1 Relé Temporizador.</li>
                        <li><strong>Força (Potência):</strong> 
                            <br>A rede (L1, L2, L3) alimenta simultaneamente as entradas de K1 e K2.
                            <br>As saídas de K1 ligam em U1, V1, W1 do motor.
                            <br>As saídas de K2 ligam em W2, U2, V2 do motor.
                            <br>O Contator K3 (Estrela) possui suas saídas (T1, T2, T3) curto-circuitadas entre si com fios jumpers. As entradas de K3 (L1, L2, L3) são conectadas junto às saídas de K2 (ou aos cabos W2, U2, V2).
                        </li>
                        <li><strong>Comando e Temporização:</strong>
                            <br>O pulso no botão Liga aciona K1, K3 e o Relé Temporizador simultaneamente.
                            <br>Neste primeiro estágio, K1 envia tensão e K3 curto-circuita a outra ponta, formando a <strong>ligação Estrela</strong> (Tensão por bobina reduzida em raiz de 3).
                            <br>Após o tempo configurado (ex: 5 segundos), o Temporizador atua. Seu contato abre, desenergizando K3. Logo em seguida, outro contato fecha, energizando K2.
                            <br>Agora, K1 e K2 estão atracados, injetando a fase correta nas pontas opostas das bobinas, fechando o motor em <strong>Triângulo</strong> e aplicando tensão plena.
                        </li>
                        <li><strong class="text-red-400">Intertravamento Vital:</strong> No circuito de comando, a energia que vai para a bobina de K3 DEVE passar por um contato Fechado (NF 21-22) de K2. A energia de K2 DEVE passar por um contato NF 21-22 de K3. Isso impede que os dois atraquem juntos, o que causaria um curto-circuito trifásico explosivo.</li>
                    </ul>
                </section>

                <section>
                    <h3 class="text-2xl font-bold text-emerald-400 border-b border-emerald-800 pb-2 mb-4">7. INVERSOR DE FREQUÊNCIA E SOFT-STARTER</h3>
                    <p class="mb-3">Equipamentos eletrônicos modernos que substituem chaves de partida pesadas, oferecendo controle total de velocidade, rampa de aceleração e frenagem suave.</p>
                    <ul class="list-disc pl-6 space-y-2">
                        <li><strong>Força:</strong> As fases da rede (R, S, T) vão direto do disjuntor para os bornes de entrada do Inversor. As saídas do inversor (U, V, W) vão DIRETAMENTE para o motor. <strong>NUNCA</strong> coloque contatores ou chaves secionadoras entre o inversor e o motor para interromper carga, há risco severo de queima do IGBT.</li>
                        <li><strong>Comando a 2 Fios:</strong> Utilize a fonte interna de 24V do próprio inversor. Ligue o +24V numa Chave Seletora AUTO/MAN. O retorno (sinal) da chave conecte no terminal DI1 (Entrada Digital 1). Parametrize o inversor para DI1 atuar como Gira/Para (RUN/STOP). Para reverter rotação, ligue outra chave em DI2.</li>
                    </ul>
                </section>

                <section>
                    <h3 class="text-2xl font-bold text-emerald-400 border-b border-emerald-800 pb-2 mb-4">8. AUTOMAÇÃO: CLP, SENSORES E CONTROLE AVANÇADO</h3>
                    <p class="mb-3">O Controlador Lógico Programável (CLP) é o cérebro da automação industrial pesada. Ele coordena a operação de todos os motores, contatores e sinaleiros através de sensores industriais em rede de baixa tensão (24VDC).</p>
                    <ul class="list-disc pl-6 space-y-4">
                        <li class="bg-slate-800 p-3 rounded border border-slate-700"><strong>Alimentação Segura:</strong> 
                            <br>Conecte uma Fonte 24V DC nos bornes <strong>L+ (Positivo)</strong> e <strong>M (Negativo/0V)</strong> do CLP para ligar a CPU principal. Todo o painel de automação opera em 24V, isolando o operador do risco de choque elétrico.
                        </li>
                        <li class="bg-slate-800 p-3 rounded border border-slate-700"><strong>Ligar Entradas (Sensores de Automação Industriais):</strong>
                            <br>- <em>Sensor Indutivo PNP:</em> Ligue o +24V e 0V no corpo do sensor. A saída dele (OUT) manda um pulso de 24V positivo quando detecta a aproximação de metal na esteira. Ligue esse fio <strong>OUT</strong> no borne <strong>I0.0</strong> do CLP.
                            <br>- <em>Boia de Nível / Pressostato:</em> Jogue +24V no borne 11 do sensor de nível do tanque. A saída 14 (NA) você liga no borne <strong>I0.1</strong> do CLP. Quando a água encher e levantar a boia, o CLP recebe o pulso de nível alto.
                        </li>
                        <li class="bg-slate-800 p-3 rounded border border-slate-700"><strong>Ligar Saídas (Atuadores e Lâmpadas via CLP):</strong>
                            <br>O software interno varre as entradas e, se a lógica de programa permitir, ele emite 24V nas portas de saída (Q).

                    <rect x="10" y="10" width="30" height="50" fill="#3b82f6" rx="15" stroke="#1e40af" stroke-width="2"/>
                    <circle cx="25" cy="50" r="5" fill="#1e40af"/>
                    <text x="25" y="35" font-size="8" font-weight="bold" fill="#fff" text-anchor="middle">BOIA</text>
                </svg>`
            },
            {
                type: 'pressostato', name: 'Pressostato', category: 'COMANDO',
                width: 50, height: 70,
                inputs: ['11'], outputs: ['12', '14'],
                portStyle: 'edge',
                svg: `
                <svg viewBox="0 0 50 70" width="100%" height="100%">
                    <rect x="5" y="5" width="40" height="40" fill="#cbd5e1" stroke="#64748b" stroke-width="2" rx="4"/>
                    <circle cx="25" cy="25" r="12" fill="#fff" stroke="#94a3b8"/>
                    <rect x="20" y="45" width="10" height="20" fill="#94a3b8" />
                    <text x="25" y="28" font-size="8" font-weight="bold" fill="#64748b" text-anchor="middle">P</text>
                </svg>`
            }
        ];

        let nodes = []; 
        let wires = []; 
        let nodeIdCounter = 0;
        let wireIdCounter = 0;
        let drawingWire = null; 
        
        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isPanning = false;
        let startPanX, startPanY;
        
        const workspace = document.getElementById('workspace');
        const canvasPanZoom = document.getElementById('canvas-pan-zoom');
        const wireLayer = document.getElementById('wire-layer');
        const drawingLayer = document.getElementById('drawing-layer');
        const drawingWirePath = document.getElementById('drawing-wire');
        const componentsContainer = document.getElementById('components-container');

        function updateTransform() {
            canvasPanZoom.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            updateAllWires(); 
        }

        workspace.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomSensitivity = 0.1;
            const delta = e.deltaY > 0 ? -1 : 1;
            const newScale = Math.min(Math.max(0.4, scale + delta * zoomSensitivity), 2.5);
            
            const rect = workspace.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            panX = mouseX - (mouseX - panX) * (newScale / scale);
            panY = mouseY - (mouseY - panY) * (newScale / scale);
            
            scale = newScale;
            updateTransform();
        }, { passive: false });

        workspace.addEventListener('pointerdown', (e) => {
            if (e.button === 1 || (e.button === 0 && e.shiftKey)) { 
                isPanning = true;
                startPanX = e.clientX - panX;
                startPanY = e.clientY - panY;
                workspace.style.cursor = 'grabbing';
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (isPanning) {
                panX = e.clientX - startPanX;
                panY = e.clientY - startPanY;
                updateTransform();
            }
        });

        window.addEventListener('pointerup', () => {
            if (isPanning) {
                isPanning = false;
                workspace.style.cursor = 'grab';
            }
        });

        let initialPinchDistance = null;
        let initialScale = 1;
        
        workspace.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                isPanning = false; 
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialScale = scale;
            } else if (e.touches.length === 1) {
                if (e.target === workspace || e.target === wireLayer || e.target === canvasPanZoom || e.target.id === 'welcome-text') {
                    isPanning = true;
                    startPanX = e.touches[0].clientX - panX;
                    startPanY = e.touches[0].clientY - panY;
                }
            }
        }, {passive: false});

        workspace.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDistance) {
                e.preventDefault();
                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const zoomFactor = currentDistance / initialPinchDistance;
                let newScale = Math.min(Math.max(0.4, initialScale * zoomFactor), 2.5);
                
                const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                const rect = workspace.getBoundingClientRect();
                const mouseX = centerX - rect.left;
                const mouseY = centerY - rect.top;
                
                panX = mouseX - (mouseX - panX) * (newScale / scale);
                panY = mouseY - (mouseY - panY) * (newScale / scale);
                
                scale = newScale;
                updateTransform();
            } else if (e.touches.length === 1 && isPanning) {
                e.preventDefault();
                panX = e.touches[0].clientX - startPanX;
                panY = e.touches[0].clientY - startPanY;
                updateTransform();
            }
        }, {passive: false});

        workspace.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialPinchDistance = null;
            }
            if (e.touches.length === 0) {
                isPanning = false;
            }
        });

        function zoomIn() { scale = Math.min(scale + 0.2, 2.5); updateTransform(); }
        function zoomOut() { scale = Math.max(scale - 0.2, 0.4); updateTransform(); }
        function resetZoomPan() { scale = 1; panX = 0; panY = 0; updateTransform(); }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
        }

        function initPalette() {
            const palette = document.getElementById('component-palette');
            const categories = {};
            
            componentLibrary.forEach(comp => {
                if(!categories[comp.category]) categories[comp.category] = [];
                categories[comp.category].push(comp);
            });

            for(let cat in categories) {
                const title = document.createElement('div');
                title.className = 'text-[10px] font-bold text-slate-500 mt-4 mb-2';
                title.innerText = cat;
                palette.appendChild(title);

                categories[cat].forEach(comp => {
                    const item = document.createElement('div');
                    item.className = 'sidebar-item bg-slate-800 border border-slate-700 rounded-lg p-2 flex items-center gap-3 cursor-grab text-white select-none';
                    item.draggable = true;
                    item.dataset.type = comp.type;
                    
                    const svgWrap = document.createElement('div');
                    svgWrap.className = 'w-10 h-10 flex items-center justify-center shrink-0';
                    let miniSvg = comp.svg.replace('width="100%"', 'width="30"').replace('height="100%"', 'height="30"');
                    svgWrap.innerHTML = miniSvg;
                    
                    const nameWrap = document.createElement('div');
                    nameWrap.className = 'text-xs font-medium leading-tight';
                    nameWrap.innerText = comp.name;

                    item.appendChild(svgWrap);
                    item.appendChild(nameWrap);
                    
                    item.addEventListener('dragstart', (e) => {
                        e.dataTransfer.setData('text/plain', comp.type);
                        e.dataTransfer.setData('offsetX', e.offsetX);
                        e.dataTransfer.setData('offsetY', e.offsetY);
                    });
                    
                    item.addEventListener('touchstart', handleTouchStartPalette, {passive: false});
                    palette.appendChild(item);
                });
            }
        }

        workspace.addEventListener('dragover', (e) => {
            e.preventDefault(); 
            e.dataTransfer.dropEffect = 'copy';
        });

        workspace.addEventListener('drop', (e) => {
            e.preventDefault();
            const type = e.dataTransfer.getData('text/plain');
            if (type) {
                document.getElementById('welcome-text').style.display = 'none';
                const rect = workspace.getBoundingClientRect();
                
                const x = (e.clientX - rect.left - panX) / scale - 35;
                const y = (e.clientY - rect.top - panY) / scale - 20;
                
                createComponent(type, x, y);
            }
        });

        let touchDragType = null;
        let touchDragElement = null;
        let dragTimeout;
        let isPaletteScrolling = false;
        let paletteStartY = 0;

        function handleTouchStartPalette(e) {
            touchDragType = e.currentTarget.dataset.type;
            const touch = e.touches[0];
            paletteStartY = touch.clientY;
            isPaletteScrolling = false;
            
            const currentTarget = e.currentTarget;
            
            dragTimeout = setTimeout(() => {
                if(!isPaletteScrolling) {
                    touchDragElement = currentTarget.cloneNode(true);
                    touchDragElement.style.position = 'fixed';
                    touchDragElement.style.opacity = '0.7';
                    touchDragElement.style.pointerEvents = 'none';
                    touchDragElement.style.zIndex = '9999';
                    document.body.appendChild(touchDragElement);
                    moveTouchGhost(touch.clientX, touch.clientY);
                }
            }, 300);
            
            document.addEventListener('touchmove', handleTouchMovePalette, {passive: false});
            document.addEventListener('touchend', handleTouchEndPalette);
        }

        function moveTouchGhost(x, y) {
            if(touchDragElement) {
                touchDragElement.style.left = (x - 20) + 'px';
                touchDragElement.style.top = (y - 20) + 'px';
            }
        }

        function handleTouchMovePalette(e) {
            const touch = e.touches[0];
            if (Math.abs(touch.clientY - paletteStartY) > 10) {
                isPaletteScrolling = true;
                clearTimeout(dragTimeout);
            }
            if(touchDragElement) {
                e.preventDefault(); 
                moveTouchGhost(touch.clientX, touch.clientY);
            }
        }

        function handleTouchEndPalette(e) {
            clearTimeout(dragTimeout);
            document.removeEventListener('touchmove', handleTouchMovePalette);
            document.removeEventListener('touchend', handleTouchEndPalette);
            
            if (touchDragElement) {
                touchDragElement.remove();
                touchDragElement = null;
            }
            
            if (touchDragType && !isPaletteScrolling) {
                const touch = e.changedTouches[0];
                const rect = workspace.getBoundingClientRect();
                
                if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
                    touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                    
                    document.getElementById('welcome-text').style.display = 'none';
                    const x = (touch.clientX - rect.left - panX) / scale - 35;
                    const y = (touch.clientY - rect.top - panY) / scale - 20;
                    createComponent(touchDragType, x, y);
                }
            }
            touchDragType = null;
            isPaletteScrolling = false;
        }

        function createComponent(type, x, y, idForce = null) {
            const template = componentLibrary.find(c => c.type === type);
            if (!template) return null;

            let id;
            if (idForce) {
                id = idForce;
                const num = parseInt(id.split('_')[1]);
                if (num >= nodeIdCounter) nodeIdCounter = num;
            } else {
                nodeIdCounter++;
                id = 'node_' + nodeIdCounter;
            }

            const el = document.createElement('div');
            el.className = 'component-node pointer-events-auto';
            el.id = id;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.width = template.width + 'px';
            el.dataset.simActive = "false";
            
            const header = document.createElement('div');
            header.className = 'component-header';
            header.innerHTML = `
                <span class="truncate">${template.name}</span>
                <button class="text-slate-400 hover:text-red-400 ml-2" title="Remover" onclick="deleteComponent('${id}')">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            `;

            setupNodeDragging(header, el, id);

            const body = document.createElement('div');
            body.className = 'component-body';
            body.style.width = template.width + 'px';
            body.style.height = template.height + 'px';
            body.innerHTML = template.svg;

            const portClass = template.portStyle === 'inset' ? 'inset-ports' : 'ports-container';
            
            const inputsContainer = document.createElement('div');
            inputsContainer.className = `ports-container ${portClass} top`;
            template.inputs.forEach(portName => {
                inputsContainer.appendChild(createPortElement(id, portName, 'in'));
            });

            const outputsContainer = document.createElement('div');
            outputsContainer.className = `ports-container ${portClass} bottom`;
            template.outputs.forEach(portName => {
                outputsContainer.appendChild(createPortElement(id, portName, 'out'));
            });

            el.appendChild(header);
            el.appendChild(body);
            if(template.inputs.length > 0) el.appendChild(inputsContainer);
            if(template.outputs.length > 0) el.appendChild(outputsContainer);

            componentsContainer.appendChild(el);

            nodes.push({ id, type, el, x, y });
            
            if(!idForce) showToast(`${template.name} adicionado.`, 'success');
            return id;
        }

        function createPortElement(nodeId, portName, type) {
            const wrapper = document.createElement('div');
            wrapper.className = 'port-wrapper';

            const port = document.createElement('div');
            port.className = 'port';
            port.dataset.node = nodeId;
            port.dataset.port = portName;
            port.dataset.type = type;

            const label = document.createElement('div');
            label.className = 'port-label';
            label.innerText = portName;

            wrapper.appendChild(port);
            wrapper.appendChild(label);
            port.addEventListener('pointerdown', handlePortClick);
            
            return wrapper;
        }

        function handlePortClick(e) {
            e.stopPropagation();
            if(isPanning) return; 

            const portEl = e.target;
            const nodeId = portEl.dataset.node;
            const portName = portEl.dataset.port;

            if (!drawingWire) {
                drawingWire = { sourceNode: nodeId, sourcePort: portName, sourceEl: portEl };
                portEl.classList.add('active');
                
                drawingLayer.style.display = 'block';
                updateDrawingWire(e.clientX, e.clientY);
                
                document.addEventListener('pointermove', onPointerMoveDraw);
                setTimeout(() => { workspace.addEventListener('pointerdown', cancelDrawing); }, 10);
            } else {
                if (drawingWire.sourceNode === nodeId && drawingWire.sourcePort === portName) {
                    cancelDrawing();
                } else {
                    createWire(drawingWire.sourceNode, drawingWire.sourcePort, nodeId, portName);
                    cancelDrawing();
                }
            }
        }

        function onPointerMoveDraw(e) {
            updateDrawingWire(e.clientX, e.clientY);
        }

        function updateDrawingWire(clientX, clientY) {
            if (!drawingWire) return;
            const startPos = getPortCenter(drawingWire.sourceEl);
            
            const panZoomRect = canvasPanZoom.getBoundingClientRect();
            const mouseX = (clientX - panZoomRect.left) / scale;
            const mouseY = (clientY - panZoomRect.top) / scale;
            
            drawingWirePath.setAttribute('d', getWirePath(startPos.x, startPos.y, mouseX, mouseY));
        }

        function cancelDrawing(e) {
            if(e && e.target.classList.contains('port')) return;
            
            if(drawingWire && drawingWire.sourceEl) drawingWire.sourceEl.classList.remove('active');
            drawingWire = null;
            drawingLayer.style.display = 'none';
            document.removeEventListener('pointermove', onPointerMoveDraw);
            workspace.removeEventListener('pointerdown', cancelDrawing);
        }

        function createWire(srcNode, srcPort, tgtNode, tgtPort, idForce = null) {
            const exists = wires.find(w => 
                (w.sourceNode === srcNode && w.sourcePort === srcPort && w.targetNode === tgtNode && w.targetPort === tgtPort) ||
                (w.sourceNode === tgtNode && w.sourcePort === tgtPort && w.targetNode === srcNode && w.targetPort === srcPort)
            );
            
            if(exists) {
                if(!idForce) showToast("Esses bornes já estão conectados.", 'error');
                return;
            }

            let wireId;
            if(idForce) {
                wireId = idForce;
                const num = parseInt(wireId.split('_')[1]);
                if (num >= wireIdCounter) wireIdCounter = num;
            } else {
                wireIdCounter++;
                wireId = 'wire_' + wireIdCounter;
            }
            
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.id = wireId;
            path.setAttribute('class', 'wire-path');
            
            path.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteWire(wireId);
            });

            wireLayer.appendChild(path);

            const wireObj = { id: wireId, sourceNode: srcNode, sourcePort: srcPort, targetNode: tgtNode, targetPort: tgtPort, pathEl: path, energized: false };
            wires.push(wireObj);
            
            updateWirePath(wireObj);
            if(!idForce) showToast("Conexão estabelecida.", 'success');
        }

        function getPortCenter(portEl) {
            const rect = portEl.getBoundingClientRect();
            const panZoomRect = canvasPanZoom.getBoundingClientRect();
            
            return {
                x: (rect.left - panZoomRect.left + (rect.width / 2)) / scale,
                y: (rect.top - panZoomRect.top + (rect.height / 2)) / scale
            };
        }

        /* REGRA RÍGIDA RESPEITADA - ALTERANDO O ROUTING PARA ORTOGONAL (ESCADA) */
        function getWirePath(x1, y1, x2, y2) {
            const midY = (y1 + y2) / 2;
            return `M ${x1} ${y1} L ${x1} ${midY} L ${x2} ${midY} L ${x2} ${y2}`;
        }

        function updateWirePath(wire) {
            const srcSelector = `.port[data-node="${wire.sourceNode}"][data-port="${wire.sourcePort}"]`;
            const tgtSelector = `.port[data-node="${wire.targetNode}"][data-port="${wire.targetPort}"]`;
            
            const srcEl = document.querySelector(srcSelector);
            const tgtEl = document.querySelector(tgtSelector);
            
            if (srcEl && tgtEl) {
                const p1 = getPortCenter(srcEl);
                const p2 = getPortCenter(tgtEl);
                wire.pathEl.setAttribute('d', getWirePath(p1.x, p1.y, p2.x, p2.y));
                
                const p1Str = wire.sourcePort;
                const p2Str = wire.targetPort;
                if(['L1', 'R', 'U', 'U1', '1(L1)', '2(T1)', '1'].includes(p1Str) || ['L1', 'R', 'U', 'U1', '1(L1)', '2(T1)', '1'].includes(p2Str)) wire.pathEl.style.stroke = '#3b82f6';
                else if(['L2', 'S', 'V', 'V1', '3(L2)', '4(T2)', '3'].includes(p1Str) || ['L2', 'S', 'V', 'V1', '3(L2)', '4(T2)', '3'].includes(p2Str)) wire.pathEl.style.stroke = '#f97316';
                else if(['L3', 'T', 'W', 'W1', '5(L3)', '6(T3)', '5'].includes(p1Str) || ['L3', 'T', 'W', 'W1', '5(L3)', '6(T3)', '5'].includes(p2Str)) wire.pathEl.style.stroke = '#8b5cf6';
                else if(['PE'].includes(p1Str) || ['PE'].includes(p2Str)) wire.pathEl.style.stroke = '#22c55e';
                else if(['N', 'N\'', '0V', 'M', 'Neutro'].includes(p1Str) || ['N', 'N\'', '0V', 'M', 'Neutro'].includes(p2Str)) wire.pathEl.style.stroke = '#0ea5e9';
                else wire.pathEl.style.stroke = '#ef4444';
            }
        }

        function updateAllWires() {
            wires.forEach(w => updateWirePath(w));
        }

        function setupNodeDragging(handleEl, nodeEl, id) {
            let isDragging = false;
            let startX, startY, initialX, initialY;

            function onPointerDown(e) {
                if(e.target.closest('button')) return; 
                if(e.shiftKey) return; 
                
                isDragging = true;
                nodeEl.classList.add('dragging');
                
                startX = e.clientX || (e.touches && e.touches[0].clientX);
                startY = e.clientY || (e.touches && e.touches[0].clientY);
                initialX = parseFloat(nodeEl.style.left) || 0;
                initialY = parseFloat(nodeEl.style.top) || 0;
                
                document.addEventListener('pointermove', onPointerMove);
                document.addEventListener('pointerup', onPointerUp);
                document.addEventListener('touchmove', onPointerMove, {passive: false});
                document.addEventListener('touchend', onPointerUp);
                
                if(!e.touches) e.preventDefault(); 
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                
                let currentX = e.clientX || (e.touches && e.touches[0].clientX);
                let currentY = e.clientY || (e.touches && e.touches[0].clientY);

                const dx = (currentX - startX) / scale;
                const dy = (currentY - startY) / scale;
                
                let newX = initialX + dx;
                let newY = initialY + dy;
                
                nodeEl.style.left = newX + 'px';
                nodeEl.style.top = newY + 'px';
                
                const nodeData = nodes.find(n => n.id === id);
                if(nodeData) {
                    nodeData.x = newX;
                    nodeData.y = newY;
                    wires.forEach(w => {
                        if (w.sourceNode === id || w.targetNode === id) updateWirePath(w);
                    });
                }
            }

            function onPointerUp() {
                isDragging = false;
                nodeEl.classList.remove('dragging');
                document.removeEventListener('pointermove', onPointerMove);
                document.removeEventListener('pointerup', onPointerUp);
                document.removeEventListener('touchmove', onPointerMove);
                document.removeEventListener('touchend', onPointerUp);
            }

            handleEl.addEventListener('pointerdown', onPointerDown);
            handleEl.addEventListener('touchstart', onPointerDown, {passive: false});
        }

        function deleteComponent(id) {
            const el = document.getElementById(id);
            if(el) el.remove();
            nodes = nodes.filter(n => n.id !== id);
            
            const wiresToRemove = wires.filter(w => w.sourceNode === id || w.targetNode === id);
            wiresToRemove.forEach(w => { if(w.pathEl) w.pathEl.remove(); });
            wires = wires.filter(w => w.sourceNode !== id && w.targetNode !== id);
        }

        function deleteWire(id) {
            const wire = wires.find(w => w.id === id);
            if (wire) {
                wire.pathEl.remove();
                wires = wires.filter(w => w.id !== id);
            }
        }

        function clearWorkspace(bypassConfirm = false) {
            if(!bypassConfirm && !confirm("Deseja apagar todo o projeto atual?")) return;
            componentsContainer.innerHTML = '';
            wireLayer.innerHTML = '';
            nodes = [];
            wires = [];
            nodeIdCounter = 0;
            wireIdCounter = 0;
            document.getElementById('welcome-text').style.display = 'flex';
            if(!bypassConfirm) showToast("Bancada limpa.", 'success');
        }

        function exportCircuit() {
            if(nodes.length === 0) {
                showToast("Não há nada na bancada para salvar.", 'error');
                return;
            }
            
            const data = {
                nodes: nodes.map(n => ({ id: n.id, type: n.type, x: n.x, y: n.y })),
                wires: wires.map(w => ({ id: w.id, srcN: w.sourceNode, srcP: w.sourcePort, tgtN: w.targetNode, tgtP: w.targetPort }))
            };
            
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "meu_diagrama_motor.json");
            dlAnchorElem.click();
            showToast("Projeto Salvo!", 'success');
        }

        function importCircuit(event) {
            const file = event.target.files[0];
            if(!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    clearWorkspace(true);
                    
                    data.nodes.forEach(n => {
                        createComponent(n.type, n.x, n.y, n.id);
                    });
                    
                    setTimeout(() => {
                        data.wires.forEach(w => {
                            createWire(w.srcN, w.srcP, w.tgtN, w.tgtP, w.id);
                        });
                        document.getElementById('welcome-text').style.display = 'none';
                        showToast("Projeto Carregado!", 'success');
                        event.target.value = ''; 
                    }, 50);
                    
                } catch(err) {
                    showToast("Arquivo inválido.", 'error');
                    console.error(err);
                }
            };
            reader.readAsText(file);
        }

        function showHelp() {
            alert("CAD Pro - Instruções:\n\n1. Oculte a biblioteca no botão do menu superior.\n2. Zoom: Role o scroll do mouse ou faça movimento de pinça no celular.\n3. Pan (Mover tela): Segure SHIFT + Clique, ou toque com 1 dedo no fundo e arraste.\n4. Apostila: Clique no botão da biblioteca para abrir as lições de montagem.\n5. O sistema salva em .json localmente em seu PC.");
        }

        function showToast(message, type='info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            if(type === 'error') toast.style.borderLeftColor = '#ef4444';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => {

        // NOVO MOTOR DA SIMULAÇÃO MULTI-PASS (Resolve o problema do Botão Desliga no Contato de Selo)
        function simulateElectricalNetwork() {
            let networkStabilized = false;
            let outerLoops = 10; 
            let portSignals = {};

            while (!networkStabilized && outerLoops > 0) {
                networkStabilized = true;
                outerLoops--;

                portSignals = {}; 
                wires.forEach(w => { w.energized = false; });
                
                const getSignals = (nId, pName) => {
                    const key = `${nId}_${pName}`;
                    if(!portSignals[key]) portSignals[key] = new Set();
                    return portSignals[key];
                };
                
                const addSignal = (nId, pName, signal) => {
                    const sigs = getSignals(nId, pName);
                    if(!sigs.has(signal)) { sigs.add(signal); return true; }
                    return false;
                };

                nodes.forEach(n => {
                    if(n.type === 'rede_trifasica') { addSignal(n.id, 'L1', 'L1'); addSignal(n.id, 'L2', 'L2'); addSignal(n.id, 'L3', 'L3'); addSignal(n.id, 'PE', 'PE'); }
                    if(n.type === 'rede_monofasica') { addSignal(n.id, 'L', 'L1'); addSignal(n.id, 'N', 'N'); addSignal(n.id, 'PE', 'PE'); }
                    if(n.type === 'fonte_24v') { addSignal(n.id, '+24V', '+24V'); addSignal(n.id, '0V', '0V'); }
                    if(n.type === 'rede_cc_bateria') { addSignal(n.id, '+24V', '+24V'); addSignal(n.id, '0V', '0V'); }
                    if(n.type === 'barra_terra') { addSignal(n.id, 'PE_IN', 'PE'); }
                    if(n.type === 'barra_neutro') { addSignal(n.id, 'N_IN', 'N'); }
                });

                // 2. Loop de Propagação Elétrica (Até estabilizar a tensão)
                let changed = true;
                let maxLoops = 50; 
                while(changed && maxLoops > 0) {
                    changed = false;
                    maxLoops--;

                    wires.forEach(w => {
                        const srcSigs = getSignals(w.sourceNode, w.sourcePort);
                        const tgtSigs = getSignals(w.targetNode, w.targetPort);
                        srcSigs.forEach(sig => { if(addSignal(w.targetNode, w.targetPort, sig)){ changed=true; w.energized=true;} });
                        tgtSigs.forEach(sig => { if(addSignal(w.sourceNode, w.sourcePort, sig)){ changed=true; w.energized=true;} });
                    });

                    nodes.forEach(n => {
                        let isActive = n.el.dataset.simActive === "true";
                        const passThrough = (inPort, outPort) => {
                            const inSigs = getSignals(n.id, inPort);
                            const outSigs = getSignals(n.id, outPort);
                            inSigs.forEach(sig => { if(addSignal(n.id, outPort, sig)) changed=true; });
                            outSigs.forEach(sig => { if(addSignal(n.id, inPort, sig)) changed=true; }); 
                        };

                        if (isActive || ['barra_terra', 'barra_neutro', 'fusivel_seccionadora', 'rele_termico', 'dps', 'dr_tetrapolar'].includes(n.type)) {
                            const template = componentLibrary.find(c => c.type === n.type);
                            if (template) {
                                const ins = template.inputs;
                                const outs = template.outputs;
                                const min = Math.min(ins.length, outs.length);
                                for(let i=0; i<min; i++) {
                                    if(ins[i] !== 'A1' && outs[i] !== 'A2' && ins[i] !== '95' && ins[i] !== '13' && ins[i] !== '21') passThrough(ins[i], outs[i]);
                                }
                                if (n.type === 'contator' || n.type === 'botoeira_na' || n.type === 'chave_seletora' || n.type === 'rele_temporizador') passThrough('13', '14');
                                if (n.type === 'dr_tetrapolar') passThrough('N', 'N\'');
                            }
                        }

                        if (!isActive) {
                            if (['botoeira_nf', 'botoeira_emergencia', 'fim_de_curso'].includes(n.type)) passThrough('11', '12');
                            if (n.type === 'rele_termico') passThrough('95', '96');
                            if (n.type === 'rele_temporizador') passThrough('15', '16');
                            if (n.type === 'contator') passThrough('21', '22');
                        } else {
                            if (n.type === 'rele_termico') passThrough('97', '98');
                            if (n.type === 'chave_seletora') passThrough('13', '14(Auto)');
                            if (n.type === 'rele_temporizador') passThrough('15', '18');
                            if (n.type === 'fim_de_curso') passThrough('13', '14'); 
                        }
                    });
                }

                nodes.forEach(n => {
                    if (n.type === 'contator' || n.type === 'rele_temporizador' || n.type === 'rele_auxiliar') {
                        if (n.el.classList.contains('manual-override')) return; // Usuário forçou com o dedo

                        const a1 = getSignals(n.id, 'A1');
                        const a2 = getSignals(n.id, 'A2');
                        
                        const coilPowered = (a1.has('+24V') || a1.has('L1') || a1.has('L2') || a1.has('L3') || a1.has('L')) && 
                                            (a2.has('0V') || a2.has('N') || a2.has('L2') || a2.has('L3') || a2.has('PE'));
                        
                        const currentlyActive = n.el.dataset.simActive === "true";

                        // Atraca o contator
                        if (coilPowered && !currentlyActive) {
                            n.el.dataset.simActive = "true";
                            n.el.classList.add('component-active-glow');
                            networkStabilized = false; // Como o contator atracou, precisamos recalcular a energia (Contatos 13-14 fecharam)
                        } 
                        // Desatraca o contator
                        else if (!coilPowered && currentlyActive) {
                            n.el.dataset.simActive = "false";
                            n.el.classList.remove('component-active-glow');
                            networkStabilized = false; // Recalcular energia sem a passagem do contator
                        }
                    }
                });
            }

            // ATUALIZAÇÃO VISUAL (Depois da engine matemática rodar completamente)
            wires.forEach(w => {
                if(w.energized) w.pathEl.classList.add('wire-energized');
                else w.pathEl.classList.remove('wire-energized');
            });

            nodes.forEach(n => {
                // Rotação de Motores
                if (n.type.includes('motor')) {
                    const u = portSignals[`${n.id}_U1`] || portSignals[`${n.id}_U`] || portSignals[`${n.id}_1U`] || portSignals[`${n.id}_Fase`] || portSignals[`${n.id}_A1(+)`];
                    const v = portSignals[`${n.id}_V1`] || portSignals[`${n.id}_V`] || portSignals[`${n.id}_1V`];
                    const w = portSignals[`${n.id}_W1`] || portSignals[`${n.id}_W`] || portSignals[`${n.id}_1W`] || portSignals[`${n.id}_Neutro`] || portSignals[`${n.id}_A2(-)`];
                    
                    let spinning = false;
                    let dir = 'cw';

                    if (u && w && (n.type === 'motor_1f' || n.type === 'motor_cc')) {
                        if (u.size > 0 && w.size > 0) spinning = true;
                    } else if (u && v && w) {
                        if (u.size > 0 && v.size > 0 && w.size > 0) {
                            spinning = true;
                            if (v.has('L3') || w.has('L2')) dir = 'ccw';
                        }
                    }

                    let gear = n.el.querySelector('.sim-gear');
                    if (spinning) {
                        if (!gear) {
                            gear = document.createElement('i');
                            gear.style.top = '50%';
                            gear.style.left = '50%';
                            gear.style.pointerEvents = 'none';
                            n.el.querySelector('.component-body').appendChild(gear);
                        }
                        gear.className = `fa-solid fa-gear sim-gear absolute text-4xl opacity-90 ${dir === 'cw' ? 'spin-cw' : 'spin-ccw'}`;
                    } else {
                        if (gear) gear.remove();
                    }
                }
                
                // Lâmpadas, Sirene
                if (n.type.includes('sinaleiro') || n.type === 'sirene_alarme' || n.type === 'lampada_simples') {
                    const x1 = portSignals[`${n.id}_X1`] || portSignals[`${n.id}_F`];
                    if (x1 && x1.size > 0) n.el.classList.add('component-active-glow');
                    else n.el.classList.remove('component-active-glow');
                }
            });
        }

        /* LÓGICA DO MODAL FLUTUANTE (ARRASTAR) */
        let isDraggingModal = false;
        let modalOffsetX = 0;
        let modalOffsetY = 0;

        function initModalDrag() {
            const header = document.getElementById('manual-modal-header');
            const modal = document.getElementById('manual-modal');
            
            header.addEventListener('mousedown', (e) => {
                isDraggingModal = true;
                const rect = modal.getBoundingClientRect();
                modalOffsetX = e.clientX - rect.left;
                modalOffsetY = e.clientY - rect.top;
                document.addEventListener('mousemove', onModalDrag);
                document.addEventListener('mouseup', onModalStopDrag);
            });
            
            header.addEventListener('touchstart', (e) => {
                isDraggingModal = true;
                const rect = modal.getBoundingClientRect();
                modalOffsetX = e.touches[0].clientX - rect.left;
                modalOffsetY = e.touches[0].clientY - rect.top;
                document.addEventListener('touchmove', onModalTouchDrag, {passive: false});
                document.addEventListener('touchend', onModalStopDrag);
            }, {passive: false});
        }
        
        function onModalDrag(e) {
            if(!isDraggingModal) return;
            const modal = document.getElementById('manual-modal');
            modal.style.left = (e.clientX - modalOffsetX) + 'px';
            modal.style.top = (e.clientY - modalOffsetY) + 'px';
            modal.style.transform = 'none'; 
        }

        function onModalTouchDrag(e) {
            if(!isDraggingModal) return;
            e.preventDefault();
            const modal = document.getElementById('manual-modal');
            modal.style.left = (e.touches[0].clientX - modalOffsetX) + 'px';
            modal.style.top = (e.touches[0].clientY - modalOffsetY) + 'px';
            modal.style.transform = 'none';
        }

        function onModalStopDrag() {
            isDraggingModal = false;
            document.removeEventListener('mousemove', onModalDrag);
            document.removeEventListener('mouseup', onModalStopDrag);
            document.removeEventListener('touchmove', onModalTouchDrag);
            document.removeEventListener('touchend', onModalStopDrag);
        }

                            <p>O relé térmico é utilizado principalmente para proteção contra sobrecarga de motores. Ele atua quando a corrente permanece acima do valor ajustado. Um circuito de comando deve possuir proteção adequada (Disjuntores, Fusíveis).</p>
                        </div>
                    </div>
                `
            },
            {
                id: 'modulo_3_sinalizacao_sensores',
                title: 'Sinalização e Sensores',
                icon: 'fa-lightbulb',
                content: `
                    <h3 class="text-2xl font-bold text-white mb-4 border-b border-slate-600 pb-2">Sinalização Elétrica e Automação</h3>
                    <div class="space-y-6 text-slate-300">
                        <div>
                            <h4 class="text-lg font-bold text-blue-400 mb-2">16 a 21. SINALIZAÇÃO ELÉTRICA, LÂMPADAS E SIRENES</h4>
                            <p>A sinalização permite informar ao operador o estado de funcionamento de um sistema. Pode indicar: Equipamento ligado/desligado; Falha; Sobrecarga; Modo automático/manual.</p>
                            <p class="mt-2">Exemplos práticos:</p>
                            <ul class="list-disc list-inside mt-2 space-y-1 bg-slate-700/30 p-4 rounded">
                                <li><strong>LIGADO:</strong> Contato auxiliar NA fecha e acende a lâmpada indicando motor ligado.</li>
                                <li><strong>FALHA DE SOBRECARGA:</strong> Motor em sobrecarga → Relé térmico atua → Contator desenergiza → Contato auxiliar de sinalização do relé muda de estado → Sinaleiro/Sirene de falha é acionado.</li>
                            </ul>
                        </div>
                        
                        <div>
                            <h4 class="text-lg font-bold text-blue-400 mb-2">22. COMANDO MANUAL E AUTOMÁTICO</h4>
                            <p><strong>MANUAL:</strong> O operador controla diretamente (pressiona LIGA).<br><strong>AUTOMÁTICO:</strong> O equipamento é acionado por sensores ou condições programadas (ex: boia envia comando).</p>
                        </div>
                        
                        <div>
                            <h4 class="text-lg font-bold text-blue-400 mb-2">23 a 27. CHAVES SELETORAS, SENSORES E TEMPORIZADORES</h4>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li><strong>Chave Seletora:</strong> Permite escolher o modo MANUAL / DESLIGADO / AUTOMÁTICO.</li>
                                <li><strong>Sensor de Nível (Boia):</strong> Controla bombas (ex: Nível baixo → liga; Nível adequado → desliga).</li>
                                <li><strong>Fim de Curso:</strong> Detecta a posição de um mecanismo (portões, esteiras).</li>
                                <li><strong>Pressostato:</strong> Utiliza a pressão de um sistema para realizar uma função (compressores).</li>
                                <li><strong>Temporizador:</strong> Cria atrasos no circuito (ligar/desligar após tempo, alternar cargas).</li>
                            </ul>
                        </div>
                    </div>
                `
            },
            {
                id: 'modulo_4_motores_pratica',
                title: 'Motores e Diagnóstico',
                icon: 'fa-cogs',
                content: `
                    <h3 class="text-2xl font-bold text-white mb-4 border-b border-slate-600 pb-2">Motores, Acionamentos e Práticas</h3>
                    <div class="space-y-6 text-slate-300">
                        <div>
                            <h4 class="text-lg font-bold text-blue-400 mb-2">28 e 29. COMANDO DE MOTOR E PARTIDA DIRETA</h4>
                            <p>Um circuito de comando de motor separa o CIRCUITO DE POTÊNCIA e o CIRCUITO DE COMANDO.</p>
                            <p class="mt-2 bg-slate-700/50 p-2 rounded text-sm">REDE → PROTEÇÃO → CONTATOR → RELÉ TÉRMICO → MOTOR</p>
                            <p class="mt-2">A partida direta é simples: O operador pressiona LIGA → bobina energiza → contatos fecham → motor liga e o selo o mantém. Para desligar, pressione DESLIGA.</p>
                        </div>
                        
                        <div>
                            <h4 class="text-lg font-bold text-blue-400 mb-2">30. REVERSÃO DE MOTOR e 31. INTERTRAVAMENTO</h4>
                            <p>A reversão permite alterar o sentido de rotação de um motor trifásico. Normalmente utiliza dois contatores, onde um realiza o sentido contrário alterando a sequência de fases.</p>
                            <p class="mt-2 text-red-400 font-bold">IMPORTANTE: Os dois contatores não podem fechar simultaneamente. Deve existir intertravamento elétrico: CONTATOR K1 possui contato NF de K2 no comando, impedindo o acionamento simultâneo.</p>
                        </div>
                        
                        <div>
                            <h4 class="text-lg font-bold text-blue-400 mb-2">36. COMO INTERPRETAR UM COMANDO ELÉTRICO</h4>
                            <ol class="list-decimal list-inside mt-2 bg-slate-700/30 p-4 rounded space-y-1 text-sm text-slate-300">
                                <li>Identifique a alimentação e as proteções.</li>
                                <li>Localize o circuito de comando e botoeiras.</li>
                                <li>Identifique os contatos NA, NF e as bobinas.</li>
                                <li>Acompanhe o circuito desde a alimentação até o retorno.</li>
                                <li>Analise o que acontece quando cada dispositivo muda de estado.</li>
                            </ol>
                        </div>
                        
                        <div>
                            <h4 class="text-lg font-bold text-blue-400 mb-2">37. PRINCÍPIO FUNDAMENTAL (As 3 Perguntas)</h4>
                            <p><strong>1. QUEM COMANDA?</strong> (Botoeira, sensor, controlador).<br>
                            <strong>2. QUEM EXECUTA?</strong> (Relé ou contator).<br>
                            <strong>3. O QUE É CONTROLADO?</strong> (Motor, lâmpada, carga).</p>
                        </div>

                        <div class="bg-blue-900/40 border border-blue-500/50 p-4 rounded-lg mt-6">
                            <h4 class="text-lg font-bold text-white mb-2">CONCLUSÃO E OBJETIVO</h4>
                            <p class="text-sm">Os comandos elétricos constituem uma das principais bases da instalação e automação elétrica. O domínio dos circuitos começa com comandos simples, como uma lâmpada acionada por interruptor, e evolui para sistemas com contatores, relés, temporizadores, sensores, motores e sinalização. Lembre-se sempre da segurança e normas vigentes.</p>
                        </div>
                    </div>
                `
            },
            {
                id: 'diagramas_img',
                title: 'Diagramas Visuais (Imagens)',
                icon: 'fa-images',
                content: `
                    <h3 class="text-2xl font-bold text-white mb-4 border-b border-slate-600 pb-2">Diagramas de Força e Comando</h3>
                    <p class="text-slate-300 mb-4">Utilize as imagens abaixo como base de referência definitiva para montar suas ligações no painel do simulador interativo.</p>
                    
                    <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700 mb-6">
                        <img src="1000497362.png" class="w-full h-auto rounded shadow-lg mx-auto" alt="Diagramas de Força e Comando Parte 1">
                    </div>
                    
                    <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700">
                        <img src="1000497361.png" class="w-full h-auto rounded shadow-lg mx-auto" alt="Diagramas de Força e Comando Parte 2">
                    </div>
                `
            },
            {
                id: 'dicionario_equipamentos',
                title: 'Dicionário de Biblioteca',
                icon: 'fa-list-ul',
                content: `
                    <h3 class="text-2xl font-bold text-white mb-4 border-b border-slate-600 pb-2">Dicionário da Biblioteca Industrial</h3>
                    <p class="text-slate-300 mb-6">Consulte abaixo todos os componentes do sistema, como usar e onde ligar.</p>
                    <div id="dic-content" class="space-y-4 pb-10"></div>
                `
            }
        ];

        function initManual() {
            const listContainer = document.getElementById('manual-lessons-list');
            listContainer.innerHTML = '';
            
            manualLessons.forEach((lesson, index) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-3 rounded-lg hover:bg-slate-700 transition-colors flex items-center gap-3 text-slate-300 hover:text-white border border-transparent hover:border-slate-600';
                btn.innerHTML = `<div class="w-8 h-8 rounded bg-slate-800 flex items-center justify-center shrink-0 border border-slate-700"><i class="fa-solid ${lesson.icon}"></i></div> <div><div class="font-bold text-sm leading-tight">${lesson.title}</div><div class="text-xs text-slate-500">Documentação</div></div>`;
                
                btn.onclick = () => loadLesson(lesson.id, btn);
                listContainer.appendChild(btn);
            });
        }

        function loadLesson(id, btnElement) {
            document.querySelectorAll('#manual-lessons-list button').forEach(b => b.classList.remove('bg-blue-600/20', 'border-blue-500/50'));
            if(btnElement) btnElement.classList.add('bg-blue-600/20', 'border-blue-500/50');
            
            const lesson = manualLessons.find(l => l.id === id);
            if(lesson) {
                document.getElementById('manual-lesson-content').innerHTML = lesson.content;
                
                // Gerador dinâmico do Dicionário Completo de Equipamentos da Biblioteca
                if (id === 'dicionario_equipamentos') {
                    let html = '';
                    componentLibrary.forEach(c => {
                        let miniSvg = c.svg.replace('width="100%"', 'width="50"').replace('height="100%"', 'height="50"');
                        html += `
                        <div class="bg-slate-700/40 p-4 rounded-lg flex items-center gap-4 border border-slate-600">
                            <div class="w-16 h-16 shrink-0 bg-slate-800 rounded flex items-center justify-center border border-slate-700 shadow-inner">
                                ${miniSvg}
                            </div>
                            <div class="flex-1">
                                <h4 class="text-lg font-bold text-blue-400 mb-0.5">${c.name}</h4>
                                <span class="px-2 py-0.5 bg-slate-800 border border-slate-600 text-[10px] font-bold text-slate-400 rounded uppercase tracking-widest">${c.category}</span>
                                <div class="mt-2 grid grid-cols-2 gap-2 text-xs text-slate-300">
                                    <div><strong class="text-slate-400">Pinos de Entrada:</strong> ${c.inputs.length > 0 ? c.inputs.join(', ') : '-'}</div>
                                    <div><strong class="text-slate-400">Pinos de Saída:</strong> ${c.outputs.length > 0 ? c.outputs.join(', ') : '-'}</div>
                                </div>
                            </div>
                        </div>`;
                    });
                    document.getElementById('dic-content').innerHTML = html;
                }
            }
        }

        function openManual() {
            document.getElementById('manual-modal').classList.remove('hidden');
            if(document.getElementById('manual-lessons-list').children.length === 0) {
                initManual();
                setTimeout(() => document.querySelector('#manual-lessons-list button').click(), 50);
            }
        }

        function closeManual() {
            document.getElementById('manual-modal').classList.add('hidden');
        }

        // STARTUP
        window.onload = () => {
            initPalette();
            initModalDrag(); 
            window.addEventListener('resize', updateAllWires);
        };
    </script>
</body>
