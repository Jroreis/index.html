<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltCadPro - A Loja do Eletricista</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --green: #00FF00;
            --green-dark: #00CC00;
            --yellow: #FFD700;
            --bg-dark: #0F172A;
            --bg-darker: #020617;
            --text-light: #E2E8F0;
            --text-muted: #94A3B8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(to bottom, #0F172A, #1E293B, #0F172A);
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 255, 0, 0.2);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            padding: 1rem 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(90deg, var(--green), var(--yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
        }

        .logo img {
            height: 35px;
            width: auto;
            object-fit: contain;
        }

        .admin-btn {
            background: transparent;
            border: 1px solid var(--green);
            color: var(--green);
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            background: rgba(0, 255, 0, 0.1);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .hero {
            padding: 4rem 0;
            text-align: center;
            background: linear-gradient(135deg, rgba(0, 255, 0, 0.05) 0%, rgba(255, 215, 0, 0.05) 100%);
            border-bottom: 1px solid rgba(0, 255, 0, 0.1);
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--text-light);
            font-weight: 700;
        }

        .hero p {
            font-size: 1.125rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .search-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .search-box input {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            display: block;
            padding: 0.75rem 1rem;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: 0.25rem;
            color: var(--text-light);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1.5rem;
            border: 1px solid rgba(0, 255, 0, 0.3);
            background: transparent;
            color: var(--text-light);
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: var(--green);
            color: var(--bg-dark);
            border-color: var(--green);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        .products-section {
            padding: 3rem 0;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .product-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.8));
            border: 1px solid rgba(0, 255, 0, 0.2);
            border-radius: 0.5rem;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            border-color: var(--green);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            transform: translateY(-5px);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background: #ffffff; /* Fundo branco para destacar imagens de produtos */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Mantém a proporção real do produto sem cortar */
            padding: 10px;
        }

        .product-badge {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            background: var(--yellow);
            color: var(--bg-dark);
            padding: 0.25rem 0.75rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .product-badge.aliexpress {
            background: #E82828;
            color: white;
        }
        
        .product-badge.category {
            top: auto;
            bottom: 0.75rem;
            left: 0.75rem;
            background: var(--green);
            color: var(--bg-dark);
        }

        .product-info {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-light);
            line-height: 1.4;
            min-height: 2.8em;
        }

        .product-link {
            margin-top: auto;
            display: inline-block;
            background: linear-gradient(90deg, var(--green), var(--green-dark));
            color: var(--bg-dark);
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.25rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
        }

        .product-link:hover {
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
        }

        .admin-panel {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .admin-panel.active {
            display: flex;
        }

        .admin-content {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
            border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: 0.5rem;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(0, 255, 0, 0.2);
        }

        .admin-header h2 {
            color: var(--green);
            font-size: 1.5rem;
        }

        .admin-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-light);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-light);
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: 0.25rem;
            color: var(--text-light);
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 0.25rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--green), var(--green-dark));
            color: var(--bg-dark);
        }

        .btn-primary:hover {
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
        }

        .btn-secondary:hover {
            border-color: var(--green);
            color: var(--green);
        }

        .products-list {
            margin-top: 2rem;
            max-height: 400px;
            overflow-y: auto;
        }

        .product-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            margin-bottom: 0.5rem;
            border-radius: 0.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-item-title {
            flex: 1;
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .btn-small {
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
            background: transparent;
            border: 1px solid #E82828;
            color: #E82828;
            border-radius: 0.25rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-small:hover {
            background: rgba(232, 40, 40, 0.1);
        }

        footer {
            border-top: 1px solid rgba(0, 255, 0, 0.1);
            padding: 2rem 0;
            text-align: center;
            color: var(--text-muted);
            margin-top: 3rem;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2rem;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo" onclick="showHome()">
                <img src="https://i.postimg.cc/tgn3zz4J/splash-icon.png" alt="VoltCadPro Logo">
                VoltCadPro
            </div>
            <button class="admin-btn" onclick="toggleAdmin()">Painel Admin</button>
        </div>
    </header>

    <div id="homePage">
        <section class="hero">
            <div class="container">
                <h1>A Loja do Eletricista</h1>
                <p>Produtos de qualidade do Mercado Livre e AliExpress</p>
                
                <div class="search-section">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Buscar produtos..." onkeyup="filterProducts()">
                    </div>
                    <div class="filters">
                        <button class="filter-btn active" onclick="setFilter(null, event)">Todos</button>
                        <button class="filter-btn" onclick="setFilter('mercado-livre', event)">Mercado Livre</button>
                        <button class="filter-btn" onclick="setFilter('aliexpress', event)">AliExpress</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="products-section">
            <div class="container">
                <div class="products-grid" id="productsGrid"></div>
            </div>
        </section>
    </div>

    <div class="admin-panel" id="adminPanel">
        <div class="admin-content">
            <div class="admin-header">
                <h2>Painel Admin</h2>
                <div class="admin-actions">
                    <button id="btnChangePassword" class="btn-small hidden" style="border-color: var(--yellow); color: var(--yellow);" onclick="changePassword()">Mudar Senha</button>
                    <button class="close-btn" onclick="toggleAdmin()">✕</button>
                </div>
            </div>

            <div id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="adminEmail" placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="adminPassword" placeholder="Digite sua senha">
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="loginAdmin()">Entrar</button>
                    <button class="btn btn-secondary" onclick="toggleAdmin()">Cancelar</button>
                </div>
            </div>

            <div id="adminDashboard" class="hidden">
                <div class="form-group">
                    <label>Título do Produto</label>
                    <input type="text" id="productTitle" placeholder="Nome do produto">
                </div>
                <div class="form-group">
                    <label>Link de Afiliado (Mercado Livre/AliExpress)</label>
                    <input type="url" id="productLink" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>URL da Imagem do Produto</label>
                    <input type="url" id="productImage" placeholder="https://link-da-imagem.com/foto.jpg">
                </div>
                <div class="form-group">
                    <label>Seção / Categoria</label>
                    <select id="productCategory">
                        <option value="Ferramentas">Ferramentas</option>
                        <option value="Elétrica">Elétrica</option>
                        <option value="Iluminação">Iluminação</option>
                        <option value="Smart Home">Smart Home</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Plataforma</label>
                    <select id="productPlatform">
                        <option value="mercado-livre">Mercado Livre</option>
                        <option value="aliexpress">AliExpress</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="addProduct()">Adicionar Produto</button>
                    <button class="btn btn-secondary" onclick="logoutAdmin()">Sair</button>
                </div>

                <div class="products-list" id="productsList"></div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>© 2026 VoltCadPro - A Loja do Eletricista. Todos os direitos reservados.</p>
        </div>
    </footer>

            { id: 25, title: "Fita Isolante Elétrica 10 Rolos Cores Variadas", platform: "aliexpress", category: "Elétrica", image: "https://m.media-amazon.com/images/I/71K6J-B+BvL._AC_SL1000_.jpg", link: "https://s.click.aliexpress.com/e/_mqWaZZh" },
            { id: 26, title: "Protetor De Surto Eletrônico 6 Tomadas Bivolt", platform: "aliexpress", category: "Elétrica", image: "https://m.media-amazon.com/images/I/51P+R4F3M4L._AC_SL1000_.jpg", link: "https://s.click.aliexpress.com/e/_mPAf1Wj" }
        ];

        let currentFilter = null;
        let searchTerm = "";
        let isLoggedIn = false;
        
        // Sistema de Senha Dinâmica
        const ADMIN_EMAIL = "jroreis4582@gmail.com";
        function getAdminPassword() {
            return localStorage.getItem('voltcadpro_admin_pass') || "admin123";
        }

        function loadData() {
            const saved = localStorage.getItem('voltcadpro_products');
            if (saved) {
                products = JSON.parse(saved);
            }
        }

        function saveData() {
            localStorage.setItem('voltcadpro_products', JSON.stringify(products));
        }

        function renderProducts() {
            const grid = document.getElementById("productsGrid");
            const filtered = products.filter(p => {
                const matchesFilter = !currentFilter || p.platform === currentFilter;
                const matchesSearch = p.title.toLowerCase().includes(searchTerm.toLowerCase());
                return matchesFilter && matchesSearch;
            });

            grid.innerHTML = filtered.map(product => `
                <div class="product-card">
                    <div class="product-image">
                        <img src="${product.image || 'https://via.placeholder.com/200'}" alt="${product.title}">
                        <span class="product-badge ${product.platform === 'aliexpress' ? 'aliexpress' : ''}">
                            ${product.platform === 'mercado-livre' ? 'Mercado Livre' : 'AliExpress'}
                        </span>
                        <span class="product-badge category">
                            ${product.category || 'Geral'}
                        </span>
                    </div>
                    <div class="product-info">
                        <h3 class="product-title">${product.title}</h3>
                        <a href="${product.link}" target="_blank" class="product-link">
                            Comprar Agora
                        </a>
                    </div>
                </div>
            `).join("");
        }

        function setFilter(filter, event) {
            currentFilter = filter;
            document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));
            event.target.classList.add("active");
            renderProducts();
        }

        function filterProducts() {
            searchTerm = document.getElementById("searchInput").value;
            renderProducts();
        }

        function toggleAdmin() {
            const panel = document.getElementById("adminPanel");
            panel.classList.toggle("active");
        }

        function loginAdmin() {
            const email = document.getElementById("adminEmail").value;
            const password = document.getElementById("adminPassword").value;

            if (email === ADMIN_EMAIL && password === getAdminPassword()) {
                isLoggedIn = true;
                document.getElementById("loginForm").classList.add("hidden");
                document.getElementById("adminDashboard").classList.remove("hidden");
                document.getElementById("btnChangePassword").classList.remove("hidden");
                updateProductsList();
            } else {
                alert("Email ou senha incorretos!");
            }
        }

        function logoutAdmin() {
            isLoggedIn = false;
            document.getElementById("loginForm").classList.remove("hidden");
            document.getElementById("adminDashboard").classList.add("hidden");
            document.getElementById("btnChangePassword").classList.add("hidden");
            document.getElementById("adminEmail").value = "";
            document.getElementById("adminPassword").value = "";
        }

        function changePassword() {
            const newPass = prompt("Digite a sua nova senha de administrador:");
            if (newPass && newPass.trim() !== "") {
                localStorage.setItem('voltcadpro_admin_pass', newPass.trim());
                alert("Senha alterada com sucesso! Use a nova senha no próximo login.");
            }
        }

        function addProduct() {
            const title = document.getElementById("productTitle").value;
            const link = document.getElementById("productLink").value;
            const image = document.getElementById("productImage").value || "https://via.placeholder.com/200";
            const category = document.getElementById("productCategory").value;
            const platform = document.getElementById("productPlatform").value;

            if (!title || !link) {
                alert("Preencha todos os campos obrigatórios (Título e Link)!");
                return;
            }

            const newProduct = {
                id: Math.max(...products.map(p => p.id), 0) + 1,
                title,
                link,
                image,
                category,
                platform
            };

            products.push(newProduct);
            saveData();
            renderProducts();
            updateProductsList();

            document.getElementById("productTitle").value = "";
            document.getElementById("productLink").value = "";
            document.getElementById("productImage").value = "";

            alert("Produto adicionado com sucesso!");
        }

        function deleteProduct(id) {
            if (confirm("Tem certeza que deseja deletar este produto?")) {
                products = products.filter(p => p.id !== id);
                saveData();
                renderProducts();
                updateProductsList();
            }
        }

        function updateProductsList() {
            const list = document.getElementById("productsList");
            list.innerHTML = `<h3 style="color: var(--green); margin-bottom: 1rem;">Produtos Cadastrados (${products.length})</h3>` + 
                products.map(p => `
                    <div class="product-item">
                        <span class="product-item-title">${p.title.substring(0, 40)}...</span>
                        <button class="btn-small" onclick="deleteProduct(${p.id})">Deletar</button>
                    </div>
                `).join("");
        }

        function showHome() {
            document.getElementById("adminPanel").classList.remove("active");
        }

        loadData();
        renderProducts();
    </script>
</body>
</html>
