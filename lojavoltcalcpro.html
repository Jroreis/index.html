<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja VoltCalc Pro | O Lugar da Promoção</title>
    <style>
        :root { --bg: #020617; --card: #0f172a; --accent: #39FF14; --text: #f8fafc; --price: #f59e0b; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 50px; }
        
        /* Cabeçalho tipo MarketPlace */
        .header-shop { background: var(--card); padding: 15px; border-bottom: 2px solid var(--accent); text-align: center; font-weight: 800; font-size: 1.2rem; color: var(--accent); }
        
        /* Banner rotativo de ofertas */
        .banner-container { width: 100%; height: 200px; background: #1e293b; display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 1.5rem; font-weight: bold; border-bottom: 4px solid var(--accent); margin-bottom: 20px; }

        /* Vitrine de Conversão Rápida */
        .vitrine { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
        .produto-card { background: var(--card); border-radius: 10px; padding: 10px; border: 1px solid #1e293b; display: flex; flex-direction: column; }
        .produto-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
        .produto-card h3 { font-size: 0.9rem; margin: 5px 0; height: 35px; overflow: hidden; }
        .preco { color: var(--price); font-weight: 800; font-size: 1.1rem; margin: 5px 0; }
        .btn-compra { background: var(--accent); color: #020617; border: none; padding: 10px; border-radius: 6px; font-weight: 800; text-transform: uppercase; cursor: pointer; font-size: 0.8rem; }
        
        .destaque-label { background: #ef4444; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; align-self: flex-start; }
    </style>
</head>
<body>

    <header class="header-shop">LOJA VOLTCALC PRO | O LUGAR DA PROMOÇÃO</header>

    <div class="banner-container" id="bannerRotativo">
        OFERTAS FLASH 24H
    </div>

    <main class="vitrine" id="vitrineProdutos">
        <!-- JS injeta os produtos -->
    </main>

    <script>
        const produtos = [
            { nome: "Multímetro Profissional Digital", preco: "R$ 159,90", img: "22146.png", dest: "OFERTA" },
            { nome: "Alicate Amperímetro Profissional", preco: "R$ 229,00", img: "22146.png", dest: "TOP VENDAS" },
            { nome: "Kit de Chaves Isoladas 1000V", preco: "R$ 89,90", img: "22146.png", dest: "OFERTA" },
            { nome: "Furadeira de Impacto Industrial", preco: "R$ 349,00", img: "22146.png", dest: "NOVO" }
        ];

        function renderizar() {
            const container = document.getElementById('vitrineProdutos');
            container.innerHTML = produtos.map(p => `
                <div class="produto-card">
                    <span class="destaque-label">${p.dest}</span>
                    <img src="${p.img}" alt="${p.nome}">
                    <h3>${p.nome}</h3>
                    <div class="preco">${p.preco}</div>
                    <button class="btn-compra" onclick="window.location='#'">Comprar Agora</button>
                </div>
            `).join('');
        }
        
        // Simula rotação de banner
        setInterval(() => {
            document.getElementById('bannerRotativo').textContent = Math.random() > 0.5 ? "FRETE GRÁTIS HOJE!" : "OFERTAS FLASH 24H";
        }, 3000);

        renderizar();
    </script>
</body>
</html>
