<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm & Defend - Game Over</title>
    <style>
        body { margin: 0; background: #111; color: white; text-align: center; overflow: hidden; touch-action: none; font-family: sans-serif;}
        canvas { background: #7ba849; display: block; margin: 0 auto; border: 2px solid #333; }
        
        .ui-container { position: absolute; top: 10px; width: 100%; display: flex; justify-content: center; flex-direction: column; align-items: center; gap: 5px; }
        .inventory { padding: 10px 20px; border-radius: 8px; background: rgba(0,0,0,0.8); display: none; }
        .inventory.active { display: block; border: 3px solid #ffd700; }
        
        #btn-time { padding: 8px 16px; font-weight: bold; border-radius: 8px; border: none; background: #eee; cursor: pointer; }

        .controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: center; gap: 5px; }
        .btn-move { width: 50px; height: 50px; background: rgba(255,255,255,0.3); border-radius: 50%; border: none; color: white; font-size: 18px; }
        .btn-action { width: 60px; height: 60px; background: rgba(255, 50, 50, 0.6); border-radius: 50%; border: 2px solid white; color: white; font-size: 24px; margin-left: 10px; }

        /* NOVO: Estilo da tela de Game Over */
        #game-over-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(150, 0, 0, 0.8); display: none;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 100;
        }
        #game-over-screen h1 { font-size: 40px; margin-bottom: 10px; }
        #btn-restart { padding: 10px 20px; font-size: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="ui-container">
        <!-- NOVO: Mostrar vidas na tela -->
        <div id="lives-display" style="font-size: 20px; font-weight: bold; text-shadow: 2px 2px black;">❤️❤️❤️</div>
        
        <button id="btn-time">Anoitecer</button>
        <div id="inv-farm" class="inventory active">🌱 Plantação</div>
        <div id="inv-def" class="inventory">⚔️ Defesa</div>
    </div>

    <!-- NOVO: Tela de Game Over que aparece por cima do Canvas -->
    <div id="game-over-screen">
        <h1>Fim da Noite</h1>
        <p>Os zumbis invadiram a fazenda!</p>
        <button id="btn-restart" onclick="restartGame()">Tentar Novamente</button>
    </div>

    <canvas id="gameCanvas" width="360" height="500"></canvas>

    <div class="controls">
        <button class="btn-move" onpointerdown="move('left')" onpointerup="stop()">◀️</button>
        <button class="btn-move" onpointerdown="move('up')" onpointerup="stop()">🔼</button>
        <button class="btn-move" onpointerdown="move('down')" onpointerup="stop()">🔽</button>
        <button class="btn-move" onpointerdown="move('right')" onpointerup="stop()">▶️</button>
        <button class="btn-action" onpointerdown="attack()">⚔️</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // NOVIDADE: Adicionado vidas e controle de invencibilidade (para não perder 3 vidas em 1 segundo)
        let player = { x: 160, y: 250, size: 40, speed: 4, dx: 0, dy: 0, isAttacking: false, attackRange: 20 };
        let isDaytime = true;
        let isGameOver = false;
        
        let lives = 3;
        let isInvincible = false; // Pisca vermelho quando toma dano

        let zombies = []; 
        let spawnTimer; // Para podermos pausar o nascimento de zumbis

        const obstacles = [
            { x: 50, y: 100, w: 80, h: 40, color: '#555' }, 
            { x: 200, y: 350, w: 120, h: 20, color: '#8B4513' }, 
            { x: 280, y: 150, w: 60, h: 60, color: '#228B22' } 
        ];

        document.getElementById('btn-time').addEventListener('click', () => {
            if (isGameOver) return; // Trava o botão se o jogo acabou
            
            isDaytime = !isDaytime;
            
            const btn = document.getElementById('btn-time');
            const invFarm = document.getElementById('inv-farm');
            const invDef = document.getElementById('inv-def');
            
            if (isDaytime) {
                btn.innerText = "Anoitecer";
                invFarm.classList.add('active');
                invDef.classList.remove('active');
                zombies = []; 
                clearTimeout(spawnTimer);
            } else {
                btn.innerText = "Amanhecer";
                invFarm.classList.remove('active');
                invDef.classList.add('active');
                spawnZombie(); 
            }
        });

        function spawnZombie() {
            if (!isDaytime && !isGameOver) {
                zombies.push({
                    x: Math.random() * (canvas.width - 30), 
                    y: -30, 
                    size: 30,
                    speed: 1.5,
                    color: '#006400' 
                });
                spawnTimer = setTimeout(spawnZombie, 3000); 
            }
        }

        // NOVIDADE: Checa se o zumbi mordeu o jogador
        function updateZombies() {
            for (let i = zombies.length - 1; i >= 0; i--) {
                let z = zombies[i];
                
                // Zumbi persegue
                if (z.x < player.x) z.x += z.speed;
                if (z.x > player.x) z.x -= z.speed;
                if (z.y < player.y) z.y += z.speed;
                if (z.y > player.y) z.y -= z.speed;

                // Colisão do zumbi com o jogador
                if (!isInvincible && 
                    z.x < player.x + player.size && 
                    z.x + z.size > player.x && 
                    z.y < player.y + player.size && 
                    z.y + z.size > player.y) {
                    
                    takeDamage();
                }
            }
        }

        // NOVIDADE: Lógica de sofrer dano
        function takeDamage() {
            lives--;
            updateLivesDisplay();
            
            if (lives <= 0) {
                triggerGameOver();
            } else {
                // Fica invencível por 1.5 segundos após tomar dano
                isInvincible = true;
                setTimeout(() => { isInvincible = false; }, 1500);
            }
        }

        function updateLivesDisplay() {
            let hearts = "";
            for (let i = 0; i < lives; i++) hearts += "❤️";
            document.getElementById('lives-display').innerText = hearts || "💀";
        }

        // NOVIDADE: Função que congela o jogo e mostra a tela vermelha
        function triggerGameOver() {
            isGameOver = true;
            stop(); // Para o jogador
            document.getElementById('game-over-screen').style.display = 'flex';
        }

        // NOVIDADE: Reseta as variáveis e volta ao dia
        function restartGame() {
            isGameOver = false;
            lives = 3;
            isDaytime = true;
            zombies = [];
            player.x = 160; player.y = 250; // Volta pro meio
            updateLivesDisplay();
            document.getElementById('game-over-screen').style.display = 'none';
            
            // Reseta a interface pro botão do Dia
            document.getElementById('btn-time').innerText = "Anoitecer";
            document.getElementById('inv-farm').classList.add('active');
            document.getElementById('inv-def').classList.remove('active');
        }

        function move(dir) {
            if (isGameOver) return;
            if(dir === 'left') player.dx = -player.speed;
            if(dir === 'right') player.dx = player.speed;
            if(dir === 'up') player.dy = -player.speed;
            if(dir === 'down') player.dy = player.speed;
        }
        function stop() { player.dx = 0; player.dy = 0; }

        function attack() {
            if (isDaytime || player.isAttacking || isGameOver) return; 
            
            player.isAttacking = true;

            for (let i = zombies.length - 1; i >= 0; i--) {
                let z = zombies[i];
                let distX = Math.abs(z.x - player.x);
                let distY = Math.abs(z.y - player.y);
                
                if (distX < player.size + player.attackRange && distY < player.size + player.attackRange) {
                    zombies.splice(i, 1); 
                }
            }

            setTimeout(() => { player.isAttacking = false; }, 200);
        }

        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft') move('left');
            if(e.key === 'ArrowRight') move('right');
            if(e.key === 'ArrowUp') move('up');
            if(e.key === 'ArrowDown') move('down');
            if(e.key === ' ') attack(); 
        });
        window.addEventListener('keyup', stop);

        function checkCollision(nextX, nextY) {
            if (nextX < 0 || nextX + player.size > canvas.width || nextY < 0 || nextY + player.size > canvas.height) return true; 
            for (let obs of obstacles) {
                if (nextX < obs.x + obs.w && nextX + player.size > obs.x && nextY < obs.y + obs.h && nextY + player.size > obs.y) return true; 
            }
            return false; 
        }

        function drawGame() {
            if (!isGameOver) {
                let nextX = player.x + player.dx;
                let nextY = player.y + player.dy;

                if (!checkCollision(nextX, player.y)) player.x = nextX;
                if (!checkCollision(player.x, nextY)) player.y = nextY;

                if (!isDaytime) updateZombies();
            }

            ctx.fillStyle = isDaytime ? '#7ba849' : '#1a1c23';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let obs of obstacles) {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            }

            for (let z of zombies) {
                ctx.fillStyle = z.color;
                ctx.fillRect(z.x, z.y, z.size, z.size);
            }

            if (player.isAttacking) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.fillRect(player.x - 15, player.y - 15, player.size + 30, player.size + 30);
            }

            // O jogador fica "piscando" vermelho quando toma dano (invencibilidade temporária)
            if (isInvincible && Math.floor(Date.now() / 150) % 2 === 0) {
                ctx.fillStyle = '#ff0000'; // Pisca vermelho
            } else {
                ctx.fillStyle = '#ffcc00'; // Cor normal amarelo
            }
            ctx.fillRect(player.x, player.y, player.size, player.size);

            requestAnimationFrame(drawGame);
        }
        drawGame();
    </script>
</body>
</html>
