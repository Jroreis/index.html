<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Farm & Defend - A Lenda da Fazenda</title>
    <style>
        body { margin: 0; padding: 0; background: #7ba849; color: white; text-align: center; overflow: hidden; touch-action: none; font-family: sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .ui-container { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 95%; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 10; }
        .inventory { padding: 5px 10px; border-radius: 8px; background: rgba(0,0,0,0.7); display: none; }
        .inventory.active { display: block; border: 3px solid #ffd700; }
        
        .inventory-title { font-size: 14px; margin-bottom: 5px; color: #ccc; font-weight: bold; text-shadow: 1px 1px 2px black;}
        .inventory-grid { display: flex; gap: 6px; justify-content: center; }
        .slot { width: 45px; height: 45px; background: rgba(255,255,255,0.2); border: 2px solid #777; border-radius: 5px; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .slot.selected { border-color: #ffd700; background: rgba(255, 215, 0, 0.4); transform: scale(1.1); transition: 0.1s; }

        #btn-time { padding: 10px 20px; font-weight: bold; border-radius: 8px; border: none; background: #eee; cursor: pointer; font-size: 16px; box-shadow: 0px 4px 6px rgba(0,0,0,0.3); }
        
        /* NOVIDADE: Botão da Loja */
        #btn-shop { padding: 8px 16px; font-weight: bold; border-radius: 8px; border: none; background: #2e8b57; color: white; cursor: pointer; font-size: 14px; box-shadow: 0px 4px 6px rgba(0,0,0,0.3); display: block; }

        .controls { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px; z-index: 10; }
        .btn-move { width: 60px; height: 60px; background: rgba(0,0,0,0.4); border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); color: white; font-size: 24px; display: flex; justify-content: center; align-items: center; }
        .btn-action { width: 75px; height: 75px; background: rgba(255, 50, 50, 0.7); border-radius: 50%; border: 3px solid rgba(255,255,255,0.8); color: white; font-size: 30px; margin-left: 15px; display: flex; justify-content: center; align-items: center; }

        #game-over-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(150, 0, 0, 0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #game-over-screen h1 { font-size: 40px; margin-bottom: 10px; text-shadow: 2px 2px 4px black; }
        #btn-restart { padding: 15px 30px; font-size: 22px; font-weight: bold; cursor: pointer; border-radius: 10px; border: none; }
    </style>
</head>
<body>

    <div class="ui-container">
        <!-- NOVIDADE: As moedas aparecem ao lado da vida -->
        <div id="stats-display" style="font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px black;">❤️❤️❤️ | 🪙 0</div>
        
        <button id="btn-time">☀️ Dia 1: 15s</button>
        <button id="btn-shop" onclick="buyLife()">🛒 Loja: +1❤️ (50🪙)</button>
        
        <div id="inv-farm" class="inventory active">
            <div class="inventory-title">🌱 Ferramentas da Fazenda</div>
            <div class="inventory-grid">
                <div class="slot selected" onpointerdown="selectTool('farm', 0)">⛏️</div>
                <div class="slot" onpointerdown="selectTool('farm', 1)">💧</div>
                <div class="slot" onpointerdown="selectTool('farm', 2)">🌾</div>
                <!-- NOVIDADE: Martelo de construção de barricadas -->
                <div class="slot" onpointerdown="selectTool('farm', 3)">🔨</div> 
            </div>
        </div>

        <div id="inv-def" class="inventory">
            <div class="inventory-title">⚔️ Defesas</div>
            <div class="inventory-grid">
                <div class="slot selected" onpointerdown="selectTool('def', 0)">🗡️</div>
                <div class="slot" onpointerdown="selectTool('def', 1)">🏹</div>
                <div class="slot" onpointerdown="selectTool('def', 2)">🪵</div>
            </div>
        </div>
    </div>

    <div id="game-over-screen">
        <h1 id="game-over-title">Fim da Linha</h1>
        <p id="game-over-stats" style="font-size: 20px;">Você sobreviveu até o Dia X</p><br>
        <button id="btn-restart" onclick="restartGame()">Tentar Novamente</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls">
        <button class="btn-move" onpointerdown="move('left')" onpointerup="stop()">◀️</button>
        <button class="btn-move" onpointerdown="move('up')" onpointerup="stop()">🔼</button>
        <button class="btn-move" onpointerdown="move('down')" onpointerup="stop()">🔽</button>
        <button class="btn-move" onpointerdown="move('right')" onpointerup="stop()">▶️</button>
        <button class="btn-action" onpointerdown="action()">🎯</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas(); 
        
        let player = { x: window.innerWidth/2, y: window.innerHeight/2, size: 40, speed: 4, dx: 0, dy: 0, isAttacking: false, attackRange: 20, facing: 'down' };
        let isDaytime = true;
        let isGameOver = false;
        
        let lives = 3;
        let isInvincible = false; 
        let diaAtual = 1;
        
        // NOVIDADE: Variáveis de Economia e Construção
        let coins = 0;
        let barricades = []; // Arrays que guarda as cercas

        let zombies = []; 
        let spawnTimer; 
        let timeRemaining = 15; 
        let gameTimer; 

        let currentTool = { farm: 0, def: 0 }; 
        let crops = [];
        let projectiles = [];
        let traps = [];

        const paths = [
            { x: 0, y: window.innerHeight / 2 - 25, w: window.innerWidth, h: 50 },
            { x: window.innerWidth / 2 - 25, y: 0, w: 50, h: window.innerHeight } 
        ];

        const gardenBeds = [
            { x: window.innerWidth / 2 - 160, y: window.innerHeight / 2 - 180, w: 120, h: 140 },
            { x: window.innerWidth / 2 + 40, y: window.innerHeight / 2 - 180, w: 120, h: 140 }  
        ];

        const obstacles = [
            { x: 50, y: 100, w: 80, h: 40, color: '#555' }, 
            { x: window.innerWidth - 150, y: 350, w: 120, h: 20, color: '#8B4513' }, 
            { x: window.innerWidth/2 + 50, y: 150, w: 60, h: 60, color: '#228B22' } 
        ];

        function selectTool(type, index) {
            currentTool[type] = index; 
            const inventoryDiv = document.getElementById(type === 'farm' ? 'inv-farm' : 'inv-def');
            const slots = inventoryDiv.querySelectorAll('.slot');
            slots.forEach((slot, i) => {
                if (i === index) slot.classList.add('selected');
                else slot.classList.remove('selected');
            });
        }

        // NOVIDADE: A função visual agora atualiza as vidas e as moedas ao mesmo tempo
        function updateStatsDisplay() {
            let hearts = "";
            for (let i = 0; i < lives; i++) hearts += "❤️";
            document.getElementById('stats-display').innerText = `${hearts || "💀"} | 🪙 ${coins}`;
        }

        // NOVIDADE: Função da Loja
        function buyLife() {
            if (coins >= 50) {
                coins -= 50;
                lives++;
                updateStatsDisplay();
            } else {
                alert("Moedas insuficientes! Plante e colha mais vegetais.");
            }
        }

        function updateTimeDisplay() {
            const btn = document.getElementById('btn-time');
            if (isDaytime) btn.innerText = `☀️ Dia ${diaAtual}: ${timeRemaining}s (Pular)`;
            else btn.innerText = `🌙 Noite ${diaAtual}: ${timeRemaining}s`;
        }

        function toggleDayNight() {
            if (isGameOver) return; 
            isDaytime = !isDaytime;
            timeRemaining = isDaytime ? 15 : 20; 
            
            const invFarm = document.getElementById('inv-farm');
            const invDef = document.getElementById('inv-def');
            const btnShop = document.getElementById('btn-shop');
            
            if (isDaytime) {
                diaAtual++; 
                invFarm.classList.add('active');
                invDef.classList.remove('active');
                btnShop.style.display = 'block'; // Mostra a loja
                zombies = []; 
                projectiles = []; 
                clearTimeout(spawnTimer);
                
                for (let c of crops) {
                    if (c.state === 'regado') {
                        c.state = 'pronto';
                        c.color = '#ff4500'; 
                    }
                }
            } else {
                invFarm.classList.remove('active');
                invDef.classList.add('active');
                btnShop.style.display = 'none'; // Esconde a loja
                spawnZombie(); 
            }
            updateTimeDisplay();
        }

        function startClock() {
            gameTimer = setInterval(() => {
                if (!isGameOver) {
                    timeRemaining--;
                    if (timeRemaining <= 0) toggleDayNight(); 
                    else updateTimeDisplay();
                }
            }, 1000);
        }

        document.getElementById('btn-time').addEventListener('click', () => {
            if (!isGameOver && isDaytime) toggleDayNight(); 
        });

        function spawnZombie() {
            if (!isDaytime && !isGameOver) {
                let velocidadeZumbi = 1.0 + (diaAtual * 0.3); 
                
                // NOVIDADE: Chance de nascer um Vampiro a partir do Dia 3
                let isVampire = (diaAtual >= 3 && Math.random() < 0.3);

                zombies.push({ 
                    x: Math.random() * (canvas.width - 30), 
                    y: -30, 
                    size: 30, 
                    speed: isVampire ? velocidadeZumbi * 1.5 : velocidadeZumbi, // Vampiro corre 50% mais rápido
                    color: isVampire ? '#4B0082' : '#006400', // Roxo (Vampiro) ou Verde (Zumbi)
                    flying: isVampire // Flag de voar
                });
                
                let tempoNascimento = Math.max(500, 3000 - (diaAtual * 300));
                spawnTimer = setTimeout(spawnZombie, tempoNascimento); 
            }
        }

        function updateZombies() {
            for (let i = zombies.length - 1; i >= 0; i--) {
                let z = zombies[i];
                
                // NOVIDADE: Verifica colisão com Barricadas (Só se não estiver voando!)
                let nextZX = z.x;
                let nextZY = z.y;

                if (z.x < player.x) nextZX += z.speed;
                if (z.x > player.x) nextZX -= z.speed;
                if (z.y < player.y) nextZY += z.speed;
                if (z.y > player.y) nextZY -= z.speed;

                let bateuNaCerca = false;

                if (!z.flying) { // Vampiros ignoram as cercas
                    for (let j = barricades.length - 1; j >= 0; j--) {
                        let b = barricades[j];
                        if (nextZX < b.x + b.size && nextZX + z.size > b.x && nextZY < b.y + b.size && nextZY + z.size > b.y) {
                            bateuNaCerca = true;
                            b.hp -= 1; // Zumbi arranha a cerca
                            if (b.hp <= 0) barricades.splice(j, 1); // Cerca é destruída
                            break;
                        }
                    }
                }

                // Só anda se não bateu na cerca
                if (!bateuNaCerca) {
                    z.x = nextZX;
                    z.y = nextZY;
                }

                if (!isInvincible && z.x < player.x + player.size && z.x + z.size > player.x && z.y < player.y + player.size && z.y + z.size > player.y) {
                    takeDamage();
                }
            }
        }

        function takeDamage() {
            lives--;
            updateStatsDisplay();
            if (lives <= 0) triggerGameOver();
            else {
                isInvincible = true;
                setTimeout(() => { isInvincible = false; }, 1500);
            }
        }

        function triggerGameOver() {
            isGameOver = true;
            stop(); 
            document.getElementById('game-over-stats').innerText = `Você sobreviveu até o Dia ${diaAtual}`;
            document.getElementById('game-over-screen').style.display = 'flex';
        }

        function restartGame() {
            isGameOver = false;
            lives = 3;
            coins = 0; // Reseta as moedas
            diaAtual = 1; 
            isDaytime = true;
            timeRemaining = 15; 
            zombies = [];
            projectiles = [];
            traps = [];
            barricades = []; // Limpa o mapa
            player.x = canvas.width/2; player.y = canvas.height/2; 
            updateStatsDisplay();
            updateTimeDisplay();
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('inv-farm').classList.add('active');
            document.getElementById('inv-def').classList.remove('active');
            document.getElementById('btn-shop').style.display = 'block';
        }

        function move(dir) {
            if (isGameOver) return;
            player.facing = dir; 
            if(dir === 'left') player.dx = -player.speed;
            if(dir === 'right') player.dx = player.speed;
            if(dir === 'up') player.dy = -player.speed;
            if(dir === 'down') player.dy = player.speed;
        }
        function stop() { player.dx = 0; player.dy = 0; }

        function action() {
            if (isGameOver) return;

            if (!isDaytime) {
                if (currentTool.def === 0) { 
                    if (player.isAttacking) return;
                    player.isAttacking = true;
                    for (let i = zombies.length - 1; i >= 0; i--) {
                        let z = zombies[i];
                        if (Math.abs(z.x - player.x) < player.size + player.attackRange && Math.abs(z.y - player.y) < player.size + player.attackRange) {
                            zombies.splice(i, 1); 
                        }
                    }
                    setTimeout(() => { player.isAttacking = false; }, 200);
                }
                else if (currentTool.def === 1) {
                    let pdx = 0, pdy = 0;
                    if (player.facing === 'left') pdx = -8; 
                    if (player.facing === 'right') pdx = 8;
                    if (player.facing === 'up') pdy = -8;
                    if (player.facing === 'down') pdy = 8;
                    
                    projectiles.push({ x: player.x + player.size/2, y: player.y + player.size/2, dx: pdx, dy: pdy, size: 8, color: 'white' });
                }
                else if (currentTool.def === 2) {
                    traps.push({ x: player.x, y: player.y, size: 40, color: '#a0522d' });
                }
            } 
            else {
                if (currentTool.farm === 0) { 
                    let harvested = false;
                    for (let i = crops.length - 1; i >= 0; i--) {
                        let c = crops[i];
                        if (c.state === 'pronto' && Math.abs(c.x - player.x) < 20 && Math.abs(c.y - player.y) < 20) {
                            crops.splice(i, 1); 
                            harvested = true;
                            // NOVIDADE: Ganhou dinheiro pela colheita!
                            coins += 20; 
                            updateStatsDisplay();
                            break;
                        }
                    }
                    if (!harvested) crops.push({ x: player.x, y: player.y, size: 40, state: 'arado', color: '#4a3219' });
                } 
                else if (currentTool.farm === 1) {
                    for (let c of crops) {
                        if (c.state === 'plantado' && Math.abs(c.x - player.x) < 20 && Math.abs(c.y - player.y) < 20) {
                            c.state = 'regado';
                            c.color = '#005f00'; 
                            break; 
                        }
                    }
                }
                else if (currentTool.farm === 2) { 
                    for (let c of crops) {
                        if (c.state === 'arado' && Math.abs(c.x - player.x) < 20 && Math.abs(c.y - player.y) < 20) {
                            c.state = 'plantado';
                            c.color = '#9acd32'; 
                            break; 
                        }
                    }
                }
                // NOVIDADE: Martelo construtor (Custa 10 moedas)
                else if (currentTool.farm === 3) {
                    if (coins >= 10) {
                        coins -= 10;
                        updateStatsDisplay();
                        barricades.push({ x: player.x, y: player.y, size: 40, hp: 150 }); // Cerca tem vida!
                    } else {
                        // Não tem dinheiro
                        document.getElementById('stats-display').style.color = "red";
                        setTimeout(() => document.getElementById('stats-display').style.color = "white", 500);
                    }
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft') move('left');
            if(e.key === 'ArrowRight') move('right');
            if(e.key === 'ArrowUp') move('up');
            if(e.key === 'ArrowDown') move('down');
            if(e.key === ' ') action(); 
        });
        window.addEventListener('keyup', stop);

        function checkCollision(nextX, nextY) {
            if (nextX < 0 || nextX + player.size > canvas.width || nextY < 0 || nextY + player.size > canvas.height) return true; 
            for (let obs of obstacles) {
                if (nextX < obs.x + obs.w && nextX + player.size > obs.x && nextY < obs.y + obs.h && nextY + player.size > obs.y) return true; 
            }
            return false; 
        }

        function updateWeapons() {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.x += p.dx;
                p.y += p.dy;
                
                let hit = false;
                for (let j = zombies.length - 1; j >= 0; j--) {
                    let z = zombies[j];
                    if (p.x > z.x && p.x < z.x + z.size && p.y > z.y && p.y < z.y + z.size) {
                        zombies.splice(j, 1); 
                        hit = true;
                        break;
                    }
                }
                if (hit || p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
                    projectiles.splice(i, 1);
                }
            }

            for (let i = traps.length - 1; i >= 0; i--) {
                let t = traps[i];
                let triggered = false;
                for (let j = zombies.length - 1; j >= 0; j--) {
                    let z = zombies[j];
                    // NOVIDADE: Armadilhas de chão não afetam quem voa (Vampiros)
                    if (Math.abs(z.x - t.x) < 30 && Math.abs(z.y - t.y) < 30 && !z.flying) {
                        zombies.splice(j, 1); 
                        triggered = true;
                        break;
                    }
                }
                if (triggered) traps.splice(i, 1);
            }
        }

        function drawGame() {
            if (!isGameOver) {
                let nextX = player.x + player.dx;
                let nextY = player.y + player.dy;

                if (!checkCollision(nextX, player.y)) player.x = nextX;
                if (!checkCollision(player.x, nextY)) player.y = nextY;

                if (!isDaytime) {
                    updateZombies();
                    updateWeapons();
                }
            }

            ctx.fillStyle = isDaytime ? '#7ba849' : '#1a1c23';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = isDaytime ? '#d2b48c' : '#5c4a3d'; 
            for (let p of paths) ctx.fillRect(p.x, p.y, p.w, p.h);

            for (let g of gardenBeds) {
                ctx.fillStyle = isDaytime ? '#654321' : '#3b2f2f'; 
                ctx.fillRect(g.x, g.y, g.w, g.h);
                ctx.strokeStyle = isDaytime ? '#3e2723' : '#1a100e';
                ctx.lineWidth = 6;
                ctx.strokeRect(g.x, g.y, g.w, g.h);
            }

            for (let c of crops) {
                ctx.fillStyle = c.color;
                ctx.fillRect(c.x, c.y, c.size, c.size);
            }

            for (let t of traps) {
                ctx.fillStyle = t.color;
                ctx.fillRect(t.x + 5, t.y + 5, t.size - 10, t.size - 10);
                ctx.fillStyle = '#fff';
                ctx.fillRect(t.x + 15, t.y + 15, 10, 10);
            }

            for (let obs of obstacles) {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            }

            // NOVIDADE: Desenha as Cercas do Jogador (Barricadas)
            for (let b of barricades) {
                ctx.fillStyle = '#cda177'; // Cor de tábua clara
                ctx.fillRect(b.x, b.y, b.size, b.size);
                // Desenha linhas pra parecer madeira
                ctx.fillStyle = '#8b5a2b';
                ctx.fillRect(b.x, b.y + 10, b.size, 5);
                ctx.fillRect(b.x, b.y + 25, b.size, 5);
            }

            for (let z of zombies) {
                ctx.fillStyle = z.color;
                ctx.fillRect(z.x, z.y, z.size, z.size);
            }

            for (let p of projectiles) {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }

            if (player.isAttacking) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.fillRect(player.x - 15, player.y - 15, player.size + 30, player.size + 30);
            }

            if (isInvincible && Math.floor(Date.now() / 150) % 2 === 0) {
                ctx.fillStyle = '#ff0000'; 
            } else {
                ctx.fillStyle = '#ffcc00'; 
            }
            ctx.fillRect(player.x, player.y, player.size, player.size);

            requestAnimationFrame(drawGame);
        }

        updateStatsDisplay(); // Inicializa mostrando 0 moedas
        updateTimeDisplay();
        startClock();
        drawGame();
    </script>
</body>
</html>
